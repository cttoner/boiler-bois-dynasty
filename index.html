function TradesTab({ transactions, rostersById, usersById, players, seasonHistory, currentSeason, weekMatchups, seasonType }) {
  const [page, setPage] = useState(0);
  const [filterOwnerId, setFilterOwnerId] = useState("all");
  const PAGE_SIZE = 8;

  function playerLabel(pid) {
    const p = players[pid];
    if (!p) return pid;
    return `${p.first_name || ""} ${p.last_name || ""}`.trim();
  }

  function formatDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // This season's per-owner player totals, computed the same way the
  // historical season walk already does, so a trade's aging stat can keep
  // accumulating into whatever season is currently live.
  const currentOwnerBreakdown = useMemo(
    () => computeOwnerBreakdownFromWeeks(weekMatchups, Object.values(rostersById)),
    [weekMatchups, rostersById]
  );

  // Points a traded player has scored specifically while on the receiving
  // team, starting the moment the trade happened and continuing through
  // every season since, for as long as they've actually stayed on that
  // roster. The moment they leave (traded again or dropped), a season's
  // per-owner total for them stops accruing on its own, since it's built
  // from real matchup ownership, not an assumption they stayed put.
  function computePointsSinceTrade(t, pid, ownerId) {
    const tradeSeasonNum = Number(t.season);
    let total = 0;

    const tradeSeasonMatchups = weekMatchupsBySeason[t.season];
    if (tradeSeasonMatchups) {
      total += computePointsSinceWeek(pid, t.leg || 1, tradeSeasonMatchups);
    }

    (seasonHistory || []).forEach((s) => {
      if (Number(s.season) > tradeSeasonNum) {
        total += s.ownerPlayerTotals?.[ownerId]?.[pid] || 0;
      }
    });

    if (Number(currentSeason) > tradeSeasonNum) {
      total += currentOwnerBreakdown.playerTotals?.[ownerId]?.[pid] || 0;
    }

    return total;
  }

  // Sub-classify a round-0 (before Week 1) trade as preseason (roughly
  // August) versus deep offseason (everything else), just for a nicer
  // label. The round-0 vs real-week distinction itself is reliable; this
  // is only cosmetic on top of that.
  // Determine a trade's real phase from its actual date compared to its own
  // season's calendar year, rather than trusting any Sleeper field for this.
  // A trade under season "2026" dated Jan or Apr 2026 is mathematically
  // before that season's September kickoff, full stop, regardless of what
  // leg/round Sleeper attached to it.
  function tradePhaseLabel(t) {
    const seasonYear = Number(t.season);
    if (t.created && !isNaN(seasonYear)) {
      const d = new Date(t.created);
      const year = d.getFullYear();
      const month = d.getMonth(); // 0 = Jan
      if (year === seasonYear && month <= 7) {
        return month === 7 ? "PRESEASON" : "OFFSEASON";
      }
    }
    const wk = t._round || t.leg;
    return wk ? `WEEK ${wk}` : "WEEK ?";
  }

  // Every season's own weekly matchup data, keyed by season, so the aging
  // stat can find the right source regardless of which season a trade
  // happened in.
  const weekMatchupsBySeason = useMemo(() => {
    const map = { [currentSeason]: weekMatchups };
    (seasonHistory || []).forEach((s) => {
      map[s.season] = s.weekMatchups || {};
    });
    return map;
  }, [currentSeason, weekMatchups, seasonHistory]);

  // Merge this season's trades (resolved against live current-season rosters)
  // with every historical season's trades (already resolved against that
  // season's own rosters, to avoid attributing an old trade to the wrong
  // manager via reused roster ID numbers).
  const allTrades = useMemo(() => {
    const current = (transactions || [])
      .filter((t) => t.type === "trade" && t.status === "complete")
      .map((t) => {
        const ownersByRosterId = {};
        (t.roster_ids || []).forEach((rid) => {
          ownersByRosterId[rid] = usersById[rostersById[rid]?.owner_id];
        });
        return { ...t, season: currentSeason, ownersByRosterId };
      });
    const historical = (seasonHistory || []).flatMap((s) => s.trades || []);
    return [...current, ...historical].sort((a, b) => (b.created || 0) - (a.created || 0));
  }, [transactions, rostersById, usersById, currentSeason, seasonHistory]);

  const filteredTrades = useMemo(() => {
    if (filterOwnerId === "all") return allTrades;
    return allTrades.filter((t) =>
      (t.roster_ids || []).some((rid) => t.ownersByRosterId?.[rid]?.user_id === filterOwnerId)
    );
  }, [allTrades, filterOwnerId]);

  const totalPages = Math.max(1, Math.ceil(filteredTrades.length / PAGE_SIZE));
  const pageTrades = filteredTrades.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  // Trade count per manager, across every linked season. Since allTrades is
  // sorted newest-first, the first time we see an owner locks in their most
  // current team name/avatar rather than an old one.
  const tradeCounts = useMemo(() => {
    const counts = {};
    allTrades.forEach((t) => {
      (t.roster_ids || []).forEach((rid) => {
        const owner = t.ownersByRosterId?.[rid];
        if (!owner) return;
        const oid = owner.user_id;
        if (!counts[oid]) counts[oid] = { count: 0, user: owner };
        counts[oid].count++;
      });
    });
    return Object.values(counts).sort((a, b) => b.count - a.count);
  }, [allTrades]);

  useEffect(() => {
    setPage(0);
  }, [filterOwnerId]);

  if (allTrades.length === 0) {
    return (
      <div>
        <SectionLabel>Trade History</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed trades yet.</div>
        </Card>
      </div>
    );
  }

  const isActiveSeason = seasonType === "regular" || seasonType === "post";

  return (
    <div>
      <SectionLabel>Trade History</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Every deal, for better or worse, across every linked season. Someone's going to bring this up drunk at a
        tailgate in three years. Every trade shows points scored since the deal happened, and it keeps running for
        as long as that player actually stays on the team that acquired them, even across a season boundary. The
        moment they get traded again or dropped, it stops right there.
      </div>
      {!isActiveSeason && (
        <div style={{ fontSize: 12, color: COLORS.gold, marginBottom: 10 }}>
          {seasonType === "pre"
            ? "Still preseason, so any trades made now are early moves before games actually count."
            : "It's the offseason, so trade activity will pick back up once the new league year gets set up."}
        </div>
      )}

      {tradeCounts.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <SectionLabel>Most active traders</SectionLabel>
          <BalancedGrid
            gap={10}
            minWidth={220}
            items={tradeCounts.map((tc) => ({
              key: tc.user.user_id,
              node: (
                <Card style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderLeft: `3px solid ${teamColor(teamName(tc.user))}` }}>
                  <Crest name={teamName(tc.user)} logo={avatarUrl(tc.user)} size={26} />
                  <span style={{ fontWeight: 600, fontSize: 13, flex: 1 }}>{withOwner(tc.user)}</span>
                  <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: COLORS.gold }}>
                    {tc.count}
                  </span>
                </Card>
              ),
            }))}
          />
        </div>
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <SectionLabel>Filter</SectionLabel>
        <select
          value={filterOwnerId}
          onChange={(e) => setFilterOwnerId(e.target.value)}
          style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 12,
            padding: "7px 12px",
            borderRadius: 6,
            border: `1px solid ${COLORS.hairline}`,
            background: COLORS.surface,
            color: COLORS.turf,
            cursor: "pointer",
          }}
        >
          <option value="all">All managers</option>
          {tradeCounts.map((tc) => (
            <option key={tc.user.user_id} value={tc.user.user_id}>
              {withOwner(tc.user)}
            </option>
          ))}
        </select>
        {filterOwnerId !== "all" && (
          <span style={{ fontSize: 12, color: COLORS.muted }}>
            Showing {filteredTrades.length} trade{filteredTrades.length === 1 ? "" : "s"}
          </span>
        )}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 14 }}>
        {pageTrades.map((t) => {
          const date = formatDate(t.created);
          return (
            <Card key={`${t.season}-${t.transaction_id}`}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, flexWrap: "wrap", gap: 6 }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.turfLight }}>
                  {tradePhaseLabel(t)} TRADE · {t.season}
                </div>
                {date && (
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.muted }}>
                    {date}
                  </div>
                )}
              </div>
              <BalancedGrid
                gap={10}
                minWidth={200}
                items={(t.roster_ids || []).map((rid) => {
                  const owner = t.ownersByRosterId?.[rid];
                  const adds = Object.entries(t.adds || {})
                    .filter(([, r]) => r === rid)
                    .map(([pid]) => pid);
                  const draftAdds = (t.draft_picks || []).filter((dp) => dp.owner_id === rid);
                  return {
                    key: rid,
                    node: (
                      <div style={{ borderLeft: `3px solid ${teamColor(teamName(owner))}`, paddingLeft: 10 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          <Crest name={teamName(owner)} logo={avatarUrl(owner)} size={24} />
                          <span style={{ fontWeight: 600, fontSize: 13 }}>{withOwner(owner)}</span>
                        </div>
                        <div style={{ fontSize: 13, color: COLORS.muted }}>
                          {adds.map((pid) => {
                            const isCurrentSeasonTrade = t.season === currentSeason;
                            const suppress = isCurrentSeasonTrade && !isActiveSeason;
                            const sincePts = !suppress && owner
                              ? computePointsSinceTrade(t, pid, owner.user_id)
                              : null;
                            return (
                              <div key={pid} style={{ marginBottom: 2 }}>
                                <div>+ {playerLabel(pid)}</div>
                                {sincePts !== null && (
                                  <div style={{ fontSize: 11, color: COLORS.gold, marginLeft: 12 }}>
                                    {fmt(sincePts)} pts since the trade
                                  </div>
                                )}
                              </div>
                            );
                          })}
                          {draftAdds.map((dp, i) => (
                            <div key={i}>+ {dp.season} Rd {dp.round} Pick</div>
                          ))}
                          {adds.length === 0 && draftAdds.length === 0 && <div>-</div>}
                        </div>
                      </div>
                    ),
                  };
                })}
              />
            </Card>
          );
        })}
      </div>

      {totalPages > 1 && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12 }}>
          <button
            onClick={() => setPage((p) => Math.max(0, p - 1))}
            disabled={page === 0}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${COLORS.hairline}`,
              background: "transparent",
              color: page === 0 ? COLORS.hairline : COLORS.turf,
              cursor: page === 0 ? "default" : "pointer",
            }}
          >
            Previous
          </button>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
            Page {page + 1} of {totalPages}
          </span>
          <button
            onClick={() => setPage((p) => Math.min(totalPages - 1, p + 1))}
            disabled={page >= totalPages - 1}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${COLORS.hairline}`,
              background: "transparent",
              color: page >= totalPages - 1 ? COLORS.hairline : COLORS.turf,
              cursor: page >= totalPages - 1 ? "default" : "pointer",
            }}
          >
            Next
          </button>
        </div>
      )}
    </div>
  );
}

function DraftPicksTab({ rosters, usersById, tradedPicks, draftRounds, currentSeason, currentDraftPicks, seasonHistory, players }) {
  const [mode, setMode] = useState("byTeam");
  const [historySeasonIdx, setHistorySeasonIdx] = useState(0);

  const picks = useMemo(
    () => computeDraftPicks(rosters, tradedPicks, draftRounds, currentSeason),
    [rosters, tradedPicks, draftRounds, currentSeason]
  );

  const ownerOf = (rid) => usersById[rosters.find((r) => r.roster_id === rid)?.owner_id];

  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position}${p.team ? ` - ${p.team}` : ""})` : name;
  }

  // Past drafts, newest season first. Current season's draft (if it's
  // happened yet) plus every linked historical season.
  const pastDrafts = useMemo(() => {
    const entries = [];
    if (currentDraftPicks && currentDraftPicks.length > 0) {
      entries.push({ season: currentSeason, picks: currentDraftPicks });
    }
    (seasonHistory || []).forEach((s) => {
      if (s.draftPicks && s.draftPicks.length > 0) {
        entries.push({ season: s.season, picks: s.draftPicks });
      }
    });
    return entries.sort((a, b) => Number(b.season) - Number(a.season));
  }, [currentDraftPicks, currentSeason, seasonHistory]);

  const byTeam = useMemo(() => {
    const groups = {};
    rosters.forEach((r) => { groups[r.roster_id] = []; });
    picks.forEach((p) => {
      if (!groups[p.currentRosterId]) groups[p.currentRosterId] = [];
      groups[p.currentRosterId].push(p);
    });
    return rosters.map((r) => ({
      rosterId: r.roster_id,
      owner: usersById[r.owner_id],
      picks: (groups[r.roster_id] || []).sort((a, b) => a.season.localeCompare(b.season) || a.round - b.round),
    }));
  }, [rosters, picks, usersById]);

  const boardColumns = [
    { key: "season", label: "Season", align: "left", accessor: (p) => p.season },
    { key: "round", label: "Round", accessor: (p) => p.round },
    {
      key: "original",
      label: "Original team",
      align: "left",
      accessor: (p) => withOwner(ownerOf(p.originalRosterId)),
      render: (p) => (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Crest name={teamName(ownerOf(p.originalRosterId))} logo={avatarUrl(ownerOf(p.originalRosterId))} size={22} />
          <span style={{ fontSize: 13 }}>{withOwner(ownerOf(p.originalRosterId))}</span>
        </div>
      ),
    },
    {
      key: "current",
      label: "Current owner",
      align: "left",
      accessor: (p) => withOwner(ownerOf(p.currentRosterId)),
      render: (p) => (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Crest name={teamName(ownerOf(p.currentRosterId))} logo={avatarUrl(ownerOf(p.currentRosterId))} size={22} />
          <span style={{ fontSize: 13, fontWeight: p.traded ? 600 : 400, color: p.traded ? COLORS.gold : COLORS.bone }}>
            {withOwner(ownerOf(p.currentRosterId))}
          </span>
        </div>
      ),
    },
  ];

  return (
    <div>
      <SectionLabel>Draft picks</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Every team's draft capital for the next two classes. This is the future you're trading away, so look before
        you deal it. Picks not shown here simply haven't been traded, meaning they're still with whoever originally
        owned them.
      </div>

      <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
        {[["byTeam", "By team"], ["board", "Full board"], ["history", "History"]].map(([id, label]) => (
          <button
            key={id}
            onClick={() => setMode(id)}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${mode === id ? COLORS.turf : COLORS.hairline}`,
              background: mode === id ? COLORS.turfTint : "transparent",
              color: mode === id ? COLORS.turf : COLORS.muted,
              cursor: "pointer",
              fontWeight: mode === id ? 600 : 400,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {mode === "byTeam" ? (
        <BalancedGrid
          minWidth={280}
          items={byTeam.map((t) => ({
            key: t.rosterId,
            node: (
              <Card style={{ borderLeft: `3px solid ${teamColor(teamName(t.owner))}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <Crest name={teamName(t.owner)} logo={avatarUrl(t.owner)} size={28} />
                  <span style={{ fontWeight: 600, fontSize: 14 }}>{withOwner(t.owner)}</span>
                  <span style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                    {t.picks.length} picks
                  </span>
                </div>
                {t.picks.length === 0 ? (
                  <div style={{ color: COLORS.muted, fontSize: 13, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No picks on record.</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column" }}>
                    {t.picks.map((p, i) => {
                      const isOwn = p.originalRosterId === p.currentRosterId;
                      return (
                        <div
                          key={`${p.season}-${p.round}-${p.originalRosterId}`}
                          style={{ display: "flex", alignItems: "center", padding: "6px 0", borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}
                        >
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600, width: 100 }}>
                            {p.season} R{p.round}
                          </span>
                          {!isOwn && (
                            <span style={{ fontSize: 11, color: COLORS.gold }}>
                              via {withOwner(ownerOf(p.originalRosterId))}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </Card>
            ),
          }))}
        />
      ) : mode === "board" ? (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <SortableTable columns={boardColumns} rows={picks} rowKey={(p) => `${p.season}-${p.round}-${p.originalRosterId}`} defaultSortKey="season" defaultSortDir="asc" />
          </div>
        </Card>
      ) : (
        <div>
          {pastDrafts.length === 0 ? (
            <Card>
              <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed drafts on record yet.</div>
            </Card>
          ) : (
            <>
              <div style={{ display: "flex", gap: 4, marginBottom: 12, flexWrap: "wrap" }}>
                {pastDrafts.map((d, i) => (
                  <button
                    key={d.season}
                    onClick={() => setHistorySeasonIdx(i)}
                    style={{
                      fontFamily: "'IBM Plex Mono', monospace",
                      fontSize: 12,
                      padding: "6px 12px",
                      borderRadius: 6,
                      border: `1px solid ${historySeasonIdx === i ? COLORS.gold : COLORS.hairline}`,
                      background: historySeasonIdx === i ? COLORS.surfaceLight : "transparent",
                      color: historySeasonIdx === i ? COLORS.gold : COLORS.muted,
                      cursor: "pointer",
                    }}
                  >
                    {d.season}
                  </button>
                ))}
              </div>
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ background: COLORS.surfaceLight }}>
                      {["Pick", "Round", "Player", "Drafted by"].map((h, i) => (
                        <th
                          key={h}
                          style={{
                            textAlign: i >= 2 ? "left" : "right",
                            padding: "7px 12px",
                            fontFamily: "'IBM Plex Mono', monospace",
                            fontSize: 11,
                            letterSpacing: "0.06em",
                            color: COLORS.muted,
                            textTransform: "uppercase",
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(pastDrafts[historySeasonIdx]?.picks || []).map((p, i) => (
                      <tr key={`${p.round}-${p.pickNo}`} style={{ borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {p.pickNo}
                        </td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {p.round}
                        </td>
                        <td style={{ padding: "7px 12px", fontSize: 13 }}>{playerLabel(p.playerId)}</td>
                        <td style={{ padding: "7px 12px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <Crest name={teamName(p.owner)} logo={avatarUrl(p.owner)} size={22} />
                            <span style={{ fontSize: 13, fontWeight: 600 }}>{withOwner(p.owner)}</span>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                </div>
              </Card>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// Builds a plain-text auto-draft recap for one week, in the site's voice,
// from real matchup results. Meant to be a starting point the manager edits,
// not a finished article.
function buildSeasonHistoryData(summary, players) {
  function playerLabelFor(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position})` : name;
  }

  const leagueSummaryRows = [];

  // Champion and every season-level superlative stay blank for a season
  // still in progress, since none of them are actually decided yet.
  if (summary.isComplete) {
    if (summary.champion) {
      leagueSummaryRows.push(["Champion", withOwner(summary.champion)]);
      if (summary.runnerUp) leagueSummaryRows.push(["Runner-up", withOwner(summary.runnerUp)]);
      if (summary.third) leagueSummaryRows.push(["Third", withOwner(summary.third)]);
    }

    if (summary.standings.length > 0) {
      const topScorer = [...summary.standings].sort((a, b) => b.fpts - a.fpts)[0];
      leagueSummaryRows.push(["Points leader", `${topScorer.displayName}, ${fmt(topScorer.fpts)} PF`]);
    }

    if (summary.highGame) {
      leagueSummaryRows.push(["Best single week", `${withOwner(summary.highGame.owner)}, ${fmt(summary.highGame.points)} pts (Wk ${summary.highGame.week})`]);
    }

    if (summary.bestPlayerGame) {
      let val = `${playerLabelFor(summary.bestPlayerGame.playerId)}, ${fmt(summary.bestPlayerGame.points)} pts (Wk ${summary.bestPlayerGame.week}`;
      if (summary.bestPlayerGame.owner) val += `, ${withOwner(summary.bestPlayerGame.owner)}`;
      val += ")";
      leagueSummaryRows.push(["Best individual performance", val]);
    }

    if (summary.lastPlace) {
      leagueSummaryRows.push(["Wall of shame", withOwner(summary.lastPlace)]);
    }
  }

  const teamRows = summary.standings.map((s, i) => ({
    rank: i + 1,
    ownerId: s.ownerId,
    displayName: s.displayName,
    name: s.name,
    avatar: s.avatar,
    wins: s.wins,
    losses: s.losses,
    ties: s.ties,
    fpts: s.fpts,
    fptsAgainst: s.fptsAgainst,
    diff: s.fpts - s.fptsAgainst,
  }));

  return { leagueSummaryRows, teamRows };
}

function HistoryTab({ rostersById, usersById, standings, seasonHistory, superlatives, players, currentSeason }) {
  // One summary per season, current one included.
  const seasonSummaries = useMemo(() => {
    const historical = (seasonHistory || []).map((s) => ({
      season: s.season,
      isComplete: true,
      champion: s.champion,
      runnerUp: s.runnerUp,
      third: s.third,
      lastPlace: s.lastPlace,
      standings: s.standings || [],
      highGame: s.highGame,
      bestPlayerGame: s.bestPlayerGame,
    }));
    const currentTopWeek = superlatives?.currentSeasonSuper?.topWeek;
    const currentHighGame = currentTopWeek
      ? { owner: usersById[rostersById[currentTopWeek.rosterId]?.owner_id], points: currentTopWeek.points, week: currentTopWeek.week }
      : null;
    const current = {
      season: currentSeason,
      isComplete: false,
      champion: null,
      runnerUp: null,
      third: null,
      lastPlace: null,
      standings: standings || [],
      highGame: currentHighGame,
      bestPlayerGame: superlatives?.currentSeasonSuper?.bestPlayerGame || null,
    };
    return [current, ...historical].sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory, currentSeason, standings, superlatives, rostersById, usersById]);

  const [selectedSeasonIdx, setSelectedSeasonIdx] = useState(0);
  const selectedSummary = seasonSummaries[selectedSeasonIdx];
  const historyData = selectedSummary ? buildSeasonHistoryData(selectedSummary, players) : null;

  if (seasonSummaries.every((s) => s.standings.length === 0)) {
    return (
      <div>
        <SectionLabel>History</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed weeks yet this season. Check back after Week 1.</div>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionLabel>History</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Season by season, receipts don't expire. Champions, superlatives, and every team's full stat line, forever.
      </div>

      <div style={{ display: "flex", gap: 4, marginBottom: 12, flexWrap: "wrap" }}>
        {seasonSummaries.map((s, i) => (
          <button
            key={s.season}
            onClick={() => setSelectedSeasonIdx(i)}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "6px 12px",
              borderRadius: 6,
              border: `1px solid ${selectedSeasonIdx === i ? COLORS.gold : COLORS.hairline}`,
              background: selectedSeasonIdx === i ? COLORS.surfaceLight : "transparent",
              color: selectedSeasonIdx === i ? COLORS.gold : COLORS.muted,
              cursor: "pointer",
            }}
          >
            {s.season}{!s.isComplete ? " (in progress)" : ""}
          </button>
        ))}
      </div>

      <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: COLORS.turf, marginBottom: 10 }}>
        Season {selectedSummary?.season}
      </div>

      {historyData && (
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 280px", minWidth: 260 }}>
            {historyData.leagueSummaryRows.length > 0 ? (
              <InfoTable title="League summary" rows={historyData.leagueSummaryRows} accent={COLORS.goldDeep} />
            ) : (
              <div>
                <SectionLabel>League summary</SectionLabel>
                <Card>
                  <div style={{ color: COLORS.muted, fontSize: 13 }}>
                    Champion and season superlatives show up here once the season wraps up.
                  </div>
                </Card>
              </div>
            )}
          </div>
          <div style={{ flex: "2 1 420px" }}>
            <SectionLabel>Team synopsis</SectionLabel>
            <Card style={{ padding: 0, overflow: "hidden" }}>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ background: COLORS.surfaceLight }}>
                      {["#", "Team", "W", "L", "T", "PF", "PA", "Diff"].map((h, i) => (
                        <th
                          key={h}
                          style={{
                            textAlign: i <= 1 ? "left" : "right",
                            padding: "7px 12px",
                            fontFamily: "'IBM Plex Mono', monospace",
                            fontSize: 11,
                            letterSpacing: "0.06em",
                            color: COLORS.muted,
                            textTransform: "uppercase",
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {historyData.teamRows.map((t, i) => (
                      <tr key={t.ownerId || i} style={{ borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}>
                        <td style={{ padding: "7px 12px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {t.rank}
                        </td>
                        <td style={{ padding: "7px 12px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <Crest name={t.name} logo={t.avatar} size={22} />
                            <span style={{ fontSize: 13, fontWeight: 600 }}>{t.displayName}</span>
                          </div>
                        </td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.wins}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.losses}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.ties}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.gold }}>{fmt(t.fpts)}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.muted }}>{fmt(t.fptsAgainst)}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: t.diff >= 0 ? COLORS.turf : COLORS.leatherDeep, fontWeight: 600 }}>
                          {t.diff >= 0 ? "+" : ""}{fmt(t.diff)}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          </div>
        </div>
      )}
    </div>
  );
}

// Shared across Home and Rosters: every all-time aggregation (champions,
// wall of shame, and the 8 league-wide superlative titles) computed once
// from a single source of truth, so both pages always agree on who holds what.
function useLeagueSuperlatives(data, standings, usersById) {
  const { league, seasonHistory, weekMatchups, rosters, users } = data;

  const championsByOwner = useMemo(() => {
    const map = {};
    seasonHistory.forEach((s) => {
      if (!s.champion) return;
      const key = s.champion.user_id;
      if (!map[key]) map[key] = { user: s.champion, years: [] };
      map[key].years.push(s.season);
    });
    return Object.values(map).sort((a, b) => b.years.length - a.years.length);
  }, [seasonHistory]);

  const orderedTitles = useMemo(() => {
    return [...seasonHistory].filter((s) => s.champion).sort((a, b) => Number(a.season) - Number(b.season));
  }, [seasonHistory]);

  const currentSeasonSuper = useMemo(() => {
    let topWeek = null;
    let blowout = null;
    let bestPlayerGame = null;
    Object.entries(weekMatchups || {}).forEach(([week, matchups]) => {
      const byMatchupId = {};
      matchups.forEach((m) => {
        if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
        byMatchupId[m.matchup_id].push(m);
      });
      Object.values(byMatchupId).forEach((pair) => {
        pair.forEach((m) => {
          if (!topWeek || (m.points ?? 0) > topWeek.points) {
            topWeek = { points: m.points ?? 0, rosterId: m.roster_id, week };
          }
          Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
            if (!bestPlayerGame || pts > bestPlayerGame.points) {
              const owner = usersById[rosters.find((r) => r.roster_id === m.roster_id)?.owner_id];
              bestPlayerGame = { playerId: pid, points: pts, week, owner };
            }
          });
        });
        if (pair.length === 2) {
          const margin = Math.abs((pair[0].points ?? 0) - (pair[1].points ?? 0));
          const winner = pair[0].points >= pair[1].points ? pair[0] : pair[1];
          if (!blowout || margin > blowout.margin) {
            blowout = { margin, rosterId: winner.roster_id, week };
          }
        }
      });
    });
    return { topWeek, blowout, bestPlayerGame };
  }, [weekMatchups, rosters, usersById]);

  const ownerForRoster = (rid) => {
    const r = rosters.find((r) => r.roster_id === rid);
    return r ? usersById[r.owner_id] : null;
  };

  const wallOfShame = useMemo(() => {
    return [...seasonHistory].filter((s) => s.lastPlace).sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory]);

  const historyRows = useMemo(() => {
    return [...seasonHistory].sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory]);

  const ownerDirectory = useMemo(() => {
    const map = {};
    [...seasonHistory].sort((a, b) => Number(a.season) - Number(b.season)).forEach((s) => {
      (s.users || []).forEach((u) => { map[u.user_id] = u; });
    });
    users.forEach((u) => { map[u.user_id] = u; });
    return map;
  }, [seasonHistory, users]);

  const allSeasonEntries = useMemo(() => {
    const hist = seasonHistory.map((s) => ({
      season: s.season,
      standings: s.standings || [],
      playoffWins: s.playoffWins || {},
      highGame: s.highGame || null,
      bestPlayerGame: s.bestPlayerGame || null,
    }));
    let currentHighGame = null;
    if (currentSeasonSuper.topWeek) {
      const r = rosters.find((r) => r.roster_id === currentSeasonSuper.topWeek.rosterId);
      const owner = r ? usersById[r.owner_id] : null;
      if (owner) currentHighGame = { owner, points: currentSeasonSuper.topWeek.points, week: currentSeasonSuper.topWeek.week };
    }
    const current = {
      season: league?.season,
      standings: standings || [],
      playoffWins: {},
      highGame: currentHighGame,
      bestPlayerGame: currentSeasonSuper.bestPlayerGame || null,
    };
    return [...hist, current];
  }, [seasonHistory, standings, currentSeasonSuper, rosters, usersById, league]);

  const allTimeSuperlatives = useMemo(() => {
    const career = {};
    const playoffTotals = {};
    let bestSeason = null;
    let highestScoringSeason = null;
    let singleGame = null;
    let bestPlayerRecord = null;

    allSeasonEntries.forEach((entry) => {
      (entry.standings || []).forEach((s) => {
        if (!s.ownerId) return;
        if (!career[s.ownerId]) career[s.ownerId] = { wins: 0, losses: 0, ties: 0, fpts: 0, games: 0 };
        career[s.ownerId].wins += s.wins;
        career[s.ownerId].losses += s.losses;
        career[s.ownerId].ties += s.ties;
        career[s.ownerId].fpts += s.fpts;
        career[s.ownerId].games += s.wins + s.losses + s.ties;

        const games = s.wins + s.losses + s.ties;
        if (games > 0) {
          const pct = (s.wins + s.ties * 0.5) / games;
          if (!bestSeason || pct > bestSeason.pct || (pct === bestSeason.pct && s.fpts > bestSeason.fpts)) {
            bestSeason = { ownerId: s.ownerId, wins: s.wins, losses: s.losses, ties: s.ties, season: entry.season, pct, fpts: s.fpts };
          }
        }
        if (!highestScoringSeason || s.fpts > highestScoringSeason.fpts) {
          highestScoringSeason = { ownerId: s.ownerId, fpts: s.fpts, season: entry.season };
        }
      });

      Object.entries(entry.playoffWins || {}).forEach(([ownerId, wins]) => {
        playoffTotals[ownerId] = (playoffTotals[ownerId] || 0) + wins;
      });

      if (entry.highGame && (!singleGame || entry.highGame.points > singleGame.points)) {
        singleGame = { owner: entry.highGame.owner, points: entry.highGame.points, week: entry.highGame.week, season: entry.season };
      }

      if (entry.bestPlayerGame && (!bestPlayerRecord || entry.bestPlayerGame.points > bestPlayerRecord.points)) {
        bestPlayerRecord = { ...entry.bestPlayerGame, season: entry.season };
      }
    });

    let bestWinPct = null;
    let bestPPG = null;
    Object.entries(career).forEach(([ownerId, c]) => {
      if (c.games === 0) return;
      const pct = (c.wins + c.ties * 0.5) / c.games;
      if (!bestWinPct || pct > bestWinPct.pct) bestWinPct = { ownerId, pct, wins: c.wins, losses: c.losses };
      const ppg = c.fpts / c.games;
      if (!bestPPG || ppg > bestPPG.ppg) bestPPG = { ownerId, ppg };
    });

    let mostPlayoffWins = null;
    Object.entries(playoffTotals).forEach(([ownerId, wins]) => {
      if (!mostPlayoffWins || wins > mostPlayoffWins.wins) mostPlayoffWins = { ownerId, wins };
    });

    return { bestWinPct, bestPPG, mostPlayoffWins, bestSeason, highestScoringSeason, singleGame, bestPlayerRecord };
  }, [allSeasonEntries]);

  const mostTitles = championsByOwner[0];

  return {
    championsByOwner, orderedTitles, currentSeasonSuper, ownerForRoster, wallOfShame,
    historyRows, ownerDirectory, allSeasonEntries, allTimeSuperlatives, mostTitles,
  };
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return `${n}${s[(v - 20) % 10] || s[v] || s[0]}`;
}

function PodiumRow({ season, champion, runnerUp, third }) {
  const steps = [
    { place: 2, user: runnerUp, height: 40, color: COLORS.turfLight },
    { place: 1, user: champion, height: 60, color: COLORS.gold },
    { place: 3, user: third, height: 28, color: COLORS.leather },
  ];
  return (
    <Card style={{ padding: "10px 12px 0" }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.muted, marginBottom: 8 }}>
        {season}
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 6, justifyContent: "center" }}>
        {steps.map((st) => (
          <div key={st.place} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, minWidth: 0 }}>
            {st.user ? <Crest name={teamName(st.user)} logo={avatarUrl(st.user)} size={26} /> : <div style={{ width: 26, height: 26 }} />}
            <div
              style={{
                fontSize: 11,
                textAlign: "center",
                marginTop: 4,
                marginBottom: 6,
                color: st.place === 1 ? COLORS.turf : COLORS.muted,
                fontWeight: st.place === 1 ? 600 : 400,
                maxWidth: 90,
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}
            >
              {st.user ? withOwner(st.user) : "-"}
            </div>
            <div
              style={{
                width: "100%",
                height: st.height,
                background: st.color,
                borderRadius: "4px 4px 0 0",
                display: "flex",
                alignItems: "flex-start",
                justifyContent: "center",
                paddingTop: 4,
              }}
            >
              <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 13, color: "#FFFFFF" }}>{st.place}</span>
            </div>
          </div>
        ))}
      </div>
    </Card>
  );
}

function HomeTab({ data, standings, usersById, superlatives, rostersById }) {
  const { league, seasonHistory, rosters, players, seasonType } = data;
  const {
    championsByOwner, orderedTitles, currentSeasonSuper, ownerForRoster,
    wallOfShame, historyRows, ownerDirectory, allTimeSuperlatives, mostTitles,
  } = superlatives;

  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position}${p.team ? ` - ${p.team}` : ""})` : name;
  }

  const scoringType = (() => {
    const rec = league?.scoring_settings?.rec;
    if (rec === 1) return "Full PPR";
    if (rec === 0.5) return "Half PPR";
    if (rec === 0) return "Standard";
    return rec !== undefined ? `${rec} pt/rec` : "-";
  })();

  const seasonNumber = seasonHistory.length + 1;
  const leagueTitle = `${ordinal(seasonNumber)} Annual ${league?.name || "Dynasty League"}`;

  // Quick lineup breakdown, e.g. "1 QB · 2 RB · 2 WR · 1 TE · 1 FLEX"
  const lineupSummary = useMemo(() => {
    const counts = {};
    let bench = 0;
    (league?.roster_positions || []).forEach((p) => {
      if (p === "BN") { bench++; return; }
      counts[p] = (counts[p] || 0) + 1;
    });
    const order = ["QB", "RB", "WR", "TE", "FLEX", "SUPER_FLEX", "REC_FLEX", "WRRB_FLEX", "K", "DEF"];
    const parts = order
      .filter((k) => counts[k])
      .map((k) => `${counts[k]} ${POSITION_LABELS[k] || k}`);
    Object.keys(counts).filter((k) => !order.includes(k)).forEach((k) => parts.push(`${counts[k]} ${k}`));
    return { line: parts.join(" · "), bench };
  }, [league]);

  const settings = league?.settings || {};
  const waiverLabel = settings.waiver_budget > 0 ? `FAAB ($${settings.waiver_budget})` : "Rolling priority";

  const glanceRows = [
    ["League size", `${rosters.length} teams`],
    ["Format", "Head-to-head"],
    ["Scoring", scoringType],
    ["Lineup", lineupSummary.line || "-"],
    ["Bench / IR", `${lineupSummary.bench} bench${settings.reserve_slots ? ` · ${settings.reserve_slots} IR` : ""}${settings.taxi_slots ? ` · ${settings.taxi_slots} taxi` : ""}`],
    ["Regular season", settings.playoff_week_start ? `${settings.playoff_week_start - 1} weeks` : "-"],
    ["Playoffs", settings.playoff_teams ? `${settings.playoff_teams}-team bracket, starts Wk ${settings.playoff_week_start ?? "-"}` : "-"],
    ["Trade deadline", settings.trade_deadline ? `Week ${settings.trade_deadline}` : "None set"],
    ["Waivers", waiverLabel],
  ];

  return (
    <div>
      {/* Champions banner strip */}
      {orderedTitles.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <SectionLabel>Champions</SectionLabel>
          <div style={{ display: "flex", gap: 18, overflowX: "auto", padding: "10px 4px 12px" }}>
            {orderedTitles.map((s) => (
              <div key={s.season} style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.leather, marginBottom: -1, position: "relative", zIndex: 2 }} />
                <div
                  className="banner-pennant"
                  style={{
                    minWidth: 130,
                    background: COLORS.turf,
                    padding: "14px 14px 22px",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 8,
                    clipPath: "polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%)",
                  }}
                >
                  <Crest name={teamName(s.champion)} logo={avatarUrl(s.champion)} size={38} />
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 13, color: COLORS.yellow }}>
                      {s.season}
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.onTurf, marginTop: 2 }}>
                      {teamName(s.champion)}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Welcome / league intro */}
      <Card style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: COLORS.turfLight, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>
          Welcome to the league
        </div>
        <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 22, color: COLORS.turf, marginBottom: 8 }}>
          {leagueTitle}
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, fontWeight: 600 }}>
          Let's fucking go. Football is back, and it is so back. Somewhere right now some guy who spent his entire
          offseason rehabbing a torn ACL is about to run full speed into a linebacker so you can win a lineup bet
          against your buddy from the comfort of your couch. These men train year round, get paid to get hit for a
          living, and show up anyway. That's real work. Respect it.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Meanwhile we're sitting on our asses in sweatpants, clicking a screen, pretending we're general managers
          because we know what a bye week is. That's fine. That's the whole bit. Nobody's out here doing agility
          drills for this league. Just don't be the asshole who forgets to start his flex.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Football is back. Nobody remembers your draft grade in August, and this league sure as hell doesn't hand
          out participation trophies. Rosters carry over year to year. Every trade is a bet you'd better be ready to
          back up. There's no rebuild without a plan and no shortcuts to a ring.{" "}
          {seasonType === "pre"
            ? `Season ${league?.season} kicks off soon.`
            : seasonType === "off"
            ? `Season ${league?.season} is being built right now.`
            : `Season ${league?.season} is live.`}{" "}
          Come compete or get out of the way.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Some of you play it safe and call it a system. Some of you talk a big game every single year and never
          back it up. Some of you get your hearts broken right on schedule and show up again anyway. Some of you
          are still out here saying this is finally the year, same as every year before it. None of that wins you a
          single game here. Show up and hit somebody.
        </div>
      </Card>

      {/* League at a glance + Titles, side by side */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <InfoTable title="League at a glance" rows={glanceRows} />
        </div>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <SectionLabel>Titles</SectionLabel>
          {championsByOwner.length === 0 ? (
            <Card>
              <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No champions crowned yet. That's still this season's to decide.</div>
            </Card>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {championsByOwner.map((c) => (
                <Card
                  key={c.user.user_id}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderLeft: `3px solid ${teamColor(teamName(c.user))}` }}
                >
                  <Crest name={teamName(c.user)} logo={avatarUrl(c.user)} size={32} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 600 }}>{withOwner(c.user)}</div>
                    <div style={{ fontSize: 12, color: COLORS.muted }}>{c.years.slice().sort().join(", ")}</div>
                  </div>
                  <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 18, color: COLORS.gold, whiteSpace: "nowrap", flexShrink: 0 }}>
                    {c.years.length} {c.years.length === 1 ? "title" : "titles"}
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* League history: podium by year */}
      <SectionLabel>League history</SectionLabel>
      {historyRows.length === 0 ? (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ color: COLORS.muted }}>
            This is the earliest linked season for your league. History fills in automatically as seasons stack up.
          </div>
        </Card>
      ) : (
        <div style={{ marginBottom: 14 }}>
          <BalancedGrid
            items={historyRows.map((s) => ({
              key: s.season,
              node: <PodiumRow season={s.season} champion={s.champion} runnerUp={s.runnerUp} third={s.third} />,
            }))}
          />
        </div>
      )}

      {/* Superlatives + Wall of shame, side by side */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <SectionLabel>All-time superlatives</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[0]}
              label="Most titles"
              value={mostTitles ? `${mostTitles.years.length} ${mostTitles.years.length === 1 ? "title" : "titles"}` : "-"}
              user={mostTitles?.user}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[1]}
              label="Most playoff wins"
              value={allTimeSuperlatives.mostPlayoffWins ? `${allTimeSuperlatives.mostPlayoffWins.wins} wins` : "-"}
              user={allTimeSuperlatives.mostPlayoffWins ? ownerDirectory[allTimeSuperlatives.mostPlayoffWins.ownerId] : null}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[2]}
              label="Best win %"
              value={allTimeSuperlatives.bestWinPct ? `${fmt(allTimeSuperlatives.bestWinPct.pct * 100, 0)}% (${allTimeSuperlatives.bestWinPct.wins}-${allTimeSuperlatives.bestWinPct.losses})` : "-"}
              user={allTimeSuperlatives.bestWinPct ? ownerDirectory[allTimeSuperlatives.bestWinPct.ownerId] : null}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[3]}
              label="Highest career PPG"
              value={allTimeSuperlatives.bestPPG ? `${fmt(allTimeSuperlatives.bestPPG.ppg)} pts` : "-"}
              user={allTimeSuperlatives.bestPPG ? ownerDirectory[allTimeSuperlatives.bestPPG.ownerId] : null}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[4]}
              label="Best regular season"
              value={allTimeSuperlatives.bestSeason ? `${allTimeSuperlatives.bestSeason.wins}-${allTimeSuperlatives.bestSeason.losses} · ${allTimeSuperlatives.bestSeason.season}` : "-"}
              user={allTimeSuperlatives.bestSeason ? ownerDirectory[allTimeSuperlatives.bestSeason.ownerId] : null}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[5]}
              label="Highest scoring season"
              value={allTimeSuperlatives.highestScoringSeason ? `${fmt(allTimeSuperlatives.highestScoringSeason.fpts)} pts · ${allTimeSuperlatives.highestScoringSeason.season}` : "-"}
              user={allTimeSuperlatives.highestScoringSeason ? ownerDirectory[allTimeSuperlatives.highestScoringSeason.ownerId] : null}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[6]}
              label="Highest scoring week"
              value={allTimeSuperlatives.singleGame ? `${fmt(allTimeSuperlatives.singleGame.points)} pts · Wk ${allTimeSuperlatives.singleGame.week}, ${allTimeSuperlatives.singleGame.season}` : "-"}
              user={allTimeSuperlatives.singleGame?.owner}
            />
            <SuperlativeCard
              accent={SUPERLATIVE_ACCENTS[7]}
              label="Single-game record"
              sublabel={allTimeSuperlatives.bestPlayerRecord ? playerLabel(allTimeSuperlatives.bestPlayerRecord.playerId) : null}
              value={allTimeSuperlatives.bestPlayerRecord ? `${fmt(allTimeSuperlatives.bestPlayerRecord.points)} pts · Wk ${allTimeSuperlatives.bestPlayerRecord.week}, ${allTimeSuperlatives.bestPlayerRecord.season}` : "-"}
              user={allTimeSuperlatives.bestPlayerRecord?.owner}
            />
          </div>
        </div>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <SectionLabel>Wall of shame (last place by year)</SectionLabel>
          {wallOfShame.length === 0 ? (
            <Card>
              <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed seasons yet.</div>
            </Card>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {wallOfShame.map((s) => (
                <Card
                  key={s.season}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 12,
                    padding: "8px 12px",
                    background: COLORS.leatherTint,
                    borderLeft: `3px solid ${COLORS.leatherDeep}`,
                  }}
                >
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.leatherDeep, width: 48 }}>
                    {s.season}
                  </div>
                  <Crest name={teamName(s.lastPlace)} logo={avatarUrl(s.lastPlace)} size={28} />
                  <div style={{ fontWeight: 600, color: COLORS.leatherDeep }}>{withOwner(s.lastPlace)}</div>
                </Card>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const SUPERLATIVE_ACCENTS = ["#FF6B00", "#0E4D33", "#B8860B", "#7B4B27", "#3F7A63", "#C1490A", "#5A371C", "#D9560A"];

function SuperlativeCard({ label, value, user, accent, sublabel }) {
  return (
    <Card style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderLeft: `3px solid ${accent}` }}>
      <Crest name={user ? teamName(user) : "-"} logo={user ? avatarUrl(user) : null} size={30} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 11, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
        <div style={{ fontWeight: 600, fontSize: 13 }}>{sublabel || (user ? withOwner(user) : "Not yet decided")}</div>
        {sublabel && user ? (
          <div style={{ fontSize: 11, color: COLORS.muted }}>{withOwner(user)}</div>
        ) : null}
      </div>
      <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: accent, whiteSpace: "nowrap", textAlign: "right" }}>
        {value}
      </div>
    </Card>
  );
}

const DUES = {

  note: "Standard payout structure",
  payout: [
    { place: "1st", amount: 370 },
    { place: "2nd", amount: 180 },
    { place: "3rd", amount: 50 },
  ],
};

const POSITION_LABELS = {
  QB: "QB", RB: "RB", WR: "WR", TE: "TE", K: "K", DEF: "DEF",
  FLEX: "FLEX", SUPER_FLEX: "SUPERFLEX", REC_FLEX: "WR/TE",
  WRRB_FLEX: "WR/RB", BN: "Bench", IDP_FLEX: "IDP",
};

// Measures each item's real rendered height, then splits items between two
// columns to minimize the height difference between them (greedy longest-first
// bin packing): a hard guarantee rather than relying on the browser's CSS
// column-balancing heuristic.
function BalancedGrid({ items, gap = 12, minWidth = 280 }) {
  const measureRefs = useRef([]);
  const [heights, setHeights] = useState(null);

  useEffect(() => {
    function measure() {
      setHeights(measureRefs.current.map((el) => (el ? el.offsetHeight : 0)));
    }
    measure();
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [items.length]);

  const assignment = useMemo(() => {
    if (!heights || heights.length !== items.length) {
      return items.map((_, i) => i % 2);
    }
    const order = items.map((_, i) => i).sort((a, b) => heights[b] - heights[a]);
    const colTotals = [0, 0];
    const assign = new Array(items.length);
    order.forEach((i) => {
      const col = colTotals[0] <= colTotals[1] ? 0 : 1;
      assign[i] = col;
      colTotals[col] += heights[i] || 0;
    });
    return assign;
  }, [heights, items.length]);

  const columns = [[], []];
  items.forEach((item, i) => columns[assignment[i]].push({ item, i }));

  return (
    <div style={{ display: "flex", gap, flexWrap: "wrap" }}>
      {columns.map((col, colIdx) => (
        <div key={colIdx} style={{ flex: `1 1 ${minWidth}px`, minWidth: Math.min(minWidth, 260), display: "flex", flexDirection: "column", gap }}>
          {col.map(({ item, i }) => (
            <div key={item.key} ref={(el) => { measureRefs.current[i] = el; }}>
              {item.node}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function InfoTable({ title, rows, note, accent }) {
  return (
    <div>
      <SectionLabel>{title}</SectionLabel>
      <Card style={{ padding: 0, overflow: "hidden", borderLeft: accent ? `3px solid ${accent}` : undefined }}>
        <table style={{ width: "100%", borderCollapse: "collapse", tableLayout: "fixed" }}>
          <tbody>
            {rows.map(([label, value], i) => (
              <tr key={label} style={{ borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}>
                <td
                  style={{
                    padding: "7px 12px",
                    fontSize: 12,
                    color: COLORS.muted,
                    width: "50%",
                    wordBreak: "break-word",
                  }}
                >
                  {label}
                </td>
                <td
                  style={{
                    padding: "7px 12px",
                    fontFamily: "'IBM Plex Mono', monospace",
                    fontSize: 12,
                    color: accent || COLORS.turf,
                    fontWeight: 600,
                    wordBreak: "break-word",
                  }}
                >
                  {value}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
      {note && <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 6 }}>{note}</div>}
    </div>
  );
}

  rush_yd: "Rushing yard", rush_td: "Rushing TD", rush_2pt: "Rushing 2pt", rush_att: "Rush attempt",
  rush_td_40p: "40+ yd rush TD", rush_td_50p: "50+ yd rush TD",
  rec: "Reception", rec_yd: "Receiving yard", rec_td: "Receiving TD", rec_2pt: "Receiving 2pt",
  rec_td_40p: "40+ yd rec TD", rec_td_50p: "50+ yd rec TD", bonus_rec_te: "TE reception bonus",
  bonus_rec_wr: "WR reception bonus", bonus_rec_rb: "RB reception bonus",
  fum_lost: "Fumble lost", fum_rec_td: "Fumble return TD", ff: "Forced fumble", fum_rec: "Fumble recovery",

  blk_kick: "Blocked kick", def_2pt: "Defensive 2pt conversion",

  pts_allow_14_20: "14-20 pts allowed", pts_allow_21_27: "21-27 pts allowed", pts_allow_28_34: "28-34 pts allowed",
  pts_allow_35p: "35+ pts allowed",
  xpm: "Extra point made", xpmiss: "Extra point missed",
  fgm_0_19: "FG made 0-19 yd", fgm_20_29: "FG made 20-29 yd", fgm_30_39: "FG made 30-39 yd",

  kr_yd: "Kick return yard", pr_yd: "Punt return yard",
};

const SCORING_CATEGORIES = {
  pass_yd: "Passing", pass_td: "Passing", pass_int: "Passing", pass_2pt: "Passing",
  pass_cmp: "Passing", pass_inc: "Passing", pass_td_40p: "Passing", pass_td_50p: "Passing",
  rush_yd: "Rushing & receiving", rush_td: "Rushing & receiving", rush_2pt: "Rushing & receiving",
  rush_att: "Rushing & receiving", rush_td_40p: "Rushing & receiving", rush_td_50p: "Rushing & receiving",
  rec: "Rushing & receiving", rec_yd: "Rushing & receiving", rec_td: "Rushing & receiving",
  rec_2pt: "Rushing & receiving", rec_td_40p: "Rushing & receiving", rec_td_50p: "Rushing & receiving",
  bonus_rec_te: "Rushing & receiving", bonus_rec_wr: "Rushing & receiving", bonus_rec_rb: "Rushing & receiving",
  xpm: "Kicking", xpmiss: "Kicking", fgm_0_19: "Kicking", fgm_20_29: "Kicking",
  fgm_30_39: "Kicking", fgm_40_49: "Kicking", fgm_50p: "Kicking", fgmiss: "Kicking",
  fum_lost: "Defense & special teams", fum_rec_td: "Defense & special teams", ff: "Defense & special teams",

  pts_allow_28_34: "Defense & special teams", pts_allow_35p: "Defense & special teams",
};
const SCORING_CATEGORY_ORDER = ["Passing", "Rushing & receiving", "Kicking", "Defense & special teams", "Other"];
const CATEGORY_ACCENTS = {
  "Passing": "#C1490A",
  "Rushing & receiving": "#0E4D33",
  "Kicking": "#B8860B",
  "Defense & special teams": "#5A371C",
  "Other": "#6B7A70",
};

function humanizeKey(key) {
  return key.split("_").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

const WAIVER_TYPE_LABELS = { 0: "Rolling waiver priority", 1: "FAAB", 2: "Reverse standings priority" };
const LEAGUE_TYPE_LABELS = { 0: "Redraft", 1: "Keeper", 2: "Dynasty" };
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function RulesTab({ league }) {
  const positions = league?.roster_positions || [];
  const starterCounts = {};
  let benchCount = 0;
  positions.forEach((p) => {
    if (p === "BN") { benchCount++; return; }
    starterCounts[p] = (starterCounts[p] || 0) + 1;
  });

  const scoring = league?.scoring_settings || {};
  const rec = scoring.rec;
  const scoringType = rec === 1 ? "Full PPR" : rec === 0.5 ? "Half PPR" : rec === 0 ? "Standard (no PPR)" : rec !== undefined ? `${rec} pt / reception` : "-";

  const scoringByCategory = useMemo(() => {
    const groups = {};
    Object.entries(scoring)
      .filter(([, v]) => v !== undefined && v !== null && v !== 0)
      .forEach(([key, v]) => {
        const cat = SCORING_CATEGORIES[key] || "Other";
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push([SCORING_LABELS[key] || humanizeKey(key), v]);
      });
    return SCORING_CATEGORY_ORDER
      .filter((cat) => groups[cat] && groups[cat].length > 0)
      .map((cat) => ({ category: cat, rows: groups[cat] }));
  }, [scoring]);

  const settings = league?.settings || {};
  const waiverLabel = settings.waiver_budget > 0
    ? `FAAB budget ($${settings.waiver_budget})`
    : (WAIVER_TYPE_LABELS[settings.waiver_type] || "Rolling waiver priority");
  const tradeDeadline = settings.trade_deadline
    ? `Week ${settings.trade_deadline}`
    : "No deadline set";

  const rosterRows = [
    ...Object.entries(starterCounts).map(([pos, count]) => [POSITION_LABELS[pos] || pos, count]),
    ["Bench", benchCount],
    ...(settings.taxi_slots ? [["Taxi squad", settings.taxi_slots]] : []),
    ...(settings.reserve_slots ? [["IR slots", settings.reserve_slots]] : []),
  ];

  const generalRows = [
    ["League type", LEAGUE_TYPE_LABELS[settings.type] ?? "Dynasty"],
    ["League size", settings.num_teams ?? "-"],
    ["Waivers", waiverLabel],
    ...(settings.waiver_day_of_week !== undefined ? [["Waiver clear day", WEEKDAYS[settings.waiver_day_of_week] ?? settings.waiver_day_of_week]] : []),
    ...(settings.waiver_clear_days ? [["Waiver clear days", settings.waiver_clear_days]] : []),
    ["Trade deadline", tradeDeadline],
    ...(settings.veto_votes_needed ? [["Trade veto votes needed", settings.veto_votes_needed]] : []),
    ...(settings.disable_adds !== undefined ? [["Free agent adds", settings.disable_adds ? "Disabled" : "Enabled"]] : []),
    ...(settings.best_ball ? [["Best ball", "Yes"]] : []),
    ...(settings.taxi_deadline ? [["Taxi deadline", `Week ${settings.taxi_deadline}`]] : []),
  ];

  const playoffRows = [
    ["Playoff teams", settings.playoff_teams ?? "-"],
    ["Playoffs start", settings.playoff_week_start ? `Week ${settings.playoff_week_start}` : "-"],
    ...(settings.playoff_round_type !== undefined ? [["Championship format", settings.playoff_round_type === 1 ? "2-week championship" : "1 week per round"]] : []),
    ...(settings.playoff_seed_type !== undefined ? [["Reseeding", settings.playoff_seed_type ? "Reseed each round" : "Bracket set at start"]] : []),
  ];

  return (
    <div>
      <BalancedGrid
        items={[
          {
            key: "dues",
            node: (
              <InfoTable
                title="Dues & payout"
                rows={[
                  ["Entry fee", `$${DUES.entryFee} / manager`],
                  ...DUES.payout.map((p) => [`${p.place} place`, `$${p.amount}`]),
                ]}
                note={`${DUES.note}. Adjust anytime the pot size changes.`}
              />
            ),
          },
          ...scoringByCategory.map(({ category, rows }) => ({
            key: category,
            node: <InfoTable title={`Scoring: ${category}`} rows={rows} accent={CATEGORY_ACCENTS[category]} />,
          })),
          { key: "roster", node: <InfoTable title="Roster composition" rows={rosterRows} accent={COLORS.turfLight} /> },
          { key: "general", node: <InfoTable title="General settings" rows={generalRows} /> },
          { key: "playoff", node: <InfoTable title="Playoff settings" rows={playoffRows} accent={COLORS.goldDeep} /> },
        ]}
      />

      <div style={{ marginTop: 16, fontSize: 11, color: COLORS.muted }}>
        League is set to {scoringType.toLowerCase()}. Every nonzero scoring rule from Sleeper is broken out above, plus
        everything else pulled live from your league settings. Change it in Sleeper and it'll update here automatically.
      </div>
    </div>
  );
}
