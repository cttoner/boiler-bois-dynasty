                            <Crest name={teamName(p.owner)} logo={avatarUrl(p.owner)} size={22} />
                            <span style={{ fontSize: 13, fontWeight: 600 }}>{withOwner(p.owner)}</span>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                </div>
              </Card>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// Best waiver/free-agent pickup of a season, judged by how many points that
// player scored while on the roster that added them (ownerPlayerTotals is
// already ownership-scoped per week, so this naturally only counts the
// points earned on that specific team).
function computeSeasonWaiverMVP(summary) {
  if (!summary.waiverMoves || !summary.rosters) return null;
  let best = null;
  summary.waiverMoves.forEach((t) => {
    Object.entries(t.adds || {}).forEach(([pid, rid]) => {
      const ownerId = summary.rosters.find((r) => r.roster_id === rid)?.owner_id;
      if (!ownerId) return;
      const pts = summary.ownerPlayerTotals?.[ownerId]?.[pid] || 0;
      if (!best || pts > best.points) best = { playerId: pid, ownerId, points: pts };
    });
  });
  return best;
}

// Trades plus waiver/free-agent moves combined, one manager's total roster
// activity for the season.
function computeSeasonMostActiveManager(summary) {
  if (!summary.rosters) return null;
  const counts = {};
  (summary.trades || []).forEach((t) => {
    (t.roster_ids || []).forEach((rid) => {
      const ownerId = summary.rosters.find((r) => r.roster_id === rid)?.owner_id;
      if (ownerId) counts[ownerId] = (counts[ownerId] || 0) + 1;
    });
  });
  (summary.waiverMoves || []).forEach((t) => {
    const rid = (t.roster_ids || [])[0];
    const ownerId = summary.rosters.find((r) => r.roster_id === rid)?.owner_id;
    if (ownerId) counts[ownerId] = (counts[ownerId] || 0) + 1;
  });
  let best = null;
  Object.entries(counts).forEach(([ownerId, count]) => {
    if (!best || count > best.count) best = { ownerId, count };
  });
  return best;
}

function buildSeasonHistoryData(summary, players, ownerDirectory) {
  function playerLabelFor(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position})` : name;
  }

  const leagueSummaryRows = [];

  // Champion and every season-level superlative stay blank for a season
  // still in progress, since none of them are actually decided yet.
  if (summary.isComplete) {
    if (summary.champion) {
      leagueSummaryRows.push(["Champion", withOwner(summary.champion)]);
      if (summary.runnerUp) leagueSummaryRows.push(["Runner-up", withOwner(summary.runnerUp)]);
      if (summary.third) leagueSummaryRows.push(["Third", withOwner(summary.third)]);
    }

    if (summary.standings.length > 0) {
      const topScorer = [...summary.standings].sort((a, b) => b.fpts - a.fpts)[0];
      leagueSummaryRows.push(["Points leader", `${topScorer.displayName}, ${fmt(topScorer.fpts)} PF`]);
    }

    if (summary.highGame) {
      leagueSummaryRows.push(["Best single week", `${withOwner(summary.highGame.owner)}, ${fmt(summary.highGame.points)} pts (Wk ${summary.highGame.week})`]);
    }

    if (summary.bestPlayerGame) {
      let val = `${playerLabelFor(summary.bestPlayerGame.playerId)}, ${fmt(summary.bestPlayerGame.points)} pts (Wk ${summary.bestPlayerGame.week}`;
      if (summary.bestPlayerGame.owner) val += `, ${withOwner(summary.bestPlayerGame.owner)}`;
      val += ")";
      leagueSummaryRows.push(["Best individual performance", val]);
    }

    const waiverMVP = computeSeasonWaiverMVP(summary);
    if (waiverMVP && waiverMVP.points > 0) {
      leagueSummaryRows.push(["Waiver wire MVP", `${playerLabelFor(waiverMVP.playerId)}, ${fmt(waiverMVP.points)} pts (${withOwner(ownerDirectory?.[waiverMVP.ownerId])})`]);
    }

    const activeManager = computeSeasonMostActiveManager(summary);
    if (activeManager && activeManager.count > 0) {
      leagueSummaryRows.push(["Most active manager", `${withOwner(ownerDirectory?.[activeManager.ownerId])}, ${activeManager.count} move${activeManager.count === 1 ? "" : "s"}`]);
    }

    if (summary.lastPlace) {
      leagueSummaryRows.push(["Wall of shame", withOwner(summary.lastPlace)]);
    }
  }

  const teamRows = summary.standings.map((s, i) => ({
    rank: i + 1,
    ownerId: s.ownerId,
    displayName: s.displayName,
    name: s.name,
    avatar: s.avatar,
    wins: s.wins,
    losses: s.losses,
    ties: s.ties,
    fpts: s.fpts,
    fptsAgainst: s.fptsAgainst,
    diff: s.fpts - s.fptsAgainst,
  }));

  return { leagueSummaryRows, teamRows };
}

// Same phrase-bank approach as the weekly Recap, scoped to a whole season.
// Only ever called for completed seasons - an in-progress season has no
// champion, no wall of shame, nothing settled enough to narrate yet.
const SEASON_RECAP_PHRASES = {
  championWithRunnerUp: [
    ({ C, R, season }) => `${C} won the whole damn thing in ${season}, taking down ${R} for the title.`,
    ({ C, R, season }) => `${season} belongs to ${C}, who beat ${R} when it mattered most.`,
    ({ C, R, season }) => `The trophy went to ${C} in ${season}. ${R} got the runner-up plaque and a long offseason to think about it.`,
    ({ C, R, season }) => `${C} outlasted the whole league in ${season}, with ${R} left holding the second-place bag.`,
    ({ C, R, season }) => `Bragging rights for ${season} belong to ${C}. ${R} came close, which somehow makes it worse.`,
    ({ C, R, season }) => `${C} closed out ${season} as champion, running straight through ${R} to get there.`,
  ],
  championSolo: [
    ({ C, season }) => `${C} took home the ${season} title.`,
    ({ C, season }) => `${season}'s champion: ${C}. Somebody go update the banner.`,
    ({ C, season }) => `${C} is the name on the ${season} trophy.`,
  ],
  pointsLeaderSameAsChamp: [
    ({ PL, pts, season }) => `And they didn't just win the title, ${PL} led the league in scoring too, ${pts} points. An absolute clean sweep.`,
    ({ PL, pts, season }) => `${PL} backed up the trophy with the league's best scoring output, ${pts} points on the year. No arguments there.`,
    ({ PL, pts, season }) => `${PL} was the best team on paper and on the scoreboard in ${season}, finishing with ${pts} points and the title to match.`,
  ],
  pointsLeaderDifferent: [
    ({ PL, pts, season }) => `Meanwhile ${PL} put up the most points in the league (${pts}) and still didn't walk away with the trophy. Fantasy football doesn't give a shit about your points total in November.`,
    ({ PL, pts, season }) => `The scoring title went to ${PL} with ${pts} points, proof that the best team on paper doesn't always win the bracket.`,
    ({ PL, pts, season }) => `${PL} scored more than anyone else all season, ${pts} points, and still has to watch someone else hold the trophy. Brutal.`,
    ({ PL, pts, season }) => `${PL} led the league in points (${pts}) and has nothing but a good fpts column to show for it.`,
  ],
  highGame: [
    ({ HG, pts, week }) => `The single best week of the season belonged to ${HG}, who dropped ${pts} points in Week ${week}.`,
    ({ HG, pts, week }) => `Nobody topped ${HG}'s Week ${week} outburst all year: ${pts} points in one week.`,
    ({ HG, pts, week }) => `${HG} put up the highest single-week score of the season in Week ${week}, ${pts} points.`,
  ],
  bestPlayerGame: [
    ({ P, T, pts, week }) => `And the best individual performance of the season came from ${P}, who went off for ${pts} points in Week ${week}${T ? ` for ${T}` : ""}.`,
    ({ P, T, pts, week }) => `${P} turned in the single best fantasy performance of the season: ${pts} points in Week ${week}${T ? `, playing for ${T}` : ""}.`,
    ({ P, T, pts, week }) => `Nobody had a better single game all season than ${P}'s ${pts}-point Week ${week}${T ? ` for ${T}` : ""}.`,
  ],
  waiverMVP: [
    ({ P, T, pts }) => `${T} found a genuine difference-maker on waivers this season: ${P} put up ${pts} points after getting picked up.`,
    ({ P, T, pts }) => `The best waiver pickup of the season belongs to ${T}, who scooped up ${P} for ${pts} points worth of production.`,
    ({ P, T, pts }) => `Somebody actually read the waiver wire correctly this year. ${T} added ${P} and got ${pts} points out of the move.`,
    ({ P, T, pts }) => `${P} was sitting on the waiver wire and ${T} was the one who noticed, cashing in for ${pts} points.`,
  ],
  mostActiveManager: [
    ({ T, count }) => `${T} couldn't leave the roster alone, making ${count} trades and waiver moves combined, more than anyone else in the league.`,
    ({ T, count }) => `${T} led the league in roster moves this season with ${count} trades and waiver claims combined. Never a dull moment.`,
    ({ T, count }) => `Nobody touched their roster more than ${T}, who racked up ${count} trades and waiver moves this season.`,
    ({ T, count }) => `${T} treated the transaction log like a part-time job, ${count} moves between trades and waivers this season alone.`,
  ],
  lastPlace: [
    ({ LP, season }) => `As for the bottom of the barrel, ${LP} finished dead last in ${season} and earned a permanent spot on the wall of shame.`,
    ({ LP, season }) => `Somebody had to be the basement dweller. That honor went to ${LP}.`,
    ({ LP, season }) => `${LP} closed out the season in the cellar. There's always next year, allegedly.`,
    ({ LP, season }) => `The wall of shame added a new name this year: ${LP}.`,
    ({ LP, season }) => `${LP} owns last place for ${season}, and the group chat did not let this one go quietly.`,
  ],
  closer: [
    ({ season }) => `That's a wrap on ${season}. On to the next one.`,
    ({ season }) => `${season} is in the books. Time to start overthinking next year's draft.`,
    ({ season }) => `Another season, another set of receipts. ${season} is officially closed for business.`,
    ({ season }) => `${season}'s story has been told. See everyone at next year's draft.`,
  ],
};

function buildSeasonRecapNarrative(summary, players, ownerDirectory) {
  if (!summary || !summary.isComplete) return [];
  const season = summary.season;
  const paragraphs = [];

  function playerLabelFor(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position})` : name;
  }

  // Paragraph 1: the crown itself, plus the scoring title, joined together.
  const titleSentences = [];
  if (summary.champion) {
    const C = withOwner(summary.champion);
    if (summary.runnerUp) {
      const ctx = { C, R: withOwner(summary.runnerUp), season };
      titleSentences.push(pick(SEASON_RECAP_PHRASES.championWithRunnerUp, hashSeed(season, "champion", C, ctx.R))(ctx));
    } else {
      const ctx = { C, season };
      titleSentences.push(pick(SEASON_RECAP_PHRASES.championSolo, hashSeed(season, "championSolo", C))(ctx));
    }
  }

  if (summary.standings.length > 0) {
    const topScorer = [...summary.standings].sort((a, b) => b.fpts - a.fpts)[0];
    const sameAsChamp = summary.champion && topScorer.ownerId === summary.champion.user_id;
    const ctx = { PL: topScorer.displayName, pts: fmt(topScorer.fpts), season };
    const bank = sameAsChamp ? SEASON_RECAP_PHRASES.pointsLeaderSameAsChamp : SEASON_RECAP_PHRASES.pointsLeaderDifferent;
    titleSentences.push(pick(bank, hashSeed(season, "pointsLeader", ctx.PL))(ctx));
  }
  if (titleSentences.length > 0) paragraphs.push(titleSentences.join(" "));

  // Paragraph 2: the season's highlight-reel stats and the wall of shame.
  const highlightSentences = [];
  if (summary.highGame) {
    const ctx = { HG: withOwner(summary.highGame.owner), pts: fmt(summary.highGame.points), week: summary.highGame.week, season };
    highlightSentences.push(pick(SEASON_RECAP_PHRASES.highGame, hashSeed(season, "highGame", ctx.HG))(ctx));
  }
  if (summary.bestPlayerGame) {
    const ctx = {
      P: playerLabelFor(summary.bestPlayerGame.playerId),
      T: summary.bestPlayerGame.owner ? withOwner(summary.bestPlayerGame.owner) : null,
      pts: fmt(summary.bestPlayerGame.points),
      week: summary.bestPlayerGame.week,
      season,
    };
    highlightSentences.push(pick(SEASON_RECAP_PHRASES.bestPlayerGame, hashSeed(season, "bestPlayerGame", ctx.P))(ctx));
  }
  const waiverMVP = computeSeasonWaiverMVP(summary);
  if (waiverMVP && waiverMVP.points > 0) {
    const ctx = { P: playerLabelFor(waiverMVP.playerId), T: withOwner(ownerDirectory?.[waiverMVP.ownerId]), pts: fmt(waiverMVP.points) };
    highlightSentences.push(pick(SEASON_RECAP_PHRASES.waiverMVP, hashSeed(season, "waiverMVP", ctx.P))(ctx));
  }
  const activeManager = computeSeasonMostActiveManager(summary);
  if (activeManager && activeManager.count > 0) {
    const ctx = { T: withOwner(ownerDirectory?.[activeManager.ownerId]), count: activeManager.count };
    highlightSentences.push(pick(SEASON_RECAP_PHRASES.mostActiveManager, hashSeed(season, "mostActiveManager", ctx.T))(ctx));
  }
  if (summary.lastPlace) {
    const ctx = { LP: withOwner(summary.lastPlace), season };
    highlightSentences.push(pick(SEASON_RECAP_PHRASES.lastPlace, hashSeed(season, "lastPlace", ctx.LP))(ctx));
  }
  if (highlightSentences.length > 0) paragraphs.push(highlightSentences.join(" "));

  if (paragraphs.length > 0) {
    paragraphs.push(pick(SEASON_RECAP_PHRASES.closer, hashSeed(season, "closer"))({ season }));
  }

  return paragraphs;
}

function HistoryTab({ rostersById, usersById, standings, seasonHistory, superlatives, players, currentSeason }) {
  // One summary per season, current one included.
  const seasonSummaries = useMemo(() => {
    const historical = (seasonHistory || []).map((s) => ({
      season: s.season,
      isComplete: true,
      champion: s.champion,
      runnerUp: s.runnerUp,
      third: s.third,
      lastPlace: s.lastPlace,
      standings: s.standings || [],
      highGame: s.highGame,
      bestPlayerGame: s.bestPlayerGame,
      trades: s.trades || [],
      waiverMoves: s.waiverMoves || [],
      rosters: s.rosters || [],
      ownerPlayerTotals: s.ownerPlayerTotals || {},
    }));
    const currentTopWeek = superlatives?.currentSeasonSuper?.topWeek;
    const currentHighGame = currentTopWeek
      ? { owner: usersById[rostersById[currentTopWeek.rosterId]?.owner_id], points: currentTopWeek.points, week: currentTopWeek.week }
      : null;
    const current = {
      season: currentSeason,
      isComplete: false,
      champion: null,
      runnerUp: null,
      third: null,
      lastPlace: null,
      standings: standings || [],
      highGame: currentHighGame,
      bestPlayerGame: superlatives?.currentSeasonSuper?.bestPlayerGame || null,
    };
    return [current, ...historical].sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory, currentSeason, standings, superlatives, rostersById, usersById]);

  const ownerDirectory = useMemo(() => {
    const map = {};
    [...(seasonHistory || [])].sort((a, b) => Number(a.season) - Number(b.season)).forEach((s) => {
      (s.users || []).forEach((u) => { map[u.user_id] = u; });
    });
    Object.values(usersById).forEach((u) => { map[u.user_id] = u; });
    return map;
  }, [seasonHistory, usersById]);

  const [selectedSeasonIdx, setSelectedSeasonIdx] = useState(0);
  const selectedSummary = seasonSummaries[selectedSeasonIdx];
  const historyData = selectedSummary ? buildSeasonHistoryData(selectedSummary, players, ownerDirectory) : null;
  const seasonNarrative = selectedSummary ? buildSeasonRecapNarrative(selectedSummary, players, ownerDirectory) : [];

  if (seasonSummaries.every((s) => s.standings.length === 0)) {
    return (
      <div>
        <SectionLabel>History</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed weeks yet this season. Check back after Week 1.</div>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionLabel>History</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Season by season, receipts don't expire. Champions, superlatives, and every team's full stat line, forever.
      </div>

      <div style={{ display: "flex", gap: 4, marginBottom: 12, flexWrap: "wrap" }}>
        {seasonSummaries.map((s, i) => (
          <button
            key={s.season}
            onClick={() => setSelectedSeasonIdx(i)}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "6px 12px",
              borderRadius: 6,
              border: `1px solid ${selectedSeasonIdx === i ? COLORS.gold : COLORS.hairline}`,
              background: selectedSeasonIdx === i ? COLORS.surfaceLight : "transparent",
              color: selectedSeasonIdx === i ? COLORS.gold : COLORS.muted,
              cursor: "pointer",
            }}
          >
            {s.season}{!s.isComplete ? " (in progress)" : ""}
          </button>
        ))}
      </div>

      <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: COLORS.turf, marginBottom: 10 }}>
        Season {selectedSummary?.season}
      </div>

      {seasonNarrative.length > 0 && (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: COLORS.turfLight, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>
            The Recap
          </div>
          {seasonNarrative.map((p, i) => (
            <div
              key={i}
              style={{
                color: COLORS.bone,
                fontSize: 14,
                lineHeight: 1.6,
                marginTop: i === 0 ? 0 : 10,
                fontWeight: i === 0 ? 600 : 400,
              }}
            >
              {p}
            </div>
          ))}
        </Card>
      )}

      {historyData && (
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 280px", minWidth: 260 }}>
            {historyData.leagueSummaryRows.length > 0 ? (
              <InfoTable title="League summary" rows={historyData.leagueSummaryRows} accent={COLORS.goldDeep} />
            ) : (
              <div>
                <SectionLabel>League summary</SectionLabel>
                <Card>
                  <div style={{ color: COLORS.muted, fontSize: 13 }}>
                    Champion and season superlatives show up here once the season wraps up.
                  </div>
                </Card>
              </div>
            )}
          </div>
          <div style={{ flex: "2 1 420px" }}>
            <SectionLabel>Team synopsis</SectionLabel>
            <Card style={{ padding: 0, overflow: "hidden" }}>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ background: COLORS.surfaceLight }}>
                      {["#", "Team", "W", "L", "T", "PF", "PA", "Diff"].map((h, i) => (
                        <th
                          key={h}
                          style={{
                            textAlign: i <= 1 ? "left" : "right",
                            padding: "7px 12px",
                            fontFamily: "'IBM Plex Mono', monospace",
                            fontSize: 11,
                            letterSpacing: "0.06em",
                            color: COLORS.muted,
                            textTransform: "uppercase",
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {historyData.teamRows.map((t, i) => (
                      <tr key={t.ownerId || i} style={{ borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}>
                        <td style={{ padding: "7px 12px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {t.rank}
                        </td>
                        <td style={{ padding: "7px 12px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <Crest name={t.name} logo={t.avatar} size={22} />
                            <span style={{ fontSize: 13, fontWeight: 600 }}>{t.displayName}</span>
                          </div>
                        </td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.wins}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.losses}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{t.ties}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.gold }}>{fmt(t.fpts)}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.muted }}>{fmt(t.fptsAgainst)}</td>
                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: t.diff >= 0 ? COLORS.turf : COLORS.leatherDeep, fontWeight: 600 }}>
                          {t.diff >= 0 ? "+" : ""}{fmt(t.diff)}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          </div>
        </div>
      )}
    </div>
  );
}

// Shared across Home and Rosters: every all-time aggregation (champions,
// wall of shame, and the 8 league-wide superlative titles) computed once
// from a single source of truth, so both pages always agree on who holds what.
function useLeagueSuperlatives(data, standings, usersById) {
  const { league, seasonHistory, weekMatchups, rosters, users } = data;

  const championsByOwner = useMemo(() => {
    const map = {};
    seasonHistory.forEach((s) => {
      if (!s.champion) return;
      const key = s.champion.user_id;
      if (!map[key]) map[key] = { user: s.champion, years: [] };
      map[key].years.push(s.season);
    });
    return Object.values(map).sort((a, b) => b.years.length - a.years.length);
  }, [seasonHistory]);

  const orderedTitles = useMemo(() => {
    return [...seasonHistory].filter((s) => s.champion).sort((a, b) => Number(a.season) - Number(b.season));
  }, [seasonHistory]);

  const currentSeasonSuper = useMemo(() => {
    let topWeek = null;
    let blowout = null;
    let bestPlayerGame = null;
    Object.entries(weekMatchups || {}).forEach(([week, matchups]) => {
      const byMatchupId = {};
      matchups.forEach((m) => {
        if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
        byMatchupId[m.matchup_id].push(m);
      });
      Object.values(byMatchupId).forEach((pair) => {
        pair.forEach((m) => {
          if (!topWeek || (m.points ?? 0) > topWeek.points) {
            topWeek = { points: m.points ?? 0, rosterId: m.roster_id, week };
          }
          Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
            if (!bestPlayerGame || pts > bestPlayerGame.points) {
              const owner = usersById[rosters.find((r) => r.roster_id === m.roster_id)?.owner_id];
              bestPlayerGame = { playerId: pid, points: pts, week, owner };
            }
          });
        });
        if (pair.length === 2) {
          const margin = Math.abs((pair[0].points ?? 0) - (pair[1].points ?? 0));
          const winner = pair[0].points >= pair[1].points ? pair[0] : pair[1];
          if (!blowout || margin > blowout.margin) {
            blowout = { margin, rosterId: winner.roster_id, week };
          }
        }
      });
    });
    return { topWeek, blowout, bestPlayerGame };
  }, [weekMatchups, rosters, usersById]);

  const ownerForRoster = (rid) => {
    const r = rosters.find((r) => r.roster_id === rid);
    return r ? usersById[r.owner_id] : null;
  };

  const wallOfShame = useMemo(() => {
    return [...seasonHistory].filter((s) => s.lastPlace).sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory]);

  const historyRows = useMemo(() => {
    return [...seasonHistory].sort((a, b) => Number(b.season) - Number(a.season));
  }, [seasonHistory]);

  const ownerDirectory = useMemo(() => {
    const map = {};
    [...seasonHistory].sort((a, b) => Number(a.season) - Number(b.season)).forEach((s) => {
      (s.users || []).forEach((u) => { map[u.user_id] = u; });
    });
    users.forEach((u) => { map[u.user_id] = u; });
    return map;
  }, [seasonHistory, users]);

  const allSeasonEntries = useMemo(() => {
    const hist = seasonHistory.map((s) => ({
      season: s.season,
      standings: s.standings || [],
      playoffWins: s.playoffWins || {},
      highGame: s.highGame || null,
      bestPlayerGame: s.bestPlayerGame || null,
    }));
    let currentHighGame = null;
    if (currentSeasonSuper.topWeek) {
      const r = rosters.find((r) => r.roster_id === currentSeasonSuper.topWeek.rosterId);
      const owner = r ? usersById[r.owner_id] : null;
      if (owner) currentHighGame = { owner, points: currentSeasonSuper.topWeek.points, week: currentSeasonSuper.topWeek.week };
    }
    const current = {
      season: league?.season,
      standings: standings || [],
      playoffWins: {},
      highGame: currentHighGame,
      bestPlayerGame: currentSeasonSuper.bestPlayerGame || null,
    };
    return [...hist, current];
  }, [seasonHistory, standings, currentSeasonSuper, rosters, usersById, league]);

  const allTimeSuperlatives = useMemo(() => {
    const career = {};
    const playoffTotals = {};
    let bestSeason = null;
    let highestScoringSeason = null;
    let singleGame = null;
    let bestPlayerRecord = null;

    allSeasonEntries.forEach((entry) => {
      (entry.standings || []).forEach((s) => {
        if (!s.ownerId) return;
        if (!career[s.ownerId]) career[s.ownerId] = { wins: 0, losses: 0, ties: 0, fpts: 0, games: 0 };
        career[s.ownerId].wins += s.wins;
        career[s.ownerId].losses += s.losses;
        career[s.ownerId].ties += s.ties;
        career[s.ownerId].fpts += s.fpts;
        career[s.ownerId].games += s.wins + s.losses + s.ties;

        const games = s.wins + s.losses + s.ties;
        if (games > 0) {
          const pct = (s.wins + s.ties * 0.5) / games;
          if (!bestSeason || pct > bestSeason.pct || (pct === bestSeason.pct && s.fpts > bestSeason.fpts)) {
            bestSeason = { ownerId: s.ownerId, wins: s.wins, losses: s.losses, ties: s.ties, season: entry.season, pct, fpts: s.fpts };
          }
        }
        if (!highestScoringSeason || s.fpts > highestScoringSeason.fpts) {
          highestScoringSeason = { ownerId: s.ownerId, fpts: s.fpts, season: entry.season };
        }
      });

      Object.entries(entry.playoffWins || {}).forEach(([ownerId, wins]) => {
        playoffTotals[ownerId] = (playoffTotals[ownerId] || 0) + wins;
      });

      if (entry.highGame && (!singleGame || entry.highGame.points > singleGame.points)) {
        singleGame = { owner: entry.highGame.owner, points: entry.highGame.points, week: entry.highGame.week, season: entry.season };
      }

      if (entry.bestPlayerGame && (!bestPlayerRecord || entry.bestPlayerGame.points > bestPlayerRecord.points)) {
        bestPlayerRecord = { ...entry.bestPlayerGame, season: entry.season };
      }
    });

    let bestWinPct = null;
    let bestPPG = null;
    Object.entries(career).forEach(([ownerId, c]) => {
      if (c.games === 0) return;
      const pct = (c.wins + c.ties * 0.5) / c.games;
      if (!bestWinPct || pct > bestWinPct.pct) bestWinPct = { ownerId, pct, wins: c.wins, losses: c.losses };
      const ppg = c.fpts / c.games;
      if (!bestPPG || ppg > bestPPG.ppg) bestPPG = { ownerId, ppg };
    });

    let mostPlayoffWins = null;
    Object.entries(playoffTotals).forEach(([ownerId, wins]) => {
      if (!mostPlayoffWins || wins > mostPlayoffWins.wins) mostPlayoffWins = { ownerId, wins };
    });

    return { bestWinPct, bestPPG, mostPlayoffWins, bestSeason, highestScoringSeason, singleGame, bestPlayerRecord };
  }, [allSeasonEntries]);

  const mostTitles = championsByOwner[0];

  return {
    championsByOwner, orderedTitles, currentSeasonSuper, ownerForRoster, wallOfShame,
    historyRows, ownerDirectory, allSeasonEntries, allTimeSuperlatives, mostTitles,
  };
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return `${n}${s[(v - 20) % 10] || s[v] || s[0]}`;
}

function PodiumRow({ season, champion, runnerUp, third }) {
  const steps = [
    { place: 2, user: runnerUp, height: 40, color: COLORS.turfLight },
    { place: 1, user: champion, height: 60, color: COLORS.gold },
    { place: 3, user: third, height: 28, color: COLORS.leather },
  ];
  return (
    <Card style={{ padding: "10px 12px 0" }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: COLORS.muted, marginBottom: 8 }}>
        {season}
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 6, justifyContent: "center" }}>
        {steps.map((st) => (
          <div key={st.place} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, minWidth: 0 }}>
            {st.user ? <Crest name={teamName(st.user)} logo={avatarUrl(st.user)} size={26} /> : <div style={{ width: 26, height: 26 }} />}
            <div
              style={{
                fontSize: 11,
                textAlign: "center",
                marginTop: 4,
                marginBottom: 6,
                color: st.place === 1 ? COLORS.turf : COLORS.muted,
                fontWeight: st.place === 1 ? 600 : 400,
                maxWidth: 90,
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}
            >
              {st.user ? withOwner(st.user) : "-"}
            </div>
            <div
              style={{
                width: "100%",
                height: st.height,
                background: st.color,
                borderRadius: "4px 4px 0 0",
                display: "flex",
                alignItems: "flex-start",
                justifyContent: "center",
                paddingTop: 4,
              }}
            >
              <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 13, color: "#FFFFFF" }}>{st.place}</span>
            </div>
          </div>
        ))}
      </div>
    </Card>
  );
}

function HomeTab({ data, standings, usersById, superlatives, rostersById }) {
  const { league, seasonHistory, rosters, players, seasonType } = data;
  const {
    championsByOwner, orderedTitles, currentSeasonSuper, ownerForRoster,
    wallOfShame, historyRows, ownerDirectory, allTimeSuperlatives, mostTitles,
  } = superlatives;

  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position}${p.team ? ` - ${p.team}` : ""})` : name;
  }

  const scoringType = (() => {
    const rec = league?.scoring_settings?.rec;
    if (rec === 1) return "Full PPR";
    if (rec === 0.5) return "Half PPR";
    if (rec === 0) return "Standard";
    return rec !== undefined ? `${rec} pt/rec` : "-";
  })();

  const seasonNumber = seasonHistory.length + 1;
  const leagueTitle = `${ordinal(seasonNumber)} Annual ${league?.name || "Dynasty League"}`;

  // Quick lineup breakdown, e.g. "1 QB · 2 RB · 2 WR · 1 TE · 1 FLEX"
  const lineupSummary = useMemo(() => {
    const counts = {};
    let bench = 0;
    (league?.roster_positions || []).forEach((p) => {
      if (p === "BN") { bench++; return; }
      counts[p] = (counts[p] || 0) + 1;
    });
    const order = ["QB", "RB", "WR", "TE", "FLEX", "SUPER_FLEX", "REC_FLEX", "WRRB_FLEX", "K", "DEF"];
    const parts = order
      .filter((k) => counts[k])
      .map((k) => `${counts[k]} ${POSITION_LABELS[k] || k}`);
    Object.keys(counts).filter((k) => !order.includes(k)).forEach((k) => parts.push(`${counts[k]} ${k}`));
    return { line: parts.join(" · "), bench };
  }, [league]);

  const settings = league?.settings || {};
  const waiverLabel = settings.waiver_budget > 0 ? `FAAB ($${settings.waiver_budget})` : "Rolling priority";

  const glanceRows = [
    ["League size", `${rosters.length} teams`],
    ["Format", "Head-to-head"],
    ["Scoring", scoringType],
    ["Lineup", lineupSummary.line || "-"],
    ["Bench / IR", `${lineupSummary.bench} bench${settings.reserve_slots ? ` · ${settings.reserve_slots} IR` : ""}${settings.taxi_slots ? ` · ${settings.taxi_slots} taxi` : ""}`],
    ["Regular season", settings.playoff_week_start ? `${settings.playoff_week_start - 1} weeks` : "-"],
    ["Playoffs", settings.playoff_teams ? `${settings.playoff_teams}-team bracket, starts Wk ${settings.playoff_week_start ?? "-"}` : "-"],
    ["Trade deadline", settings.trade_deadline ? `Week ${settings.trade_deadline}` : "None set"],
    ["Waivers", waiverLabel],
  ];

  return (
    <div>
      {/* Champions banner strip */}
      {orderedTitles.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <SectionLabel>Champions</SectionLabel>
          <div style={{ display: "flex", gap: 18, overflowX: "auto", padding: "10px 4px 12px" }}>
            {orderedTitles.map((s) => (
              <div key={s.season} style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.leather, marginBottom: -1, position: "relative", zIndex: 2 }} />
                <div
                  className="banner-pennant"
                  style={{
                    minWidth: 130,
                    background: COLORS.turf,
                    padding: "14px 14px 22px",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 8,
                    clipPath: "polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%)",
                  }}
                >
                  <Crest name={teamName(s.champion)} logo={avatarUrl(s.champion)} size={38} />
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 13, color: COLORS.yellow }}>
                      {s.season}
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.onTurf, marginTop: 2 }}>
                      {teamName(s.champion)}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Welcome / league intro */}
      <Card style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: COLORS.turfLight, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>
          Welcome to the league
        </div>
        <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 22, color: COLORS.turf, marginBottom: 8 }}>
          {leagueTitle}
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, fontWeight: 600 }}>
          Let's fucking go. Football is back, and it is so back. Somewhere right now some guy who spent his entire
          offseason rehabbing a torn ACL is about to run full speed into a linebacker so you can win a lineup bet
          against your buddy from the comfort of your couch. These men train year round, get paid to get hit for a
          living, and show up anyway. That's real work. Respect it.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Meanwhile we're sitting on our asses in sweatpants, clicking a screen, pretending we're general managers
          because we know what a bye week is. That's fine. That's the whole bit. Nobody's out here doing agility
          drills for this league. Just don't be the asshole who forgets to start his flex.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Football is back. Nobody remembers your draft grade in August, and this league sure as hell doesn't hand
          out participation trophies. Rosters carry over year to year. Every trade is a bet you'd better be ready to
          back up. There's no rebuild without a plan and no shortcuts to a ring.{" "}
          {seasonType === "pre"
            ? `Season ${league?.season} kicks off soon.`
            : seasonType === "off"
            ? `Season ${league?.season} is being built right now.`
            : `Season ${league?.season} is live.`}{" "}
          Come compete or get out of the way.
        </div>
        <div style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.5, marginTop: 10 }}>
          Some of you play it safe and call it a system. Some of you talk a big game every single year and never
          back it up. Some of you get your hearts broken right on schedule and show up again anyway. Some of you
          are still out here saying this is finally the year, same as every year before it. None of that wins you a
          single game here. Show up and hit somebody.
        </div>
      </Card>

      {/* League at a glance + Titles, side by side */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <InfoTable title="League at a glance" rows={glanceRows} />
        </div>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <SectionLabel>Titles</SectionLabel>
          {championsByOwner.length === 0 ? (
            <Card>
              <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No champions crowned yet. That's still this season's to decide.</div>
            </Card>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {championsByOwner.map((c) => (
                <Card
                  key={c.user.user_id}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderLeft: `3px solid ${teamColor(teamName(c.user))}` }}
                >
                  <Crest name={teamName(c.user)} logo={avatarUrl(c.user)} size={32} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 600 }}>{withOwner(c.user)}</div>
                    <div style={{ fontSize: 12, color: COLORS.muted }}>{c.years.slice().sort().join(", ")}</div>
                  </div>
                  <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 18, color: COLORS.gold, whiteSpace: "nowrap", flexShrink: 0 }}>
                    {c.years.length} {c.years.length === 1 ? "title" : "titles"}
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* League history: podium by year */}
      <SectionLabel>League history</SectionLabel>
      {historyRows.length === 0 ? (
        <Card style={{ marginBottom: 14 }}>
          <div style={{ color: COLORS.muted }}>
            This is the earliest linked season for your league. History fills in automatically as seasons stack up.

        <div style={{ marginBottom: 14 }}>

              node: <PodiumRow season={s.season} champion={s.champion} runnerUp={s.runnerUp} third={s.third} />,
            }))}

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <SectionLabel>All-time superlatives</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <SuperlativeCard

              user={allTimeSuperlatives.bestWinPct ? ownerDirectory[allTimeSuperlatives.bestWinPct.ownerId] : null}

              accent={SUPERLATIVE_ACCENTS[3]}
              label="Highest career PPG"

            />

              accent={SUPERLATIVE_ACCENTS[4]}

              user={allTimeSuperlatives.bestSeason ? ownerDirectory[allTimeSuperlatives.bestSeason.ownerId] : null}
            />

              user={allTimeSuperlatives.highestScoringSeason ? ownerDirectory[allTimeSuperlatives.highestScoringSeason.ownerId] : null}

// Measures each item's real rendered height, then splits items between two
// columns to minimize the height difference between them (greedy longest-first
// bin packing): a hard guarantee rather than relying on the browser's CSS
// column-balancing heuristic.
function BalancedGrid({ items, gap = 12, minWidth = 280 }) {
  const measureRefs = useRef([]);
  const [heights, setHeights] = useState(null);

  useEffect(() => {
    function measure() {
      setHeights(measureRefs.current.map((el) => (el ? el.offsetHeight : 0)));
    }
    measure();
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [items.length]);

  const assignment = useMemo(() => {
    if (!heights || heights.length !== items.length) {
      return items.map((_, i) => i % 2);
    }
    const order = items.map((_, i) => i).sort((a, b) => heights[b] - heights[a]);
    const colTotals = [0, 0];
    const assign = new Array(items.length);
    order.forEach((i) => {
      const col = colTotals[0] <= colTotals[1] ? 0 : 1;
      assign[i] = col;
      colTotals[col] += heights[i] || 0;
    });
    return assign;
  }, [heights, items.length]);

  const columns = [[], []];
  items.forEach((item, i) => columns[assignment[i]].push({ item, i }));

  return (
    <div style={{ display: "flex", gap, flexWrap: "wrap" }}>
      {columns.map((col, colIdx) => (
        <div key={colIdx} style={{ flex: `1 1 ${minWidth}px`, minWidth: Math.min(minWidth, 260), display: "flex", flexDirection: "column", gap }}>
          {col.map(({ item, i }) => (
            <div key={item.key} ref={(el) => { measureRefs.current[i] = el; }}>
              {item.node}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function InfoTable({ title, rows, note, accent }) {

const SCORING_CATEGORY_ORDER = ["Passing", "Rushing & receiving", "Kicking", "Defense & special teams", "Other"];

  "Passing": "#C1490A",
  "Rushing & receiving": "#0E4D33",
  "Kicking": "#B8860B",
  "Defense & special teams": "#5A371C",
  "Other": "#6B7A70",
};

function humanizeKey(key) {
  return key.split("_").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

const WAIVER_TYPE_LABELS = { 0: "Rolling waiver priority", 1: "FAAB", 2: "Reverse standings priority" };
const LEAGUE_TYPE_LABELS = { 0: "Redraft", 1: "Keeper", 2: "Dynasty" };
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function RulesTab({ league }) {
  const positions = league?.roster_positions || [];
  const starterCounts = {};
  let benchCount = 0;
  positions.forEach((p) => {
    if (p === "BN") { benchCount++; return; }
    starterCounts[p] = (starterCounts[p] || 0) + 1;
  });

  const scoring = league?.scoring_settings || {};
  const rec = scoring.rec;
  const scoringType = rec === 1 ? "Full PPR" : rec === 0.5 ? "Half PPR" : rec === 0 ? "Standard (no PPR)" : rec !== undefined ? `${rec} pt / reception` : "-";

  const scoringByCategory = useMemo(() => {
    const groups = {};
    Object.entries(scoring)
      .filter(([, v]) => v !== undefined && v !== null && v !== 0)
      .forEach(([key, v]) => {
        const cat = SCORING_CATEGORIES[key] || "Other";
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push([SCORING_LABELS[key] || humanizeKey(key), v]);
      });
    return SCORING_CATEGORY_ORDER
      .filter((cat) => groups[cat] && groups[cat].length > 0)
      .map((cat) => ({ category: cat, rows: groups[cat] }));
  }, [scoring]);

  const settings = league?.settings || {};
  const waiverLabel = settings.waiver_budget > 0
    ? `FAAB budget ($${settings.waiver_budget})`
    : (WAIVER_TYPE_LABELS[settings.waiver_type] || "Rolling waiver priority");
  const tradeDeadline = settings.trade_deadline
    ? `Week ${settings.trade_deadline}`
    : "No deadline set";

  const rosterRows = [
    ...Object.entries(starterCounts).map(([pos, count]) => [POSITION_LABELS[pos] || pos, count]),
    ["Bench", benchCount],
    ...(settings.taxi_slots ? [["Taxi squad", settings.taxi_slots]] : []),
    ...(settings.reserve_slots ? [["IR slots", settings.reserve_slots]] : []),
  ];

  const generalRows = [
    ["League type", LEAGUE_TYPE_LABELS[settings.type] ?? "Dynasty"],
    ["League size", settings.num_teams ?? "-"],
    ["Waivers", waiverLabel],
    ...(settings.waiver_day_of_week !== undefined ? [["Waiver clear day", WEEKDAYS[settings.waiver_day_of_week] ?? settings.waiver_day_of_week]] : []),
    ...(settings.waiver_clear_days ? [["Waiver clear days", settings.waiver_clear_days]] : []),
    ["Trade deadline", tradeDeadline],
    ...(settings.veto_votes_needed ? [["Trade veto votes needed", settings.veto_votes_needed]] : []),
    ...(settings.disable_adds !== undefined ? [["Free agent adds", settings.disable_adds ? "Disabled" : "Enabled"]] : []),
    ...(settings.best_ball ? [["Best ball", "Yes"]] : []),
    ...(settings.taxi_deadline ? [["Taxi deadline", `Week ${settings.taxi_deadline}`]] : []),
  ];

  const playoffRows = [
    ["Playoff teams", settings.playoff_teams ?? "-"],
    ["Playoffs start", settings.playoff_week_start ? `Week ${settings.playoff_week_start}` : "-"],
    ...(settings.playoff_round_type !== undefined ? [["Championship format", settings.playoff_round_type === 1 ? "2-week championship" : "1 week per round"]] : []),
    ...(settings.playoff_seed_type !== undefined ? [["Reseeding", settings.playoff_seed_type ? "Reseed each round" : "Bracket set at start"]] : []),
  ];

  return (
    <div>
      <BalancedGrid
        items={[
          {
            key: "dues",
            node: (
              <InfoTable
                title="Dues & payout"
                rows={[
                  ["Entry fee", `$${DUES.entryFee} / manager`],
                  ...DUES.payout.map((p) => [`${p.place} place`, `$${p.amount}`]),
                ]}
                note={`${DUES.note}. Adjust anytime the pot size changes.`}
              />
            ),
          },
          ...scoringByCategory.map(({ category, rows }) => ({
            key: category,
            node: <InfoTable title={`Scoring: ${category}`} rows={rows} accent={CATEGORY_ACCENTS[category]} />,
          })),
          { key: "roster", node: <InfoTable title="Roster composition" rows={rosterRows} accent={COLORS.turfLight} /> },
          { key: "general", node: <InfoTable title="General settings" rows={generalRows} /> },
          { key: "playoff", node: <InfoTable title="Playoff settings" rows={playoffRows} accent={COLORS.goldDeep} /> },
        ]}
      />

      <div style={{ marginTop: 16, fontSize: 11, color: COLORS.muted }}>
        League is set to {scoringType.toLowerCase()}. Every nonzero scoring rule from Sleeper is broken out above, plus
        everything else pulled live from your league settings. Change it in Sleeper and it'll update here automatically.
      </div>
    </div>
  );
}
