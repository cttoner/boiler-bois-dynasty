function buildRecapNarrative({ week, recap, ownerFor, playerLabel }) {
  const t = (rid) => teamName(ownerFor(rid));
  const paragraphs = [];

  // For a tied "best of the week" stat: single entry reads exactly as
  // before (player name, team name separately). Multiple tied entries
  // combine each player with their own team so the sentence stays correct
  // even when the tie spans different rosters.
  function describeTiedPlayers(entries) {
    const resolved = resolveTiedPlayers(entries, playerLabel, ownerFor);
    if (resolved.length === 1) return { P: resolved[0].player, T: resolved[0].team };
    const combined = resolved.map((r) => `${r.player} (${r.team})`);
    const teams = [...new Set(resolved.map((r) => r.team))];
    return { P: joinList(combined), T: joinList(teams) };
  }

  function describeTiedTeams(entries) {
    return joinList(resolveTiedTeams(entries, ownerFor));
  }

  function describeTiedPairs(entries) {
    const resolved = resolveTiedPairs(entries, ownerFor);
    const winners = [...new Set(resolved.map((r) => r.winner))];
    const losers = [...new Set(resolved.map((r) => r.loser))];
    return { W: joinList(winners), L: joinList(losers) };
  }

  // Paragraph 1: the lede plus the actual game results (blowout, closest,
  // upset), so it reads as one continuous rundown of the week's matchups
  // rather than a list of isolated facts.
  const gameSentences = [];
  gameSentences.push(pick(RECAP_PHRASES.lede, hashSeed(week, "lede"))({ week }));

  if (recap.blowout && recap.blowout.length > 0) {
    const { W, L } = describeTiedPairs(recap.blowout);
    const ctx = { W, L, M: fmt(recap.blowout[0].margin), week };
    gameSentences.push(pick(RECAP_PHRASES.blowout, hashSeed(week, "blowout", W, L, ctx.M))(ctx));
  }

  const blowoutWinners = recap.blowout ? new Set(recap.blowout.map((b) => b.winnerRid)) : new Set();
  const closestIsDifferent = recap.closest && recap.closest.some((c) => !blowoutWinners.has(c.winnerRid));
  if (recap.closest && recap.closest.length > 0 && closestIsDifferent) {
    const { W, L } = describeTiedPairs(recap.closest);
    const s = fmt(recap.closest[0].margin) === "1.0" ? "" : "s";
    const ctx = { W, L, M: fmt(recap.closest[0].margin), s };
    gameSentences.push(pick(RECAP_PHRASES.closest, hashSeed(week, "closest", W, L, ctx.M))(ctx));
  }

  if (recap.upset) {
    const recStr = (r) => `${r.w}-${r.l}${r.t ? `-${r.t}` : ""}`;
    const ctx = {
      W: t(recap.upset.winnerRid), WRec: recStr(recap.upset.winnerRec),
      L: t(recap.upset.loserRid), LRec: recStr(recap.upset.loserRec),
    };
    gameSentences.push(pick(RECAP_PHRASES.upset, hashSeed(week, "upset", ctx.W, ctx.L))(ctx));
  }
  paragraphs.push(gameSentences.join(" "));

  // Paragraph 2: individual performances (stud, dud, high/low), same idea.
  const performanceSentences = [];
  if (recap.stud && recap.stud.length > 0) {
    const { P, T } = describeTiedPlayers(recap.stud);
    const ctx = { P, T, S: fmt(recap.stud[0].points) };
    performanceSentences.push(pick(RECAP_PHRASES.stud, hashSeed(week, "stud", P, ctx.S))(ctx));
  }
  if (recap.dud && recap.dud.length > 0) {
    const { P, T } = describeTiedPlayers(recap.dud);
    const ctx = { P, T, S: fmt(recap.dud[0].points) };
    performanceSentences.push(pick(RECAP_PHRASES.dud, hashSeed(week, "dud", P, ctx.S))(ctx));
  }
  if (recap.highScore?.length > 0 && recap.lowScore?.length > 0) {
    const ctx = {
      HW: describeTiedTeams(recap.highScore), H: fmt(recap.highScore[0].points),
      LW: describeTiedTeams(recap.lowScore), L: fmt(recap.lowScore[0].points),
    };
    performanceSentences.push(pick(RECAP_PHRASES.highLow, hashSeed(week, "highLow", ctx.HW, ctx.LW))(ctx));
  }
  if (recap.positionBest) {
    const order = ["QB", "RB", "WR", "TE"];
    const posLabel = { QB: "quarterbacks", RB: "running backs", WR: "receivers", TE: "tight ends" };
    const segments = order
      .filter((pos) => recap.positionBest[pos]?.length > 0)
      .map((pos) => {
        const entries = recap.positionBest[pos];
        const names = entries.length === 1 ? playerLabel(entries[0].playerId) : joinList(entries.map((e) => playerLabel(e.playerId)));
        return `${names} paced all ${posLabel[pos]} with ${fmt(entries[0].points)} points`;
      });
    if (segments.length > 0) {
      const PB = segments.length === 1
        ? segments[0]
        : `${segments.slice(0, -1).join(", ")}, and ${segments[segments.length - 1]}`;
      performanceSentences.push(pick(RECAP_PHRASES.positionBattle, hashSeed(week, "positionBattle", PB))({ PB }));
    }
  }
  if (performanceSentences.length > 0) paragraphs.push(performanceSentences.join(" "));

  // Paragraph 3: the deeper-cut stuff (streaks, one rotating flavor stat,
  // the zero club), also joined into flowing prose.
  const flavorSentences = [];
  if (recap.longestStreak) {
    const ctx = { T: t(recap.longestStreak.rosterId), N: recap.longestStreak.count };
    const bank = recap.longestStreak.type === "W" ? RECAP_PHRASES.streakWin : RECAP_PHRASES.streakLoss;
    flavorSentences.push(pick(bank, hashSeed(week, "streak", ctx.T, ctx.N))(ctx));
  }

  // One extra flavor stat, chosen per week so the recap doesn't run long
  // every single time but still surfaces the deeper cuts eventually.
  const flavorCandidates = [];
  if (recap.benchTragedy?.length > 0 && recap.benchTragedy[0].points > 0) flavorCandidates.push("benchTragedy");
  if (recap.benchStud?.length > 0 && recap.benchStud[0].points > 0) flavorCandidates.push("benchStud");
  if (recap.oneManShow?.length > 0 && recap.oneManShow[0].share > 0) flavorCandidates.push("oneManShow");
  if (recap.weeklyLuck && (recap.weeklyLuck.luckyWin || recap.weeklyLuck.unluckyLoss)) flavorCandidates.push("weeklyLuck");
  if (recap.deadEven?.length > 0) flavorCandidates.push("deadEven");
  if (flavorCandidates.length > 0) {
    const chosen = pick(flavorCandidates, hashSeed(week, "flavorPick"));
    if (chosen === "benchTragedy") {
      const BT = describeTiedTeams(recap.benchTragedy);
      const ctx = { BT, BP: fmt(recap.benchTragedy[0].points) };
      flavorSentences.push(pick(RECAP_PHRASES.benchTragedy, hashSeed(week, "benchTragedy", BT))(ctx));
    } else if (chosen === "benchStud") {
      const { P, T } = describeTiedPlayers(recap.benchStud);
      const ctx = { BT2: T, BP2: P, BS: fmt(recap.benchStud[0].points) };
      flavorSentences.push(pick(RECAP_PHRASES.benchStud, hashSeed(week, "benchStud", P))(ctx));
    } else if (chosen === "oneManShow") {
      const { P, T } = describeTiedPlayers(recap.oneManShow);
      const ctx = { OT: T, OP: P, OShare: Math.round(recap.oneManShow[0].share * 100) };
      flavorSentences.push(pick(RECAP_PHRASES.oneManShow, hashSeed(week, "oneManShow", P))(ctx));
    } else if (chosen === "weeklyLuck") {
      if (recap.weeklyLuck.luckyWin) {
        const ctx = { LW: t(recap.weeklyLuck.luckyWin.rosterId), pct: Math.round(recap.weeklyLuck.luckyWin.share * 100) };
        flavorSentences.push(pick(RECAP_PHRASES.luckyWin, hashSeed(week, "luckyWin", ctx.LW))(ctx));
      }
      if (recap.weeklyLuck.unluckyLoss) {
        const ctx = { UL: t(recap.weeklyLuck.unluckyLoss.rosterId), pct: Math.round(recap.weeklyLuck.unluckyLoss.share * 100) };
        flavorSentences.push(pick(RECAP_PHRASES.unluckyLoss, hashSeed(week, "unluckyLoss", ctx.UL))(ctx));
      }
    } else if (chosen === "deadEven") {
      const T = describeTiedTeams(recap.deadEven);
      const ctx = { T, pts: fmt(recap.deadEven[0].points), avg: fmt(recap.deadEven[0].avg) };
      flavorSentences.push(pick(RECAP_PHRASES.deadEven, hashSeed(week, "deadEven", T))(ctx));
    }
  }

  if (recap.zeroClub && recap.zeroClub.length > 0) {
    const names = recap.zeroClub.map((z) => playerLabel(z.playerId)).join(", ");
    const ctx = { N: recap.zeroClub.length, names };
    flavorSentences.push(pick(RECAP_PHRASES.zeroClub, hashSeed(week, "zeroClub", ctx.N))(ctx));
  }

  if (flavorSentences.length > 0) paragraphs.push(flavorSentences.join(" "));

  // Paragraph 4: short, punchy sign-off, kept on its own.
  const ctx = { week, next: week + 1 };
  paragraphs.push(pick(RECAP_PHRASES.closer, hashSeed(week, "closer"))(ctx));

  return paragraphs;
}

function RecapStatCard({ label, value, sub, accent, hint }) {
  return (
    <Card style={{ borderLeft: `3px solid ${accent}` }}>
      <div style={{ fontSize: 10, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>
        {label}
      </div>
      <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 18, color: COLORS.turf, marginBottom: 2 }}>
        {value}
      </div>
      <div style={{ fontSize: 12, color: COLORS.bone, fontWeight: 600 }}>{sub}</div>
      {hint && (
        <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 4, fontStyle: "italic" }}>{hint}</div>
      )}
    </Card>
  );
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Truncates text with an ellipsis if it won't fit in maxWidth, rather than
// wrapping - keeps every row a fixed, predictable height so the whole image
// can be sized precisely up front instead of leaving dead space.
function fitText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(`${t}…`).width > maxWidth) {
    t = t.slice(0, -1);
  }
  return `${t}…`;
}

// Draws a shareable PNG summarizing one week's recap as a grid of stat
// cards (stud, dud, blowout, closest game, high/low score, shoulda
// started), sized for dropping straight into a group chat alongside the
// pasted-in narrative text. Height is computed from the actual card count
// up front so there's no leftover empty space at the bottom. Uses only
// system-safe fonts (no custom @font-face) so there's no font-loading race
// before the canvas draws.
function buildRecapImageDataUrl({ leagueName, season, week, recap, ownerFor, playerLabel }) {
  // Portrait proportions so this reads naturally as a phone-shared image
  // rather than a wide landscape graphic.
  const W = 800;
  const pad = 40;
  const headerH = 170;

  // Each returns one line per tied entry, so a real tie (multiple duds at
  // the exact same score, say) stacks every name in the card instead of
  // squeezing them onto a single truncated line.
  function playersLines(entries) {
    return resolveTiedPlayers(entries, playerLabel, ownerFor).map((r) => `${r.player} — ${r.team}`);
  }
  function teamsLines(entries) {
    return resolveTiedTeams(entries, ownerFor);
  }
  function pairsLines(entries) {
    return resolveTiedPairs(entries, ownerFor).map((r) => `${r.winner} over ${r.loser}`);
  }

  const cards = [];
  if (recap.stud?.length > 0) cards.push({ label: "STUD OF THE WEEK", value: `${fmt(recap.stud[0].points)} PTS`, lines: playersLines(recap.stud), accent: "#FF6B00" });
  if (recap.dud?.length > 0) cards.push({ label: "DUD OF THE WEEK", value: `${fmt(recap.dud[0].points)} PTS`, lines: playersLines(recap.dud), accent: "#C0392B" });
  if (recap.blowout?.length > 0) cards.push({ label: "BIGGEST BLOWOUT", value: `${fmt(recap.blowout[0].margin)} PT MARGIN`, lines: pairsLines(recap.blowout), accent: "#7B4B27" });
  if (recap.closest?.length > 0) cards.push({ label: "CLOSEST GAME", value: `${fmt(recap.closest[0].margin)} PT MARGIN`, lines: pairsLines(recap.closest), accent: "#3F7A63" });
  if (recap.highScore?.length > 0) cards.push({ label: "HIGH SCORE", value: `${fmt(recap.highScore[0].points)} PTS`, lines: teamsLines(recap.highScore), accent: "#FFD400" });
  if (recap.lowScore?.length > 0) cards.push({ label: "LOW SCORE", value: `${fmt(recap.lowScore[0].points)} PTS`, lines: teamsLines(recap.lowScore), accent: "#6B7A70" });
  if (recap.benchStud?.length > 0 && recap.benchStud[0].points > 0) cards.push({ label: "SHOULDA STARTED", value: `${fmt(recap.benchStud[0].points)} PTS`, lines: playersLines(recap.benchStud), accent: "#B8860B" });

  const gap = 16;
  const colW = (W - pad * 2 - gap) / 2;
  const lineH = 20;
  const firstLineY = 84;
  const cardPadBottom = 22;
  const cardMinH = 116;
  const cardHeight = (n) => Math.max(cardMinH, firstLineY + (n - 1) * lineH + cardPadBottom);

  const rowsData = [];
  for (let i = 0; i < cards.length; i += 2) {
    const left = cards[i];
    const right = cards[i + 1] || null;
    const h = Math.max(cardHeight(left.lines.length), right ? cardHeight(right.lines.length) : 0);
    rowsData.push({ left, right, h });
  }
  const gridH = rowsData.reduce((sum, r) => sum + r.h, 0) + Math.max(0, rowsData.length - 1) * gap;
  const footerH = 46;
  const H = headerH + 32 + gridH + footerH + pad;

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#F4FAF6";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#0E4D33";
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = "#FFD400";
  ctx.font = "700 22px Georgia, serif";
  ctx.fillText(fitText(ctx, (leagueName || "Fantasy League").toUpperCase(), W - pad * 2), pad, 54);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "800 48px Georgia, serif";
  ctx.fillText(fitText(ctx, `WEEK ${week} RECAP`, W - pad * 2), pad, 112);
  if (season) {
    ctx.fillStyle = "rgba(255,255,255,0.72)";
    ctx.font = "600 19px Georgia, serif";
    ctx.fillText(`${season} SEASON`, pad, 144);
  }

  let rowY = headerH + 32;

  rowsData.forEach((row, ri) => {
    [row.left, row.right].forEach((c, colIdx) => {
      if (!c) return;
      const x = pad + colIdx * (colW + gap);
      const y = rowY;

      ctx.fillStyle = "#FFFFFF";
      drawRoundedRect(ctx, x, y, colW, row.h, 14);
      ctx.fill();
      ctx.fillStyle = c.accent;
      ctx.fillRect(x, y, 5, row.h);

      ctx.fillStyle = "#6B7A70";
      ctx.font = "700 13px Georgia, serif";
      ctx.fillText(fitText(ctx, c.label, colW - 32), x + 20, y + 28);

      ctx.fillStyle = "#0E4D33";
      ctx.font = "800 26px Georgia, serif";
      ctx.fillText(fitText(ctx, c.value, colW - 32), x + 20, y + 64);

      ctx.fillStyle = "#12241C";
      ctx.font = "600 15px Georgia, serif";
      c.lines.forEach((line, li) => {
        ctx.fillText(fitText(ctx, line, colW - 32), x + 20, y + firstLineY + li * lineH);
      });
    });
    rowY += row.h + (ri < rowsData.length - 1 ? gap : 0);
  });

  let cursorY = rowY + 26;

  ctx.strokeStyle = "rgba(14,77,51,0.2)";
  ctx.beginPath();
  ctx.moveTo(pad, cursorY);
  ctx.lineTo(W - pad, cursorY);
  ctx.stroke();
  ctx.fillStyle = "#6B7A70";
  ctx.font = "600 15px Georgia, serif";
  ctx.fillText("Generated from live league data", pad, cursorY + 28);

  return canvas.toDataURL("image/png");
}


function RecapTab({ data, rostersById, usersById }) {
  const { weekMatchups, players } = data;

  // Only completed weeks - weekMatchups already excludes the in-progress
  // current week, so there's nothing else to filter here.
  const availableWeeks = useMemo(() => {
    return Object.keys(weekMatchups || {}).map(Number).sort((a, b) => a - b);
  }, [weekMatchups]);

  const [selectedWeek, setSelectedWeek] = useState(null);

  useEffect(() => {
    if (availableWeeks.length === 0) return;
    if (selectedWeek === null || !availableWeeks.includes(selectedWeek)) {
      setSelectedWeek(availableWeeks[availableWeeks.length - 1]);
    }
  }, [availableWeeks]);

  const weekMatchupList = weekMatchups?.[selectedWeek] || [];

  const ownerFor = (rid) => usersById[rostersById[rid]?.owner_id];

  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position})` : name;
  }

  // Sub-line builders for stat cards: single tied entry reads exactly as
  // before, multiple tied entries join into a readable list instead of
  // silently dropping every tie but the first one found.
  function playersSub(entries) {
    return joinList(resolveTiedPlayers(entries, playerLabel, ownerFor).map((r) => `${r.player} — ${r.team}`));
  }
  function teamsSub(entries) {
    return joinList(resolveTiedTeams(entries, ownerFor));
  }
  function pairsSub(entries) {
    const resolved = resolveTiedPairs(entries, ownerFor);
    const winners = joinList([...new Set(resolved.map((r) => r.winner))]);
    const losers = joinList([...new Set(resolved.map((r) => r.loser))]);
    return `${winners} over ${losers}`;
  }

  const recap = useMemo(() => {
    const base = computeWeekRecap(weekMatchupList, players);
    if (!base || selectedWeek === null) return base;
    const recordsBefore = computeRecordsThroughWeek(weekMatchups, selectedWeek);
    const streaksThrough = computeStreaksThroughWeek(weekMatchups, selectedWeek);
    return {
      ...base,
      upset: computeUpset(base.pairs, recordsBefore),
      longestStreak: pickLongestStreak(streaksThrough),
      weeklyLuck: computeWeeklyLuck(weekMatchupList, base.pairs),
    };
  }, [weekMatchupList, weekMatchups, selectedWeek, players]);

  if (availableWeeks.length === 0) {
    return (
      <div>
        <SectionLabel>Recap</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>
            No completed weeks yet. Recaps show up once a week's games are final, check back after Week 1 wraps.
          </div>
        </Card>
      </div>
    );
  }

  if (!recap || selectedWeek === null) {
    return (
      <div>
        <SectionLabel>Recap</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>
            No matchup data posted for this week yet.
          </div>
        </Card>
      </div>
    );
  }

  const narrative = buildRecapNarrative({ week: selectedWeek, recap, ownerFor, playerLabel });

  function downloadRecapImage() {
    const url = buildRecapImageDataUrl({
      leagueName: data.league?.name,
      season: data.league?.season,
      week: selectedWeek,
      recap,
      ownerFor,
      playerLabel,
    });
    const a = document.createElement("a");
    a.href = url;
    a.download = `week-${selectedWeek}-recap.png`;
    a.click();
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 6 }}>
        <SectionLabel>Week {selectedWeek} Recap</SectionLabel>
        <button
          onClick={downloadRecapImage}
          style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 11,
            padding: "6px 12px",
            borderRadius: 6,
            border: `1px solid ${COLORS.hairline}`,
            background: COLORS.surface,
            color: COLORS.turf,
            cursor: "pointer",
            fontWeight: 600,
          }}
        >
          ⬇ Share image
        </button>
      </div>

      {availableWeeks.length > 1 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
          {availableWeeks.map((w) => (
            <button
              key={w}
              onClick={() => setSelectedWeek(w)}
              style={{
                padding: "5px 12px",
                borderRadius: 999,
                border: `1px solid ${w === selectedWeek ? COLORS.turf : COLORS.hairline}`,
                background: w === selectedWeek ? COLORS.turf : COLORS.surface,
                color: w === selectedWeek ? COLORS.onTurf : COLORS.muted,
                fontSize: 12,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              Wk {w}
            </button>
          ))}
        </div>
      )}

      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 11, color: COLORS.turfLight, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>
          The Recap
        </div>
        {narrative.map((p, i) => (
          <div
            key={i}
            style={{
              color: COLORS.bone,
              fontSize: 14,
              lineHeight: 1.6,
              marginTop: i === 0 ? 0 : 10,
              fontWeight: i === 0 ? 600 : 400,
            }}
          >
            {p}
          </div>
        ))}
      </Card>

      <SectionLabel>Superlatives</SectionLabel>
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
          gap: 10,
          marginBottom: 20,
        }}
      >
        {recap.stud?.length > 0 && (
          <RecapStatCard
            label="Stud of the Week"
            value={`${fmt(recap.stud[0].points)} pts`}
            sub={playersSub(recap.stud)}
            accent={COLORS.gold}
          />
        )}
        {recap.dud?.length > 0 && (
          <RecapStatCard

        {recap.blowout?.length > 0 && (

        {recap.highScore?.length > 0 && (

        {recap.lowScore?.length > 0 && (

        {recap.benchTragedy?.length > 0 && recap.benchTragedy[0].points > 0 && (
          <RecapStatCard

        )}
        {recap.deadEven?.length > 0 && (
          <RecapStatCard
            label="Dead Even"

          const teamA = ownerFor(a?.roster_id);
          const teamB = b ? ownerFor(b?.roster_id) : null;
          const scoreA = a?.points ?? 0;
          const scoreB = b?.points ?? 0;
          const aLeads = scoreA >= scoreB;
          return {
            key: i,
            node: (
              <Card>
                <MatchupRow name={teamName(teamA)} label={withOwner(teamA)} logo={avatarUrl(teamA)} score={scoreA} leading={aLeads && !!b} />

                <MatchupRow
                  name={b ? teamName(teamB) : "BYE"}

                  logo={b ? avatarUrl(teamB) : null}
                  score={scoreB}
                  leading={!aLeads && !!b}
                />
              </Card>
            ),
          };
        })}
      />
    </div>
  );
}


function PowerTab({ power, data }) {
  const maxPower = Math.max(...power.map((p) => p.power), 1);

  // Movement since last week: power as it stood right before the most
  // recently completed week, compared to now. Needs at least two completed
  // weeks on record, otherwise there's nothing to compare against.
  const movement = useMemo(() => {
    const lastCompletedWeek = (data.week || 1) - 1;
    const priorThroughWeek = lastCompletedWeek - 1;
    if (priorThroughWeek < 1) return {};
    const priorStandings = computeStandingsThroughWeek(data.weekMatchups, priorThroughWeek, data.rosters, data.users);
    const priorPower = computePowerRankings(priorStandings);
    const priorRank = {};
    priorPower.forEach((p, i) => { priorRank[p.rosterId] = i + 1; });
    const result = {};
    power.forEach((p, i) => {
      const prev = priorRank[p.rosterId];
      if (prev !== undefined) result[p.rosterId] = prev - (i + 1);
    });
    return result;
  }, [power, data.week, data.weekMatchups, data.rosters, data.users]);

  // How volatile each team's weekly score is, relative to the rest of the
  // league. A team can average the same points as another and still play a
  // totally different kind of season depending on how spread out those
  // weeks were. Needs at least 3 completed weeks to mean anything.
  const consistency = useMemo(() => {
    const scoresByRoster = {};
    (data.rosters || []).forEach((r) => { scoresByRoster[r.roster_id] = []; });
    Object.values(data.weekMatchups || {}).forEach((matchups) => {
      (matchups || []).forEach((m) => {
        if (!scoresByRoster[m.roster_id]) scoresByRoster[m.roster_id] = [];
        scoresByRoster[m.roster_id].push(m.points ?? 0);
      });
    });
    const cvByRoster = {};
    Object.entries(scoresByRoster).forEach(([rid, scores]) => {
      if (scores.length < 3) return;
      const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
      const variance = scores.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / scores.length;
      const stdDev = Math.sqrt(variance);
      cvByRoster[rid] = { stdDev, cv: mean > 0 ? stdDev / mean : 0 };
    });
    const cvs = Object.values(cvByRoster).map((c) => c.cv).sort((a, b) => a - b);
    if (cvs.length === 0) return {};
    const median = cvs[Math.floor(cvs.length / 2)];
    const result = {};
    Object.entries(cvByRoster).forEach(([rid, c]) => {
      result[rid] = { stdDev: c.stdDev, label: c.cv <= median ? "Steady" : "Boom-Bust" };
    });
    return result;
  }, [data.rosters, data.weekMatchups]);

  return (
    <div>
      <SectionLabel>Power Rankings</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Not the standings. Your record can lie, this can't. This is who's actually playing good football right now.
      </div>
      <Card style={{ padding: "7px 12px" }}>
        {power.map((p, i) => {
          const tierColor = i === 0 ? COLORS.yellow : i === 1 ? COLORS.turfLight : i === 2 ? COLORS.leather : COLORS.surfaceLight;
          const barColor = i === 0 ? COLORS.gold : i === 1 ? COLORS.turf : i === 2 ? COLORS.leatherDeep : COLORS.muted;
          const delta = movement[p.rosterId];
          const consist = consistency[p.rosterId];
          return (
          <div
            key={p.rosterId}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 14,
              padding: "12px 4px",
              borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}`,
            }}
          >
            <div
              style={{
                fontFamily: "'Archivo Black', sans-serif",
                fontSize: i < 3 ? 15 : 20,
                color: i < 3 ? "#FFFFFF" : COLORS.muted,
                width: 28,
                height: i < 3 ? 28 : "auto",
                borderRadius: i < 3 ? "50%" : 0,
                background: i < 3 ? tierColor : "transparent",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              {i + 1}
            </div>
            <Crest name={p.name} logo={p.avatar} size={34} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 600 }}>{p.displayName}</span>
                {consist && (
                  <span
                    style={{
                      fontFamily: "'IBM Plex Mono', monospace",
                      fontSize: 10,
                      padding: "2px 7px",
                      borderRadius: 999,
                      border: `1px solid ${consist.label === "Steady" ? COLORS.turf : COLORS.goldDeep}`,
                      color: consist.label === "Steady" ? COLORS.turf : COLORS.goldDeep,
                    }}
                    title={`Week-to-week std. dev.: ${fmt(consist.stdDev)} pts`}
                  >
                    {consist.label}
                  </span>
                )}
              </div>
              <div style={{ position: "relative", height: 6, background: COLORS.surfaceLight, borderRadius: 3, marginTop: 6 }}>
                <div
                  style={{
                    position: "absolute",
                    left: 0,
                    top: 0,
                    bottom: 0,
                    width: `${(p.power / maxPower) * 100}%`,
                    background: barColor,
                    borderRadius: 3,
                  }}
                />
              </div>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  flexWrap: "wrap",
                  marginTop: 6,
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 11,
                  color: COLORS.muted,
                }}
              >
                <span>{fmt(p.wins, 0)}-{fmt(p.losses, 0)} · {fmt(p.fpts)} PF</span>
                {delta !== undefined && (
                  <span
                    style={{
                      fontWeight: 700,
                      color: delta > 0 ? COLORS.turf : delta < 0 ? COLORS.leatherDeep : COLORS.muted,
                    }}
                  >
                    {delta > 0 ? `▲${delta}` : delta < 0 ? `▼${Math.abs(delta)}` : "–"}
                  </span>
                )}
              </div>
            </div>
          </div>
          );
        })}
      </Card>
      <div style={{ marginTop: 10, fontSize: 12, color: COLORS.muted }}>
        Power score blends win percentage (70%) with points scored (30%). Movement (▲▼) compares to where each team
        stood before last week's games. Steady/Boom-Bust compares how much a team's weekly score swings around its
        own average, relative to the rest of the league (needs 3+ completed weeks to show up). Swap in your own
        weekly commentary once you're ready to add trash talk.
      </div>
    </div>
  );
}

function RostersTab({ rosters, usersById, players, selectedRosterId, setSelectedRosterId, data, standings, superlatives }) {
  const roster = rosters.find((r) => r.roster_id === selectedRosterId) || rosters[0];
  const owner = usersById[roster?.owner_id];
  const ownerId = roster?.owner_id;

  const trophyCase = useMemo(() => {
    if (!ownerId) return null;
    const seasons = data.seasonHistory || [];
    const podium = { first: [], second: [], third: [] };
    seasons.forEach((s) => {
      if (s.champion?.user_id === ownerId) podium.first.push(s.season);
      if (s.runnerUp?.user_id === ownerId) podium.second.push(s.season);
      if (s.third?.user_id === ownerId) podium.third.push(s.season);
    });
    const shameYears = (superlatives.wallOfShame || [])
      .filter((s) => s.lastPlace?.user_id === ownerId)
      .map((s) => s.season);

    const at = superlatives.allTimeSuperlatives || {};
    const records = [];
    if (superlatives.mostTitles?.user?.user_id === ownerId) records.push("Most titles");
    if (at.mostPlayoffWins?.ownerId === ownerId) records.push("Most playoff wins");
    if (at.bestWinPct?.ownerId === ownerId) records.push("Best win %");
    if (at.bestPPG?.ownerId === ownerId) records.push("Highest career PPG");
    if (at.bestSeason?.ownerId === ownerId) records.push("Best regular season");
    if (at.highestScoringSeason?.ownerId === ownerId) records.push("Highest scoring season");
    if (at.singleGame?.owner?.user_id === ownerId) records.push("Highest scoring week");
    if (at.bestPlayerRecord?.owner?.user_id === ownerId) records.push("Single-game record");

    return { podium, shameYears, records };
  }, [ownerId, data.seasonHistory, superlatives]);

  // Actual vs. best-possible lineup, week by week, for the selected roster.
  // Reconstructed straight from each week's matchup data (which carries the
  // full roster and per-player points for that week), not from the current
  // roster snapshot, so it's accurate even for weeks where the roster has
  // since changed.
  const lineupIQ = useMemo(() => {
    if (!roster) return null;
    const rosterPositions = data.league?.roster_positions || [];
    const weeks = Object.keys(data.weekMatchups || {}).map(Number).sort((a, b) => a - b);
    const byWeek = [];
    let totalActual = 0;
    let totalOptimal = 0;
    weeks.forEach((week) => {
      const matchups = data.weekMatchups[week] || [];
      const m = matchups.find((mm) => mm.roster_id === roster.roster_id);
      if (!m) return;
      const actual = m.points ?? 0;
      const optimal = computeOptimalLineupPoints(m.players || [], m.players_points || {}, rosterPositions, players);
      totalActual += actual;
      totalOptimal += optimal;
      byWeek.push({ week, actual, optimal, left: Math.max(0, optimal - actual) });
    });
    return { byWeek, totalActual, totalOptimal, totalLeft: Math.max(0, totalOptimal - totalActual) };
  }, [roster, data.weekMatchups, data.league, players]);

  function playerInfo(pid) {
    const p = players[pid];
    if (!p) return { name: pid, position: null, team: null, age: null, injuryStatus: null };
    return {
      name: `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid,
      position: p.position || null,
      team: p.team || null,
      age: playerAge(p),
      injuryStatus: p.injury_status || null,
    };
  }
  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    return `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
  }

  const currentOwnerBreakdown = useMemo(
    () => computeOwnerBreakdownFromWeeks(data.weekMatchups, rosters),
    [data.weekMatchups, rosters]
  );

  const teamSuperlatives = useMemo(() => {
    if (!ownerId) return null;
    let bestGame = null;
    let bestWeek = null;
    let bestSeasonRecord = null;
    let bestSeasonPoints = null;
    const cumulativeTotals = {};

    const seasonsToCheck = [
      ...(data.seasonHistory || []).map((s) => ({
        season: s.season,
        weeklyHigh: s.ownerWeeklyHigh?.[ownerId],
        bestPlayerGame: s.ownerBestPlayerGame?.[ownerId],
        playerTotals: s.ownerPlayerTotals?.[ownerId] || {},
        standingsEntry: (s.standings || []).find((st) => st.ownerId === ownerId),
      })),
      {
        season: data.league?.season,
        weeklyHigh: currentOwnerBreakdown.weeklyHigh[ownerId],
        bestPlayerGame: currentOwnerBreakdown.bestPlayerGame[ownerId],
        playerTotals: currentOwnerBreakdown.playerTotals[ownerId] || {},
        standingsEntry: standings.find((st) => st.ownerId === ownerId),
      },
    ];

    seasonsToCheck.forEach((s) => {
      if (s.weeklyHigh && (!bestWeek || s.weeklyHigh.points > bestWeek.points)) {
        bestWeek = { ...s.weeklyHigh, season: s.season };
      }
      if (s.bestPlayerGame && (!bestGame || s.bestPlayerGame.points > bestGame.points)) {
        bestGame = { ...s.bestPlayerGame, season: s.season };
      }
      if (s.standingsEntry) {
        const games = s.standingsEntry.wins + s.standingsEntry.losses + s.standingsEntry.ties;
        const pct = games ? (s.standingsEntry.wins + s.standingsEntry.ties * 0.5) / games : 0;
        if (!bestSeasonRecord || pct > bestSeasonRecord.pct) {
          bestSeasonRecord = { wins: s.standingsEntry.wins, losses: s.standingsEntry.losses, ties: s.standingsEntry.ties, season: s.season, pct };
        }
        if (!bestSeasonPoints || s.standingsEntry.fpts > bestSeasonPoints.fpts) {
          bestSeasonPoints = { fpts: s.standingsEntry.fpts, season: s.season };
        }
      }
      Object.entries(s.playerTotals).forEach(([pid, pts]) => {
        cumulativeTotals[pid] = (cumulativeTotals[pid] || 0) + pts;
      });
    });

    return { bestGame, bestWeek, bestSeasonRecord, bestSeasonPoints, cumulativeTotals };
  }, [ownerId, data.seasonHistory, currentOwnerBreakdown, standings, data.league]);

  const topByPosition = useMemo(() => {
    if (!teamSuperlatives) return [];
    const currentRosterSet = new Set(roster?.players || []);
    const buckets = {};
    Object.entries(teamSuperlatives.cumulativeTotals).forEach(([pid, pts]) => {
      const pos = players[pid]?.position;
      if (!pos) return;
      if (!buckets[pos] || pts > buckets[pos].points) {
        buckets[pos] = { playerId: pid, points: pts, stillOnRoster: currentRosterSet.has(pid) };
      }
    });
    const order = ["QB", "RB", "WR", "TE", "K", "DEF"];
    return Object.entries(buckets)
      .sort(([a], [b]) => {
        const ai = order.indexOf(a), bi = order.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      })
      .map(([pos, v]) => ({ pos, ...v }));
  }, [teamSuperlatives, roster, players]);

  return (
    <div>
      <SectionLabel>Rosters</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Every player, every team. This is the actual roster of assets you're betting your season, and your ego, on.
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        {rosters.map((r) => {
          const u = usersById[r.owner_id];
          const active = r.roster_id === (roster?.roster_id);
          return (
            <button
              key={r.roster_id}

              <StatRow

              />
            </div>
            <div style={{ flex: "1 1 320px", minWidth: 280, display: "flex", flexDirection: "column", gap: 10 }}>
              <StatRow
                label="Highest scoring season"

                accent={COLORS.leatherDeep}

              <StatRow
                label="Best regular season record"

            </div>
          </div>

          {topByPosition.length > 0 && (
            <>
              <SectionLabel>Position leaders (all time)</SectionLabel>
              <div style={{ fontSize: 11, color: COLORS.muted, marginBottom: 10 }}>
                Most points ever scored specifically while on this team, at each position. Includes players who

              </div>
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <tbody>
                    {topByPosition.map((row, i) => {
                      const pc = positionColor(row.pos);
                      return (
                        <tr key={row.pos} style={{ borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}>
                          <td style={{ padding: "7px 12px", width: 60 }}>
                            <span
                              style={{
                                fontFamily: "'IBM Plex Mono', monospace",
                                fontSize: 10,
                                fontWeight: 600,
                                padding: "2px 6px",
                                borderRadius: 4,
                                background: pc.bg,
                                color: pc.fg,
                              }}
                            >
                              {row.pos}
                            </span>
                          </td>
                          <td style={{ padding: "7px 12px", fontSize: 13 }}>
                            {playerLabel(row.playerId)}
                            {!row.stillOnRoster && (
                              <span style={{ fontSize: 11, color: COLORS.muted, marginLeft: 6 }}>(no longer on roster)</span>
                            )}
                          </td>
                          <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.gold, fontWeight: 600 }}>
                            {fmt(row.points)} pts
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </Card>
            </>
          )}
        </>
      )}
    </div>
  );
}

function TradesTab({ transactions, rostersById, usersById, players, seasonHistory, currentSeason, weekMatchups, seasonType, currentDraftPicks }) {
  const [page, setPage] = useState(0);
  const [filterOwnerId, setFilterOwnerId] = useState("all");
  const [viewMode, setViewMode] = useState("trades");
  const [traderSeasonFilter, setTraderSeasonFilter] = useState("all");
  const PAGE_SIZE = 8;
  const isActiveSeason = seasonType === "regular" || seasonType === "post";

  const availableSeasons = useMemo(() => {
    const set = new Set([currentSeason, ...(seasonHistory || []).map((s) => s.season)]);
    return Array.from(set).filter(Boolean).sort((a, b) => Number(b) - Number(a));
  }, [currentSeason, seasonHistory]);

  function playerLabel(pid) {
    const p = players[pid];
    if (!p) return pid;
    return `${p.first_name || ""} ${p.last_name || ""}`.trim();
  }

  function formatDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // This season's per-owner player totals, computed the same way the
  // historical season walk already does, so a trade's aging stat can keep
  // accumulating into whatever season is currently live.
  const currentOwnerBreakdown = useMemo(
    () => computeOwnerBreakdownFromWeeks(weekMatchups, Object.values(rostersById)),
    [weekMatchups, rostersById]
  );

  // Points a traded player has scored specifically while on the receiving
  // team, starting the moment the trade happened and continuing through
  // every season since, for as long as they've actually stayed on that
  // roster. The moment they leave (traded again or dropped), a season's
  // per-owner total for them stops accruing on its own, since it's built
  // from real matchup ownership, not an assumption they stayed put.
  function computePointsSinceTrade(t, pid, ownerId) {
    const tradeSeasonNum = Number(t.season);
    let total = 0;

    const tradeSeasonMatchups = weekMatchupsBySeason[t.season];
    if (tradeSeasonMatchups) {
      total += computePointsSinceWeek(pid, t.leg || 1, tradeSeasonMatchups);
    }

    (seasonHistory || []).forEach((s) => {
      if (Number(s.season) > tradeSeasonNum) {
        total += s.ownerPlayerTotals?.[ownerId]?.[pid] || 0;
      }
    });

    if (Number(currentSeason) > tradeSeasonNum) {
      total += currentOwnerBreakdown.playerTotals?.[ownerId]?.[pid] || 0;
    }

    return total;
  }

  // Sub-classify a round-0 (before Week 1) trade as preseason (roughly
  // August) versus deep offseason (everything else), just for a nicer
  // label. The round-0 vs real-week distinction itself is reliable; this
  // is only cosmetic on top of that.
  // Determine a trade's real phase from its actual date compared to its own
  // season's calendar year, rather than trusting any Sleeper field for this.
  // A trade under season "2026" dated Jan or Apr 2026 is mathematically
  // before that season's September kickoff, full stop, regardless of what
  // leg/round Sleeper attached to it.
  function tradePhaseLabel(t) {
    const seasonYear = Number(t.season);
    if (t.created && !isNaN(seasonYear)) {
      const d = new Date(t.created);
      const year = d.getFullYear();
      const month = d.getMonth(); // 0 = Jan
      if (year === seasonYear && month <= 7) {
        return month === 7 ? "PRESEASON" : "OFFSEASON";
      }
    }
    const wk = t._round || t.leg;
    return wk ? `WEEK ${wk}` : "WEEK ?";
  }

  // Every season's own weekly matchup data, keyed by season, so the aging
  // stat can find the right source regardless of which season a trade
  // happened in.
  const weekMatchupsBySeason = useMemo(() => {
    const map = { [currentSeason]: weekMatchups };
    (seasonHistory || []).forEach((s) => {
      map[s.season] = s.weekMatchups || {};
    });
    return map;
  }, [currentSeason, weekMatchups, seasonHistory]);

  // Resolves a traded draft pick to the player actually taken with it, once
  // that draft has happened. Keyed by the same (season, round, original
  // roster) a trade's draft_picks entry describes - originalRosterId comes
  // from each draft's fixed slot_to_roster_id assignment, not from whoever
  // ends up owning the pick after trades.
  const pickResolution = useMemo(() => {
    const map = {};
    const indexPicks = (season, picks) => {
      (picks || []).forEach((p) => {
        if (p.originalRosterId === null || p.originalRosterId === undefined || !p.playerId) return;
        map[`${season}-${p.round}-${p.originalRosterId}`] = { playerId: p.playerId, owner: p.owner };
      });
    };
    indexPicks(currentSeason, currentDraftPicks);
    (seasonHistory || []).forEach((s) => indexPicks(s.season, s.draftPicks));
    return map;
  }, [currentSeason, currentDraftPicks, seasonHistory]);

  // Merge this season's trades (resolved against live current-season rosters)
  // with every historical season's trades (already resolved against that
  // season's own rosters, to avoid attributing an old trade to the wrong
  // manager via reused roster ID numbers).
  const allTrades = useMemo(() => {
    const current = (transactions || [])
      .filter((t) => t.type === "trade" && t.status === "complete")
      .map((t) => {
        const ownersByRosterId = {};
        (t.roster_ids || []).forEach((rid) => {
          ownersByRosterId[rid] = usersById[rostersById[rid]?.owner_id];
        });
        return { ...t, season: currentSeason, ownersByRosterId };
      });
    const historical = (seasonHistory || []).flatMap((s) => s.trades || []);
    return [...current, ...historical].sort((a, b) => (b.created || 0) - (a.created || 0));
  }, [transactions, rostersById, usersById, currentSeason, seasonHistory]);

  const filteredTrades = useMemo(() => {
    if (filterOwnerId === "all") return allTrades;
    return allTrades.filter((t) =>
      (t.roster_ids || []).some((rid) => t.ownersByRosterId?.[rid]?.user_id === filterOwnerId)
    );
  }, [allTrades, filterOwnerId]);

  const totalPages = Math.max(1, Math.ceil(filteredTrades.length / PAGE_SIZE));
  const pageTrades = filteredTrades.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  // Trade count per manager, across every linked season. Since allTrades is
  // sorted newest-first, the first time we see an owner locks in their most
  // current team name/avatar rather than an old one. This one always stays
  // all-time - it feeds the manager filter dropdown, not the leaderboard.
  const tradeCounts = useMemo(() => {
    const counts = {};
    allTrades.forEach((t) => {
      (t.roster_ids || []).forEach((rid) => {
        const owner = t.ownersByRosterId?.[rid];
        if (!owner) return;
        const oid = owner.user_id;
        if (!counts[oid]) counts[oid] = { count: 0, user: owner };
        counts[oid].count++;
      });
    });
    return Object.values(counts).sort((a, b) => b.count - a.count);
  }, [allTrades]);

  // Same idea, but respecting the season toggle - this is what the "Most
  // active traders" leaderboard card actually displays.
  const traderLeaderboardCounts = useMemo(() => {
    const trades = traderSeasonFilter === "all" ? allTrades : allTrades.filter((t) => t.season === traderSeasonFilter);
    const counts = {};
    trades.forEach((t) => {
      (t.roster_ids || []).forEach((rid) => {
        const owner = t.ownersByRosterId?.[rid];
        if (!owner) return;
        const oid = owner.user_id;
        if (!counts[oid]) counts[oid] = { count: 0, user: owner };
        counts[oid].count++;
      });
    });
    return Object.values(counts).sort((a, b) => b.count - a.count);
  }, [allTrades, traderSeasonFilter]);

  useEffect(() => {
    setPage(0);
  }, [filterOwnerId]);

  return (
    <div>
      <SectionLabel>Trade History</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Every deal, for better or worse, across every linked season. Someone's going to bring this up drunk at a
        tailgate in three years. Every trade shows points scored since the deal happened, and it keeps running for
        as long as that player actually stays on the team that acquired them, even across a season boundary. The
        moment they get traded again or dropped, it stops right there.
      </div>
      {!isActiveSeason && (
        <div style={{ fontSize: 12, color: COLORS.gold, marginBottom: 10 }}>
          {seasonType === "pre"
            ? "Still preseason, so any trades made now are early moves before games actually count."
            : "It's the offseason, so trade activity will pick back up once the new league year gets set up."}
        </div>
      )}

      <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>
        {[["trades", "Trades"], ["waivers", "Waivers"]].map(([id, label]) => (
          <button
            key={id}
            onClick={() => setViewMode(id)}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${viewMode === id ? COLORS.turf : COLORS.hairline}`,
              background: viewMode === id ? COLORS.turfTint : "transparent",
              color: viewMode === id ? COLORS.turf : COLORS.muted,
              cursor: "pointer",
              fontWeight: viewMode === id ? 600 : 400,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {viewMode === "waivers" ? (
        <WaiverWireSection
          transactions={transactions}
          rostersById={rostersById}
          usersById={usersById}
          players={players}
          isActiveSeason={isActiveSeason}
          seasonType={seasonType}
          seasonHistory={seasonHistory}
          currentSeason={currentSeason}
        />
      ) : allTrades.length === 0 ? (
        <Card>

function WaiverWireSection({ transactions, rostersById, usersById, players, isActiveSeason, seasonType, seasonHistory, currentSeason }) {
  const PAGE_SIZE = 10;
  const [page, setPage] = useState(0);
  const [waiverSeasonFilter, setWaiverSeasonFilter] = useState("all");

  function playerLabel(pid) {
    const p = players[pid];
    if (!p) return pid;
    return `${p.first_name || ""} ${p.last_name || ""}`.trim();
  }

  function formatDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // Every waiver/free-agent move across every linked season, current season
  // included. Historical seasons' moves already carry their own season tag
  // from the fetch; current-season ones get tagged here.
  const allWaiverMoves = useMemo(() => {
    const current = (transactions || [])
      .filter((t) => (t.type === "waiver" || t.type === "free_agent") && t.status === "complete")
      .map((t) => ({ ...t, season: currentSeason }));
    const historical = (seasonHistory || []).flatMap((s) => s.waiverMoves || []);
    return [...current, ...historical].sort((a, b) => (b.created || 0) - (a.created || 0));
  }, [transactions, seasonHistory, currentSeason]);

  const availableSeasons = useMemo(() => {
    const set = new Set([currentSeason, ...(seasonHistory || []).map((s) => s.season)]);
    return Array.from(set).filter(Boolean).sort((a, b) => Number(b) - Number(a));
  }, [currentSeason, seasonHistory]);

  const waiverMoves = useMemo(() => {
    if (waiverSeasonFilter === "all") return allWaiverMoves;
    return allWaiverMoves.filter((t) => t.season === waiverSeasonFilter);
  }, [allWaiverMoves, waiverSeasonFilter]);

  const totalPages = Math.max(1, Math.ceil(waiverMoves.length / PAGE_SIZE));
  const pageMoves = waiverMoves.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  useEffect(() => {
    setPage(0);
  }, [waiverSeasonFilter]);

  // Move count per manager, counting each transaction once (not per player
  // inside it), so a single waiver claim with an add+drop counts as one move.
  // Respects the season toggle, same as the moves list below it.
  const waiverCounts = useMemo(() => {
    const counts = {};
    waiverMoves.forEach((t) => {
      const rid = (t.roster_ids || [])[0];
      const owner = usersById[rostersById[rid]?.owner_id];
      if (!owner) return;
      const oid = owner.user_id;
      if (!counts[oid]) counts[oid] = { count: 0, user: owner };
      counts[oid].count++;
    });
    return Object.values(counts).sort((a, b) => b.count - a.count);
  }, [waiverMoves, rostersById, usersById]);

  if (allWaiverMoves.length === 0) {
    return (
      <Card>
        <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>
          No waiver or free-agent activity logged yet.
        </div>
      </Card>
    );

  return (
    <div>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 14 }}>
        Every waiver claim and free-agent pickup, across every linked season. FAAB shown when the league uses it.
        {!isActiveSeason && (
          <span style={{ color: COLORS.gold }}>
            {" "}{seasonType === "pre" ? "Preseason moves shown here are early roster building, not real waiver runs yet." : ""}
          </span>
        )}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <SectionLabel>Most active on waivers</SectionLabel>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          {[["all", "All time"], ...availableSeasons.map((s) => [s, s])].map(([id, label]) => (
            <button
              key={id}
              onClick={() => setWaiverSeasonFilter(id)}
              style={{
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 11,
                padding: "4px 10px",
                borderRadius: 999,
                border: `1px solid ${waiverSeasonFilter === id ? COLORS.turf : COLORS.hairline}`,
                background: waiverSeasonFilter === id ? COLORS.turfTint : "transparent",
                color: waiverSeasonFilter === id ? COLORS.turf : COLORS.muted,
                cursor: "pointer",
              }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>

      {waiverCounts.length > 0 ? (
        <div style={{ marginBottom: 16 }}>
          <BalancedGrid
            gap={10}
            minWidth={220}
            items={waiverCounts.map((wc) => ({
              key: wc.user.user_id,
              node: (
                <Card style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderLeft: `3px solid ${teamColor(teamName(wc.user))}` }}>
                  <Crest name={teamName(wc.user)} logo={avatarUrl(wc.user)} size={26} />

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
        {pageMoves.map((t) => {
          const rid = (t.roster_ids || [])[0];

                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Crest name={teamName(owner)} logo={avatarUrl(owner)} size={22} />

                  </span>
                </div>
                {date && (

              <div style={{ fontSize: 13, color: COLORS.muted }}>
                {adds.map((pid) => (
                  <div key={pid}>
                    + {playerLabel(pid)}

                      <span style={{ color: COLORS.gold, marginLeft: 6 }}>(${faab} FAAB)</span>
                    )}

                {drops.map((pid) => (
                  <div key={pid} style={{ color: COLORS.leatherDeep }}>- {playerLabel(pid)}</div>
                ))}
                {adds.length === 0 && drops.length === 0 && <div>-</div>}
              </div>
            </Card>
          );
        })}
      </div>
      {totalPages > 1 && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12 }}>
          <button
            onClick={() => setPage((p) => Math.max(0, p - 1))}
            disabled={page === 0}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${COLORS.hairline}`,
              background: "transparent",
              color: page === 0 ? COLORS.hairline : COLORS.turf,
              cursor: page === 0 ? "default" : "pointer",
            }}
          >
            Previous
          </button>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
            Page {page + 1} of {totalPages}
          </span>
          <button
            onClick={() => setPage((p) => Math.min(totalPages - 1, p + 1))}
            disabled={page >= totalPages - 1}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",

              padding: "7px 14px",
              borderRadius: 6,

              cursor: page >= totalPages - 1 ? "default" : "pointer",
            }}
          >
            Next
          </button>
        </div>
      )}
    </div>
  );

function computeSeasonPlayerTotals(weekMatchups) {
  const totals = {};
  Object.values(weekMatchups || {}).forEach((matchups) => {
    (matchups || []).forEach((m) => {
      Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
        totals[pid] = (totals[pid] || 0) + (pts || 0);
      });
    });
  });
  return totals;
}

// Compares each pick's draft position against how that player actually
// scored that season, in rank terms rather than raw points (so it isn't
// skewed by RBs/WRs naturally outscoring K/DEF). delta = pickNo minus
// points-rank: a big positive delta means picked late, finished high
// (a steal); a big negative delta means picked early, finished low (a bust).
function computeDraftValue(picks, seasonPlayerTotals) {
  const withPts = (picks || []).filter((p) => p.playerId).map((p) => ({ ...p, points: seasonPlayerTotals[p.playerId] || 0 }));
  if (withPts.length === 0) return { steal: null, bust: null };
  const byPoints = [...withPts].sort((a, b) => b.points - a.points);
  const pointsRank = {};
  byPoints.forEach((p, i) => { pointsRank[p.playerId] = i + 1; });
  const withDelta = withPts.map((p) => ({ ...p, delta: p.pickNo - pointsRank[p.playerId] }));
  const steal = withDelta.reduce((best, p) => (!best || p.delta > best.delta ? p : best), null);
  const bust = withDelta.reduce((worst, p) => (!worst || p.delta < worst.delta ? p : worst), null);
  return { steal, bust };
}

function DraftPicksTab({ rosters, usersById, tradedPicks, draftRounds, currentSeason, currentDraftPicks, seasonHistory, players, weekMatchups }) {
  const [mode, setMode] = useState("byTeam");
  const [historySeasonIdx, setHistorySeasonIdx] = useState(0);

  const picks = useMemo(
    () => computeDraftPicks(rosters, tradedPicks, draftRounds, currentSeason),
    [rosters, tradedPicks, draftRounds, currentSeason]
  );

  const ownerOf = (rid) => usersById[rosters.find((r) => r.roster_id === rid)?.owner_id];

  function playerLabel(pid) {
    const p = players?.[pid];
    if (!p) return pid;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || pid;
    return p.position ? `${name} (${p.position}${p.team ? ` - ${p.team}` : ""})` : name;
  }

  // Past drafts, newest season first. Current season's draft (if it's
  // happened yet) plus every linked historical season.
  const pastDrafts = useMemo(() => {
    const entries = [];
    if (currentDraftPicks && currentDraftPicks.length > 0) {
      entries.push({ season: currentSeason, picks: currentDraftPicks, weekMatchups });
    }
    (seasonHistory || []).forEach((s) => {
      if (s.draftPicks && s.draftPicks.length > 0) {
        entries.push({ season: s.season, picks: s.draftPicks, weekMatchups: s.weekMatchups || {} });
      }
    });
    return entries.sort((a, b) => Number(b.season) - Number(a.season));
  }, [currentDraftPicks, currentSeason, seasonHistory, weekMatchups]);

  const selectedDraft = pastDrafts[historySeasonIdx];
  const draftValue = useMemo(() => {
    if (!selectedDraft) return { steal: null, bust: null };
    return computeDraftValue(selectedDraft.picks, computeSeasonPlayerTotals(selectedDraft.weekMatchups));
  }, [selectedDraft]);

  const byTeam = useMemo(() => {
    const groups = {};
    rosters.forEach((r) => { groups[r.roster_id] = []; });
    picks.forEach((p) => {
      if (!groups[p.currentRosterId]) groups[p.currentRosterId] = [];
      groups[p.currentRosterId].push(p);
    });
    return rosters.map((r) => ({
      rosterId: r.roster_id,
      owner: usersById[r.owner_id],
      picks: (groups[r.roster_id] || []).sort((a, b) => a.season.localeCompare(b.season) || a.round - b.round),
    }));
  }, [rosters, picks, usersById]);

  const boardColumns = [
    { key: "season", label: "Season", align: "left", accessor: (p) => p.season },
    { key: "round", label: "Round", accessor: (p) => p.round },
    {
      key: "original",
      label: "Original team",
      align: "left",
      accessor: (p) => withOwner(ownerOf(p.originalRosterId)),
      render: (p) => (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Crest name={teamName(ownerOf(p.originalRosterId))} logo={avatarUrl(ownerOf(p.originalRosterId))} size={22} />
          <span style={{ fontSize: 13 }}>{withOwner(ownerOf(p.originalRosterId))}</span>
        </div>
      ),
    },
    {
      key: "current",
      label: "Current owner",
      align: "left",
      accessor: (p) => withOwner(ownerOf(p.currentRosterId)),
      render: (p) => (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Crest name={teamName(ownerOf(p.currentRosterId))} logo={avatarUrl(ownerOf(p.currentRosterId))} size={22} />
          <span style={{ fontSize: 13, fontWeight: p.traded ? 600 : 400, color: p.traded ? COLORS.gold : COLORS.bone }}>
            {withOwner(ownerOf(p.currentRosterId))}
          </span>
        </div>
      ),
    },
  ];

  return (
    <div>
      <SectionLabel>Draft picks</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Every team's draft capital for the next two classes. This is the future you're trading away, so look before
        you deal it. Picks not shown here simply haven't been traded, meaning they're still with whoever originally
        owned them.
      </div>

      <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
        {[["byTeam", "By team"], ["board", "Full board"], ["history", "History"]].map(([id, label]) => (
          <button
            key={id}
            onClick={() => setMode(id)}
            style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 12,
              padding: "7px 14px",
              borderRadius: 6,
              border: `1px solid ${mode === id ? COLORS.turf : COLORS.hairline}`,
              background: mode === id ? COLORS.turfTint : "transparent",
              color: mode === id ? COLORS.turf : COLORS.muted,
              cursor: "pointer",
              fontWeight: mode === id ? 600 : 400,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {mode === "byTeam" ? (
        <BalancedGrid
          minWidth={280}
          items={byTeam.map((t) => ({
            key: t.rosterId,
            node: (
              <Card style={{ borderLeft: `3px solid ${teamColor(teamName(t.owner))}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <Crest name={teamName(t.owner)} logo={avatarUrl(t.owner)} size={28} />
                  <span style={{ fontWeight: 600, fontSize: 14 }}>{withOwner(t.owner)}</span>
                  <span style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                    {t.picks.length} picks
                  </span>
                </div>
                {t.picks.length === 0 ? (
                  <div style={{ color: COLORS.muted, fontSize: 13, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No picks on record.</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column" }}>
                    {t.picks.map((p, i) => {
                      const isOwn = p.originalRosterId === p.currentRosterId;
                      return (
                        <div
                          key={`${p.season}-${p.round}-${p.originalRosterId}`}
                          style={{ display: "flex", alignItems: "center", padding: "6px 0", borderTop: i === 0 ? "none" : `1px solid ${COLORS.hairline}` }}

                              via {withOwner(ownerOf(p.originalRosterId))}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </Card>
            ),
          }))}

      ) : (
        <div>
          {pastDrafts.length === 0 ? (
            <Card>
              <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No completed drafts on record yet.</div>

              <div style={{ display: "flex", gap: 4, marginBottom: 12, flexWrap: "wrap" }}>

                      <div style={{ fontSize: 12, color: COLORS.bone }}>
                        Pick {draftValue.steal.pickNo} (Rd {draftValue.steal.round}), {fmt(draftValue.steal.points)} pts that season — {withOwner(draftValue.steal.owner)}
                      </div>
                    </Card>

                  {draftValue.bust && draftValue.bust.delta < 0 && (

                      <div style={{ fontSize: 10, color: COLORS.muted, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>

                      </div>
                      <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: COLORS.turf, marginBottom: 2 }}>

                            fontFamily: "'IBM Plex Mono', monospace",

                            letterSpacing: "0.06em",
                            color: COLORS.muted,

                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {p.pickNo}

                        <td style={{ padding: "7px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.muted }}>
                          {p.round}
                        </td>
                        <td style={{ padding: "7px 12px", fontSize: 13 }}>{playerLabel(p.playerId)}</td>
                        <td style={{ padding: "7px 12px" }}>
