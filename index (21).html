const LEAGUE_ID = "1312079841918468096";
const API = "https://api.sleeper.app/v1";

const fontImport = `

const COLORS = {

// Small color families keyed to fantasy-football position groups, built from
// the site's core turf/orange/gold/leather palette so position badges add
// variety without introducing new hues.
const POSITION_COLORS = {
  QB: { bg: "#FFE6D2", fg: "#B8460D" },
  RB: { bg: "#E1F0E7", fg: "#0E4D33" },
  WR: { bg: "#FFF3D6", fg: "#8A6A00" },
  TE: { bg: "#F1E4D4", fg: "#5A371C" },
  FLEX: { bg: "#EAF4EE", fg: "#3F7A63" },
  SUPER_FLEX: { bg: "#EAF4EE", fg: "#3F7A63" },
  K: { bg: "#F1E4D4", fg: "#5A371C" },
  DEF: { bg: "#FFE6D2", fg: "#B8460D" },
};
function positionColor(pos) {
  return POSITION_COLORS[pos] || { bg: "#EAF4EE", fg: "#6B7A70" };
}

const INJURY_COLORS = {
  Out: { bg: "#F1CBC0", fg: "#8A2E12" },
  IR: { bg: "#F1CBC0", fg: "#8A2E12" },
  PUP: { bg: "#F1CBC0", fg: "#8A2E12" },
  Doubtful: { bg: "#FFE0C2", fg: "#B8460D" },
  Questionable: { bg: "#FFF3D6", fg: "#8A6A00" },
  Sus: { bg: "#F1CBC0", fg: "#8A2E12" },
  NA: { bg: "#EAF4EE", fg: "#6B7A70" },
};
function injuryColor(status) {
  return INJURY_COLORS[status] || { bg: "#EAF4EE", fg: "#6B7A70" };
}

// Sleeper's transactions/{round} endpoint appears to return round-0 (before
// Week 1) transactions again when querying later rounds too, not just that
// round's own moves. That duplicates any offseason trade under a later round
// number, which would otherwise overwrite its correct "round 0" tag. Keeping
// the lowest round ever seen for a given transaction avoids that.
function dedupeTransactionsByMinRound(items) {
  const map = {};
  items.forEach((t) => {
    const existing = map[t.transaction_id];
    if (!existing || t._round < existing._round) {
      map[t.transaction_id] = t;
    }
  });
  return Object.values(map);
}

function useLeagueData(leagueId) {
  const [state, setState] = useState({
    loading: true,
    error: null,
    league: null,
    users: [],
    rosters: [],
    players: {},
    week: 1,
    seasonType: "regular",
    matchups: [],
    transactions: [],
    prevLeague: null,
    prevWinnerRosterId: null,
    seasonHistory: [],
    weekMatchups: {},
    tradedPicks: [],
    draftRounds: 4,
    currentDraftPicks: [],
  });

  useEffect(() => {
    let cancelled = false;

    async function j(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} -> ${res.status}`);
      return res.json();
    }

    // Resolve champion / runner-up / third / last place for one historical season
    async function resolveSeasonAwards(seasonLeagueId, rosters, users) {
      const byOwner = Object.fromEntries(users.map((u) => [u.user_id, u]));
      const rosterOwner = (rid) => {
        const r = rosters.find((r) => r.roster_id === rid);
        return r ? byOwner[r.owner_id] : null;
      };

      let champion = null, runnerUp = null, third = null;
      const playoffWins = {}; // owner_id -> win count
      const playoffLosses = {}; // owner_id -> loss count
      try {
        const bracket = await j(`${API}/league/${seasonLeagueId}/winners_bracket`);
        bracket.forEach((m) => {
          if (m.w) {
            const winner = rosterOwner(m.w);
            if (winner) playoffWins[winner.user_id] = (playoffWins[winner.user_id] || 0) + 1;
          }
          if (m.l) {
            const loser = rosterOwner(m.l);
            if (loser) playoffLosses[loser.user_id] = (playoffLosses[loser.user_id] || 0) + 1;
          }
        });
        const final = bracket.find((m) => m.p === 1 && m.w);
        if (final) {
          champion = rosterOwner(final.w);
          runnerUp = rosterOwner(final.l);
        }
        const thirdMatch = bracket.find((m) => m.p === 3 && m.w);
        if (thirdMatch) third = rosterOwner(thirdMatch.w);
      } catch (e) {
        // no bracket available
      }

      const standings = computeStandings(rosters, users);
      // Fallback to standings if bracket data is missing
      if (!champion && standings[0]) {
        champion = byOwner[rosters.find((r) => r.roster_id === standings[0].rosterId)?.owner_id];
      }
      const lastStanding = standings[standings.length - 1];
      const lastPlace = lastStanding
        ? byOwner[rosters.find((r) => r.roster_id === lastStanding.rosterId)?.owner_id]
        : null;

      // Highest single-game score across this season's completed weeks,
      // the single best individual player performance, plus head-to-head
      // results between every pair of owners this season.
      let highGame = null;
      let bestPlayerGame = null;
      const h2h = {}; // ownerId -> opponentOwnerId -> { w, l, t }
      const ownerWeeklyHigh = {}; // ownerId -> { points, week }
      const ownerBestPlayerGame = {}; // ownerId -> { playerId, points, week }
      const ownerPlayerTotals = {}; // ownerId -> { playerId: totalPoints }
      function recordH2H(a, b, result) {
        if (!a || !b) return;
        if (!h2h[a]) h2h[a] = {};
        if (!h2h[a][b]) h2h[a][b] = { w: 0, l: 0, t: 0 };
        h2h[a][b][result]++;
      }
      let seasonWeekMatchups = {};
      try {
        const weekResults = await Promise.all(
          Array.from({ length: 18 }, (_, i) => i + 1).map((w) =>
            j(`${API}/league/${seasonLeagueId}/matchups/${w}`).catch(() => [])
          )
        );
        weekResults.forEach((matchups, wi) => {
          seasonWeekMatchups[wi + 1] = matchups || [];
          (matchups || []).forEach((m) => {
            const owner = rosterOwner(m.roster_id);
            if (!highGame || (m.points ?? 0) > highGame.points) {
              if (owner) highGame = { owner, points: m.points ?? 0, week: wi + 1 };
            }
            if (owner) {
              const oid = owner.user_id;
              if (!ownerWeeklyHigh[oid] || (m.points ?? 0) > ownerWeeklyHigh[oid].points) {
                ownerWeeklyHigh[oid] = { points: m.points ?? 0, week: wi + 1 };
              }
              if (!ownerPlayerTotals[oid]) ownerPlayerTotals[oid] = {};
            }
            Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
              if (!bestPlayerGame || pts > bestPlayerGame.points) {
                bestPlayerGame = { playerId: pid, points: pts, week: wi + 1, owner };
              }
              if (owner) {
                const oid = owner.user_id;
                if (!ownerBestPlayerGame[oid] || pts > ownerBestPlayerGame[oid].points) {
                  ownerBestPlayerGame[oid] = { playerId: pid, points: pts, week: wi + 1 };
                }
                ownerPlayerTotals[oid][pid] = (ownerPlayerTotals[oid][pid] || 0) + pts;
              }
            });
          });
          const byMatchupId = {};
          (matchups || []).forEach((m) => {
            if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
            byMatchupId[m.matchup_id].push(m);
          });
          Object.values(byMatchupId).forEach((pair) => {
            if (pair.length !== 2) return;
            const ownerA = rosterOwner(pair[0].roster_id)?.user_id;
            const ownerB = rosterOwner(pair[1].roster_id)?.user_id;
            const ptsA = pair[0].points ?? 0;
            const ptsB = pair[1].points ?? 0;
            if (!ownerA || !ownerB) return;
            if (ptsA === ptsB) {
              recordH2H(ownerA, ownerB, "t");
              recordH2H(ownerB, ownerA, "t");
            } else if (ptsA > ptsB) {
              recordH2H(ownerA, ownerB, "w");
              recordH2H(ownerB, ownerA, "l");
            } else {
              recordH2H(ownerA, ownerB, "l");
              recordH2H(ownerB, ownerA, "w");
            }
          });
        });
      } catch (e) {
        // ignore, leave highGame/h2h as-is
      }

      return {
        champion, runnerUp, third, lastPlace, standings, playoffWins, playoffLosses, highGame, h2h, bestPlayerGame,
        ownerWeeklyHigh, ownerBestPlayerGame, ownerPlayerTotals, weekMatchups: seasonWeekMatchups,
      };
    }

    async function fetchSeasonTrades(seasonLeagueId, season, rosters, users) {
      const byOwner = Object.fromEntries(users.map((u) => [u.user_id, u]));
      const rosterOwner = (rid) => {
        const r = rosters.find((r) => r.roster_id === rid);
        return r ? byOwner[r.owner_id] : null;
      };
      try {
        const rounds = Array.from({ length: 19 }, (_, i) => i); // 0 = preseason, 1-18 = weeks
        const results = await Promise.all(
          rounds.map((round) =>
            j(`${API}/league/${seasonLeagueId}/transactions/${round}`)
              .then((arr) => (arr || []).map((t) => ({ ...t, _round: round })))
              .catch(() => [])
          )
        );
        const all = dedupeTransactionsByMinRound(results.flat()).filter((t) => t.status === "complete");
        const trades = all
          .filter((t) => t.type === "trade")
          .map((t) => {
            const ownersByRosterId = {};
            (t.roster_ids || []).forEach((rid) => { ownersByRosterId[rid] = rosterOwner(rid); });
            return { ...t, season, ownersByRosterId };
          });
        const waiverMoves = all
          .filter((t) => t.type === "waiver" || t.type === "free_agent")
          .map((t) => ({ ...t, season }));
        return { trades, waiverMoves };
      } catch (e) {
        return { trades: [], waiverMoves: [] };
      }
    }

    async function fetchSeasonDraft(seasonLeagueId, rosters, users) {
      const byOwner = Object.fromEntries(users.map((u) => [u.user_id, u]));
      const rosterOwner = (rid) => {
        const r = rosters.find((r) => r.roster_id === rid);
        return r ? byOwner[r.owner_id] : null;
      };
      try {
        const draftsList = await j(`${API}/league/${seasonLeagueId}/drafts`);
        if (!draftsList || draftsList.length === 0) return [];
        // A season can technically have more than one draft object; pull picks
        // from all of them and combine, in case a league ran more than one.
        // Each draft's own detail record carries slot_to_roster_id, the fixed
        // assignment of "this draft slot belongs to this roster" that a trade's
        // round/roster_id is really referring to - independent of who actually
        // ends up making that pick after trades change hands.
        const picksAndDetail = await Promise.all(
          draftsList.map(async (d) => {
            const [picks, detail] = await Promise.all([
              j(`${API}/draft/${d.draft_id}/picks`).catch(() => []),
              j(`${API}/draft/${d.draft_id}`).catch(() => null),
            ]);
            return { picks, slotToRosterId: detail?.slot_to_roster_id || {} };
          })
        );
        return picksAndDetail
          .flatMap(({ picks, slotToRosterId }) =>
            (picks || []).map((p) => ({
              round: p.round,
              pickNo: p.pick_no,
              playerId: p.player_id,
              owner: rosterOwner(p.roster_id),
              originalRosterId: slotToRosterId[p.draft_slot] ?? null,
            }))
          )
          .sort((a, b) => a.pickNo - b.pickNo);
      } catch (e) {
        return [];
      }
    }

    async function walkHistory(startLeague) {
      const seasons = [];
      let cursor = startLeague.previous_league_id;
      let guard = 0;
      while (cursor && guard < 25) {
        guard++;
        try {
          const [seasonLeague, seasonUsers, seasonRosters] = await Promise.all([
            j(`${API}/league/${cursor}`),
            j(`${API}/league/${cursor}/users`),
            j(`${API}/league/${cursor}/rosters`),
          ]);
          const awards = await resolveSeasonAwards(cursor, seasonRosters, seasonUsers);
          const seasonTransactions = await fetchSeasonTrades(cursor, seasonLeague.season, seasonRosters, seasonUsers);
          const draftPicks = await fetchSeasonDraft(cursor, seasonRosters, seasonUsers);
          seasons.push({
            season: seasonLeague.season,
            leagueId: cursor,
            users: seasonUsers,
            rosters: seasonRosters,
            trades: seasonTransactions.trades,
            waiverMoves: seasonTransactions.waiverMoves,
            draftPicks,
            ...awards,
          });
          cursor = seasonLeague.previous_league_id;
        } catch (e) {
          cursor = null;
        }
      }
      return seasons;
    }

    async function run() {
      try {
        const [league, nflState] = await Promise.all([
          j(`${API}/league/${leagueId}`),
          j(`${API}/state/nfl`),
        ]);
        // Sleeper's season_type tells us whether the regular season has
        // actually started. During preseason or the true offseason, there's
        // no real fantasy week yet, regardless of what a raw week number
        // might say.
        const seasonType = nflState.season_type || "regular";
        const isActiveSeason = seasonType === "regular" || seasonType === "post";
        const week = isActiveSeason ? Math.max(1, nflState.week || 1) : 1;

        const [users, rosters, playersRaw] = await Promise.all([
          j(`${API}/league/${leagueId}/users`),
          j(`${API}/league/${leagueId}/rosters`),
          j(`${API}/players/nfl`).catch(() => ({})),
        ]);

        let matchups = [];
        try {
          matchups = await j(`${API}/league/${leagueId}/matchups/${week}`);
        } catch (e) {
          matchups = [];
        }

        // Pull transactions across weeks played so far, plus preseason (round 0)
        const txWeeks = [0, ...Array.from({ length: week }, (_, i) => i + 1)];
        const txResults = await Promise.all(
          txWeeks.map((w) =>
            j(`${API}/league/${leagueId}/transactions/${w}`)
              .then((arr) => (arr || []).map((t) => ({ ...t, _round: w })))
              .catch(() => [])
          )
        );
        const transactions = dedupeTransactionsByMinRound(txResults.flat());

        // Pull all completed weeks of matchups this season, for superlatives
        const completedWeeks = Array.from({ length: Math.max(0, week - 1) }, (_, i) => i + 1);
        const weekResults = await Promise.all(
          completedWeeks.map((w) =>
            j(`${API}/league/${leagueId}/matchups/${w}`).catch(() => [])
          )
        );
        const weekMatchups = {};
        completedWeeks.forEach((w, i) => (weekMatchups[w] = weekResults[i]));

        let prevLeague = null;
        let prevWinnerRosterId = null;
        if (league.previous_league_id) {
          try {
            prevLeague = await j(`${API}/league/${league.previous_league_id}`);
            const bracket = await j(
              `${API}/league/${league.previous_league_id}/winners_bracket`
            ).catch(() => []);
            const final = bracket.find((m) => m.p === 1 && m.w);
            if (final) prevWinnerRosterId = final.w;
          } catch (e) {
            prevLeague = null;
          }
        }

        const seasonHistory = await walkHistory(league);

        // Draft pick ownership: Sleeper only returns picks that have been
        // traded away from their original owner; anything not in this list
        // is still held by the team it originally belonged to.
        let tradedPicks = [];
        let draftRounds = 4;
        let currentDraftPicks = [];
        try {
          tradedPicks = await j(`${API}/league/${leagueId}/traded_picks`);
        } catch (e) {
          tradedPicks = [];
        }
        try {
          const draftsList = await j(`${API}/league/${leagueId}/drafts`);
          const roundCounts = (draftsList || []).map((d) => d.settings?.rounds).filter((r) => r > 0);
          if (roundCounts.length > 0) {
            draftRounds = Math.max(...roundCounts);
          }
          if (draftsList && draftsList.length > 0) {
            const byOwnerCurrent = Object.fromEntries(users.map((u) => [u.user_id, u]));
            const rosterOwnerCurrent = (rid) => {
              const r = rosters.find((r) => r.roster_id === rid);
              return r ? byOwnerCurrent[r.owner_id] : null;
            };
            const picksAndDetail = await Promise.all(
              draftsList.map(async (d) => {
                const [picks, detail] = await Promise.all([
                  j(`${API}/draft/${d.draft_id}/picks`).catch(() => []),
                  j(`${API}/draft/${d.draft_id}`).catch(() => null),
                ]);
                return { picks, slotToRosterId: detail?.slot_to_roster_id || {} };
              })
            );
            currentDraftPicks = picksAndDetail
              .flatMap(({ picks, slotToRosterId }) =>
                (picks || []).map((p) => ({
                  round: p.round,
                  pickNo: p.pick_no,
                  playerId: p.player_id,
                  owner: rosterOwnerCurrent(p.roster_id),
                  originalRosterId: slotToRosterId[p.draft_slot] ?? null,
                }))
              )
              .sort((a, b) => a.pickNo - b.pickNo);
          }
        } catch (e) {
          // keep defaults
        }

        if (!cancelled) {
          setState({
            loading: false,
            error: null,
            league,
            users,
            rosters,
            players: playersRaw || {},
            week,
            seasonType,
            matchups,
            transactions,
            prevLeague,
            prevWinnerRosterId,
            seasonHistory,
            weekMatchups,
            tradedPicks,
            draftRounds,
            currentDraftPicks,
          });
        }
      } catch (err) {
        if (!cancelled) {
          setState((s) => ({ ...s, loading: false, error: err.message }));
        }
      }
    }

    run();
    return () => {
      cancelled = true;
    };
  }, [leagueId]);

  return state;
}

// Prefers Sleeper's own precomputed age field; falls back to computing it
// from birth_date for the rare player record missing it.
function playerAge(p) {
  if (!p) return null;
  if (typeof p.age === "number") return p.age;
  if (!p.birth_date) return null;
  const bd = new Date(p.birth_date);
  if (isNaN(bd.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - bd.getFullYear();
  const monthDiff = now.getMonth() - bd.getMonth();
  if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < bd.getDate())) age--;
  return age;
}

function teamName(u) {
  if (!u) return "Unknown Team";
  return u.metadata?.team_name || u.display_name || "Unnamed Team";
}

// For any user-facing label: team name plus the manager's Sleeper handle in
// parens, so ownership stays clear even if a team gets renamed mid-season.
// Sleeper username -> real name (first initial + last name), for display only.
// Anyone not in this list falls back to their raw Sleeper username.
const REAL_NAMES = {
  "teejray": "T. Ray",
  "cttoner": "C. Toner",
  "ajgrasso": "A. Grasso",
  "njgreen": "N. Green",
  "cameronm1315": "C. Mauck",
  "ddesplinter": "D. Desplinter",
  "cocobolodesk": "C. Hammoudeh",
  "glohman": "G. Lohman",
  "cannon1234": "C. Elsbury",
  "kelle235": "C. Kelley",
  "ryanforamerica": "R. Everett",
  "gcompton26": "G. Compton",
};

function withOwner(u) {
  if (!u) return "Unknown Team";
  const team = teamName(u);
  const owner = REAL_NAMES[(u.display_name || "").toLowerCase()] || u.display_name;
  return owner && owner !== team ? `${team} (${owner})` : team;
}

function avatarUrl(u) {
  if (u?.metadata?.avatar) return u.metadata.avatar;
  if (u?.avatar) return `https://sleepercdn.com/avatars/thumbs/${u.avatar}`;
  return null;
}

const SEASON_PHASE_LABELS = { pre: "Preseason", off: "Offseason" };
function seasonPhaseText(seasonType, week) {
  if (seasonType === "regular") return `Week ${week}`;
  if (seasonType === "post") return `Week ${week} - Postseason`;
  return SEASON_PHASE_LABELS[seasonType] || "Offseason";
}

function seasonPhaseColor(seasonType) {
  if (seasonType === "regular") return { bg: "#FF6B00", fg: "#FFFFFF" };
  if (seasonType === "post") return { bg: "#FFD400", fg: "#0A3924" };
  if (seasonType === "pre") return { bg: "#7B4B27", fg: "#FFFFFF" };
  return { bg: "rgba(255,255,255,0.16)", fg: "rgba(255,255,255,0.85)" };
}

function fmt(n, d = 1) {

}

// Head-to-head results between every pair of owners, from a { week: [...] }
// matchups object (used for the current season, since historical seasons
// compute this same shape during the season walk).
// Per-owner weekly high, best individual player game, and cumulative player
// point totals, computed from a { week: [...] } matchups object. Mirrors the
// per-season breakdown computed during the historical season walk, so the
// current season can be combined with past seasons using the same shape.
function computeOwnerBreakdownFromWeeks(weekMatchups, rosters) {
  const rosterOwnerId = (rid) => rosters.find((r) => r.roster_id === rid)?.owner_id;
  const weeklyHigh = {};
  const bestPlayerGame = {};
  const playerTotals = {};
  Object.entries(weekMatchups || {}).forEach(([week, matchups]) => {
    (matchups || []).forEach((m) => {
      const oid = rosterOwnerId(m.roster_id);
      if (!oid) return;
      if (!weeklyHigh[oid] || (m.points ?? 0) > weeklyHigh[oid].points) {
        weeklyHigh[oid] = { points: m.points ?? 0, week: Number(week) };
      }
      if (!playerTotals[oid]) playerTotals[oid] = {};
      Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
        if (!bestPlayerGame[oid] || pts > bestPlayerGame[oid].points) {
          bestPlayerGame[oid] = { playerId: pid, points: pts, week: Number(week) };
        }
        playerTotals[oid][pid] = (playerTotals[oid][pid] || 0) + pts;
      });
    });
  });
  return { weeklyHigh, bestPlayerGame, playerTotals };
}

function computeH2HFromWeeks(weekMatchups, rosters, usersById) {
  const rosterOwnerId = (rid) => rosters.find((r) => r.roster_id === rid)?.owner_id;
  const h2h = {};
  function record(a, b, result) {
    if (!a || !b) return;
    if (!h2h[a]) h2h[a] = {};
    if (!h2h[a][b]) h2h[a][b] = { w: 0, l: 0, t: 0 };
    h2h[a][b][result]++;
  }
  Object.values(weekMatchups || {}).forEach((matchups) => {
    const byMatchupId = {};
    (matchups || []).forEach((m) => {
      if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
      byMatchupId[m.matchup_id].push(m);
    });
    Object.values(byMatchupId).forEach((pair) => {
      if (pair.length !== 2) return;
      const ownerA = rosterOwnerId(pair[0].roster_id);
      const ownerB = rosterOwnerId(pair[1].roster_id);
      const ptsA = pair[0].points ?? 0;
      const ptsB = pair[1].points ?? 0;
      if (!ownerA || !ownerB) return;
      if (ptsA === ptsB) {
        record(ownerA, ownerB, "t");
        record(ownerB, ownerA, "t");
      } else if (ptsA > ptsB) {
        record(ownerA, ownerB, "w");
        record(ownerB, ownerA, "l");
      } else {
        record(ownerA, ownerB, "l");
        record(ownerB, ownerA, "w");
      }
    });
  });
  return h2h;
}

// Merge multiple { ownerId: { opponentId: {w,l,t} } } maps into one.
function mergeH2H(maps) {
  const merged = {};
  maps.forEach((h2h) => {
    Object.entries(h2h || {}).forEach(([a, opponents]) => {
      if (!merged[a]) merged[a] = {};
      Object.entries(opponents).forEach(([b, rec]) => {
        if (!merged[a][b]) merged[a][b] = { w: 0, l: 0, t: 0 };
        merged[a][b].w += rec.w;
        merged[a][b].l += rec.l;
        merged[a][b].t += rec.t;
      });
    });
  });
  return merged;
}

// Standard sports "games back" against the current cutoff team, plus a split
// of who's in versus who's on the bubble. Shared by Home and Standings so
// both pages always agree.
function computePlayoffPicture(standings, playoffTeams) {
  if (!playoffTeams || standings.length === 0) return { all: [], inTeams: [], bubbleTeams: [] };
  const cutoffTeam = standings[playoffTeams - 1];
  const all = standings.map((s, i) => {
    const inPlayoffs = i < playoffTeams;
    const gamesBack = inPlayoffs ? 0 : ((cutoffTeam.wins - s.wins) + (s.losses - cutoffTeam.losses)) / 2;
    return { ...s, inPlayoffs, gamesBack };
  });
  return {
    all,
    inTeams: all.slice(0, playoffTeams),
    bubbleTeams: all.slice(playoffTeams, playoffTeams + 3),
  };
}

// Current win/loss/tie streak per roster, walking backward from the most
// recent completed week of this season.
function computeStreaks(weekMatchups, rosters) {
  const weeks = Object.keys(weekMatchups || {}).map(Number).sort((a, b) => a - b);
  const resultsByRoster = {}; // rosterId -> ['W'|'L'|'T', ...] in chronological order

  weeks.forEach((week) => {
    const matchups = weekMatchups[week] || [];
    const byMatchupId = {};
    matchups.forEach((m) => {
      if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
      byMatchupId[m.matchup_id].push(m);
    });
    Object.values(byMatchupId).forEach((pair) => {
      if (pair.length !== 2) return;
      const [a, b] = pair;
      const ptsA = a.points ?? 0;
      const ptsB = b.points ?? 0;
      let ra, rb;
      if (ptsA === ptsB) { ra = "T"; rb = "T"; }
      else if (ptsA > ptsB) { ra = "W"; rb = "L"; }
      else { ra = "L"; rb = "W"; }
      if (!resultsByRoster[a.roster_id]) resultsByRoster[a.roster_id] = [];
      if (!resultsByRoster[b.roster_id]) resultsByRoster[b.roster_id] = [];
      resultsByRoster[a.roster_id].push(ra);
      resultsByRoster[b.roster_id].push(rb);
    });
  });

  const streaks = {};
  Object.entries(resultsByRoster).forEach(([rid, results]) => {
    if (results.length === 0) return;
    const last = results[results.length - 1];
    let count = 0;
    for (let i = results.length - 1; i >= 0; i--) {
      if (results[i] === last) count++;
      else break;
    }
    streaks[rid] = { type: last, count };
  });
  return streaks;
}

// "All-play" expected wins: each week, a team earns fractional credit for
// every other team it actually outscored that week, not just its real
// opponent. Summed across the season, this is what the schedule "should
// have" given them based on points alone. Luck = actual wins minus this.
function computeExpectedWins(weekMatchups) {
  const expectedWins = {};
  Object.values(weekMatchups || {}).forEach((matchups) => {
    const scores = (matchups || []).map((m) => ({ rosterId: m.roster_id, points: m.points ?? 0 }));
    const n = scores.length;
    if (n < 2) return;
    scores.forEach((s) => {
      let beat = 0;
      scores.forEach((other) => {
        if (other.rosterId !== s.rosterId && s.points > other.points) beat++;
      });
      expectedWins[s.rosterId] = (expectedWins[s.rosterId] || 0) + beat / (n - 1);
    });
  });
  return expectedWins;
}

// Points a specific player has scored from a given week onward, this
// season. Only meaningful for this season, since older seasons' per-week
// player scoring isn't kept around after the season history walk finishes.
function computePointsSinceWeek(playerId, fromWeek, weekMatchups) {
  let total = 0;
  Object.entries(weekMatchups || {}).forEach(([week, matchups]) => {
    if (Number(week) < fromWeek) return;
    (matchups || []).forEach((m) => {
      const pts = m.players_points?.[playerId];
      if (pts !== undefined) total += pts;
    });
  });
  return total;
}

// Draft pick ownership for upcoming seasons. Sleeper's traded_picks endpoint
// only lists picks that have moved from their original owner, so anything
// not present there is still held by the roster it originally belonged to.
// Best possible lineup for one week's roster, given the league's actual
// starting slots. A greedy fill ordered from most-restrictive slot to least
// (single positions before flexes, flexes before superflex) is not always
// mathematically perfect in rare edge cases, but it's the standard approach
// for this exact problem and effectively always matches true optimal for
// normal roster construction.
const FLEX_ELIGIBILITY = {
  QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"], K: ["K"], DEF: ["DEF"],
  FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["RB", "WR"], REC_FLEX: ["WR", "TE"],
  SUPER_FLEX: ["QB", "RB", "WR", "TE"],
};

function computeOptimalLineupPoints(playerIds, playersPoints, rosterPositions, playersDict) {
  const slots = (rosterPositions || []).filter((p) => p !== "BN");
  const slotOrder = [...slots].sort(
    (a, b) => (FLEX_ELIGIBILITY[a]?.length || 99) - (FLEX_ELIGIBILITY[b]?.length || 99)
  );
  const available = new Set(playerIds);
  let total = 0;
  slotOrder.forEach((slot) => {
    const elig = FLEX_ELIGIBILITY[slot];
    if (!elig) return; // unrecognized slot type (e.g. IDP); skip rather than guess
    let best = null;
    let bestPts = -Infinity;
    available.forEach((pid) => {
      const p = playersDict[pid];
      if (!p || !elig.includes(p.position)) return;
      const pts = playersPoints[pid] ?? 0;
      if (pts > bestPts) {
        bestPts = pts;
        best = pid;
      }
    });
    if (best !== null) {
      total += bestPts;
      available.delete(best);
    }
  });
  return total;
}

function computeDraftPicks(rosters, tradedPicks, draftRounds, currentSeason) {
  const futureSeasons = [String(Number(currentSeason) + 1), String(Number(currentSeason) + 2)];
  const rounds = Array.from({ length: draftRounds }, (_, i) => i + 1);

  const tradeMap = {};
  (tradedPicks || []).forEach((tp) => {
    tradeMap[`${tp.season}-${tp.round}-${tp.roster_id}`] = tp.owner_id;
  });

  const allPicks = [];
  futureSeasons.forEach((season) => {
    rounds.forEach((round) => {
      rosters.forEach((r) => {
        const key = `${season}-${round}-${r.roster_id}`;
        const currentRosterId = tradeMap[key] !== undefined ? tradeMap[key] : r.roster_id;
        allPicks.push({
          season,
          round,
          originalRosterId: r.roster_id,
          currentRosterId,
          traded: currentRosterId !== r.roster_id,
        });
      });
    });
  });
  return allPicks;
}

function computeStandings(rosters, users) {
  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]));
  return rosters
    .map((r) => {
      const u = byId[r.owner_id];
      const w = r.settings?.wins ?? 0;
      const l = r.settings?.losses ?? 0;
      const t = r.settings?.ties ?? 0;
      const fpts = (r.settings?.fpts ?? 0) + (r.settings?.fpts_decimal ?? 0) / 100;
      const fptsAgainst =
        (r.settings?.fpts_against ?? 0) + (r.settings?.fpts_against_decimal ?? 0) / 100;
      const games = w + l + t;
      return {
        rosterId: r.roster_id,
        ownerId: r.owner_id,
        name: teamName(u),
        displayName: withOwner(u),
        avatar: avatarUrl(u),
        wins: w,
        losses: l,
        ties: t,
        fpts,
        fptsAgainst,
        winPct: games ? (w + t * 0.5) / games : 0,
      };
    })
    .sort((a, b) => b.winPct - a.winPct || b.fpts - a.fpts);
}

// Reconstructs standings using only weeks up through throughWeek, for
// computing what a ranking looked like at an earlier point in the season
// (e.g. power rankings movement). Unlike computeStandings, which reads the
// live cumulative totals off each roster's settings, this tallies wins,
// losses, ties, and points straight from that week's matchup data.
function computeStandingsThroughWeek(weekMatchups, throughWeek, rosters, users) {
  const byId = Object.fromEntries(users.map((u) => [u.user_id, u]));
  const stats = {};
  rosters.forEach((r) => { stats[r.roster_id] = { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0 }; });
  Object.keys(weekMatchups || {})
    .map(Number)
    .filter((w) => w <= throughWeek)
    .sort((a, b) => a - b)
    .forEach((week) => {
      groupByMatchupId(weekMatchups[week]).forEach((pair) => {
        pair.forEach((m) => {
          if (!stats[m.roster_id]) stats[m.roster_id] = { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0 };
          stats[m.roster_id].fpts += m.points ?? 0;
        });
        if (pair.length === 2) {
          const [a, b] = pair;
          const aPts = a.points ?? 0, bPts = b.points ?? 0;
          stats[a.roster_id].fptsAgainst += bPts;
          stats[b.roster_id].fptsAgainst += aPts;
          if (aPts === bPts) { stats[a.roster_id].ties++; stats[b.roster_id].ties++; }
          else if (aPts > bPts) { stats[a.roster_id].wins++; stats[b.roster_id].losses++; }
          else { stats[b.roster_id].wins++; stats[a.roster_id].losses++; }
        }
      });
    });
  return rosters
    .map((r) => {
      const u = byId[r.owner_id];
      const s = stats[r.roster_id] || { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0 };
      const games = s.wins + s.losses + s.ties;
      return {
        rosterId: r.roster_id,
        ownerId: r.owner_id,
        name: teamName(u),
        displayName: withOwner(u),
        avatar: avatarUrl(u),
        wins: s.wins,
        losses: s.losses,
        ties: s.ties,
        fpts: s.fpts,
        fptsAgainst: s.fptsAgainst,
        winPct: games ? (s.wins + s.ties * 0.5) / games : 0,
      };
    })
    .sort((a, b) => b.winPct - a.winPct || b.fpts - a.fpts);
}

function computePowerRankings(standings) {
  if (standings.length === 0) return [];
  const maxFpts = Math.max(...standings.map((s) => s.fpts), 1);
  const scored = standings.map((s) => {
    const winScore = s.winPct * 70;
    const ptsScore = (s.fpts / maxFpts) * 30;
    return { ...s, power: winScore + ptsScore };
  });
  scored.sort((a, b) => b.power - a.power);
  return scored;
}

            currentDraftPicks={data.currentDraftPicks}

          />
        )}

          <HistoryTab
            rostersById={rostersById}
            usersById={usersById}
            currentSeason={data.league?.season}
            standings={standings}
            seasonHistory={data.seasonHistory}
            superlatives={leagueSuper}
            players={data.players}
          />
        )}
      </div>
    </div>
  );
}

function SortableTable({ columns, rows, rowKey, defaultSortKey, defaultSortDir = "desc" }) {
  const [sort, setSort] = useState({ key: defaultSortKey, dir: defaultSortDir });

  const sorted = useMemo(() => {
    const col = columns.find((c) => c.key === sort.key);
    if (!col) return rows;
    const copy = [...rows];
    copy.sort((a, b) => {
      const av = col.accessor(a);
      const bv = col.accessor(b);
      if (typeof av === "string") {
        return sort.dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      return sort.dir === "asc" ? av - bv : bv - av;
    });
    return copy;
  }, [rows, sort, columns]);

  function onHeaderClick(key) {
    setSort((s) => (s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "desc" }));
  }

  return (
    <table style={{ width: "100%", borderCollapse: "collapse" }}>
      <thead>
        <tr style={{ background: COLORS.surfaceLight }}>
          {columns.map((col, i) => (
            <th
              key={col.key}
              className={col.sortable === false ? undefined : "sortable-th"}
              onClick={col.sortable === false ? undefined : () => onHeaderClick(col.key)}
              style={{
                textAlign: col.align || (i === 0 ? "left" : "right"),
                padding: "7px 12px",
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 11,
                letterSpacing: "0.06em",
                color: sort.key === col.key ? COLORS.turf : COLORS.muted,
                textTransform: "uppercase",
                cursor: col.sortable === false ? "default" : "pointer",
                userSelect: "none",
                whiteSpace: "nowrap",
              }}
            >
              {col.label}
              {col.sortable !== false && sort.key === col.key ? (sort.dir === "asc" ? " \u25B2" : " \u25BC") : ""}
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {sorted.map((row, i) => (
          <tr key={rowKey(row)} style={{ borderTop: `1px solid ${COLORS.hairline}`, background: row.rowBg || "transparent" }}>
            {columns.map((col, ci) => (
              <td
                key={col.key}
                style={{
                  padding: "8px 12px",
                  textAlign: col.align || (ci === 0 ? "left" : "right"),
                  fontFamily: ci === 0 ? undefined : "'IBM Plex Mono', monospace",
                  color: col.color ? col.color(row) : undefined,
                  fontWeight: col.bold && col.bold(row) ? 700 : undefined,
                }}
              >
                {col.render ? col.render(row, i) : col.accessor(row)}
              </td>
            ))}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function heatColor(pct) {
  // Lerp between a rust/loss anchor and the turf/win anchor.
  const lossRGB = [193, 73, 10];
  const winRGB = [14, 77, 51];
  const p = Math.max(0, Math.min(1, pct));
  const r = Math.round(lossRGB[0] + (winRGB[0] - lossRGB[0]) * p);
  const g = Math.round(lossRGB[1] + (winRGB[1] - lossRGB[1]) * p);
  const b = Math.round(lossRGB[2] + (winRGB[2] - lossRGB[2]) * p);
  return { bg: `rgba(${r},${g},${b},0.22)`, solid: `rgb(${r},${g},${b})` };
}

function shortLabel(u) {
  if (!u) return "?";
  const real = REAL_NAMES[(u.display_name || "").toLowerCase()];
  if (real) return real.split(". ")[1] || real;
  return (u.display_name || "?").slice(0, 8);
}

// Every individual game between two specific managers, across every linked
// season, oriented so "a" always refers to ownerA regardless of which
// roster/side they were on that particular season (roster IDs aren't
// stable across seasons, so this re-resolves owner from each season's own
// roster list rather than assuming current-season roster IDs apply).
function computeRivalryGames(ownerA, ownerB, currentSeason, weekMatchups, rosters, users, seasonHistory) {
  const games = [];
  function walkSeason(season, wm, rs) {
    const ownerFor = (rid) => {
      const r = (rs || []).find((r) => r.roster_id === rid);
      return r ? r.owner_id : null;
    };
    Object.keys(wm || {}).map(Number).sort((a, b) => a - b).forEach((week) => {
      groupByMatchupId(wm[week]).forEach((pair) => {
        if (pair.length !== 2) return;
        const [a, b] = pair;
        const ownerAId = ownerFor(a.roster_id);
        const ownerBId = ownerFor(b.roster_id);
        if (!ownerAId || !ownerBId || ownerAId === ownerBId) return;
        const pairSet = new Set([ownerAId, ownerBId]);
        if (!pairSet.has(ownerA) || !pairSet.has(ownerB)) return;
        const aPts = ownerAId === ownerA ? (a.points ?? 0) : (b.points ?? 0);
        const bPts = ownerAId === ownerA ? (b.points ?? 0) : (a.points ?? 0);
        games.push({ season, week, aPts, bPts });
      });
    });
  }
  (seasonHistory || []).forEach((s) => walkSeason(s.season, s.weekMatchups || {}, s.rosters || []));
  walkSeason(currentSeason, weekMatchups, rosters);
  games.sort((x, y) => Number(x.season) - Number(y.season) || x.week - y.week);
  return games;
}

function summarizeRivalry(games) {
  if (!games || games.length === 0) return null;
  let winsA = 0, winsB = 0, ties = 0, totalA = 0, totalB = 0;
  let closest = null, blowout = null;
  games.forEach((g) => {
    totalA += g.aPts;
    totalB += g.bPts;
    const margin = Math.abs(g.aPts - g.bPts);
    if (g.aPts > g.bPts) winsA++;
    else if (g.bPts > g.aPts) winsB++;
    else ties++;
    if (!closest || margin < closest.margin) closest = { ...g, margin };
    if (!blowout || margin > blowout.margin) blowout = { ...g, margin };
  });
  const last = games[games.length - 1];
  const winnerSide = (g) => (g.aPts > g.bPts ? "A" : g.bPts > g.aPts ? "B" : "T");
  const lastWinner = winnerSide(last);
  let streakCount = 0;
  for (let i = games.length - 1; i >= 0; i--) {
    if (winnerSide(games[i]) === lastWinner) streakCount++;
    else break;
  }
  return { winsA, winsB, ties, totalA, totalB, closest, blowout, streak: { who: lastWinner, count: streakCount }, games };
}

function StandingsTab({ standings, playoffTeams, data, usersById }) {
  const [mode, setMode] = useState("season");
  const [selectedRivalry, setSelectedRivalry] = useState(null); // { a: ownerId, b: ownerId }
  const { seasonHistory, weekMatchups, rosters, users } = data;

  const ownerDirectory = useMemo(() => {
    const map = {};
    [...seasonHistory].sort((a, b) => Number(a.season) - Number(b.season)).forEach((s) => {
      (s.users || []).forEach((u) => { map[u.user_id] = u; });
    });
    users.forEach((u) => { map[u.user_id] = u; });
    return map;
  }, [seasonHistory, users]);

  const playoffPicture = useMemo(() => computePlayoffPicture(standings, playoffTeams), [standings, playoffTeams]);

  const streaks = useMemo(() => computeStreaks(weekMatchups, rosters), [weekMatchups, rosters]);
  const expectedWins = useMemo(() => computeExpectedWins(weekMatchups), [weekMatchups]);

  const seasonRows = useMemo(() => {
    return standings.map((s, i) => {
      const picture = playoffPicture.all[i];
      return {
        ...s,
        rowBg: playoffTeams && i < playoffTeams ? COLORS.turfTint : "transparent",
        isPlayoffPosition: playoffTeams && i < playoffTeams,
        gamesBack: picture ? picture.gamesBack : 0,
        streak: streaks[s.rosterId] || null,
        expectedWins: expectedWins[s.rosterId] || 0,
        luck: s.wins - (expectedWins[s.rosterId] || 0),
      };
    });
  }, [standings, playoffTeams, playoffPicture, streaks, expectedWins]);

  const allTimeStandings = useMemo(() => {
    const career = {};
    const allSeasonStandings = [...seasonHistory.map((s) => s.standings || []), standings];
    allSeasonStandings.forEach((seasonStandings) => {
      seasonStandings.forEach((s) => {
        if (!s.ownerId) return;
        if (!career[s.ownerId]) career[s.ownerId] = { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0, playoffWins: 0, playoffLosses: 0 };
        career[s.ownerId].wins += s.wins;
        career[s.ownerId].losses += s.losses;
        career[s.ownerId].ties += s.ties;
        career[s.ownerId].fpts += s.fpts;
        career[s.ownerId].fptsAgainst += s.fptsAgainst;
      });
    });
    seasonHistory.forEach((season) => {
      Object.entries(season.playoffWins || {}).forEach(([ownerId, wins]) => {
        if (!career[ownerId]) career[ownerId] = { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0, playoffWins: 0, playoffLosses: 0 };
        career[ownerId].playoffWins += wins;
      });
      Object.entries(season.playoffLosses || {}).forEach(([ownerId, losses]) => {
        if (!career[ownerId]) career[ownerId] = { wins: 0, losses: 0, ties: 0, fpts: 0, fptsAgainst: 0, playoffWins: 0, playoffLosses: 0 };
        career[ownerId].playoffLosses += losses;
      });
    });
    return Object.entries(career)
      .map(([ownerId, c]) => {
        const games = c.wins + c.losses + c.ties;
        return {
          ownerId,
          user: ownerDirectory[ownerId],
          ...c,
          games,
          winPct: games ? (c.wins + c.ties * 0.5) / games : 0,
        };
      })
      .sort((a, b) => b.winPct - a.winPct || b.fpts - a.fpts);
  }, [seasonHistory, standings, ownerDirectory]);

  const combinedH2H = useMemo(() => {
    const currentH2H = computeH2HFromWeeks(weekMatchups, rosters, usersById);
    return mergeH2H([...seasonHistory.map((s) => s.h2h || {}), currentH2H]);
  }, [seasonHistory, weekMatchups, rosters, usersById]);

  const h2hOwnerOrder = allTimeStandings.map((s) => s.ownerId);

  const rivalryDetail = useMemo(() => {
    if (!selectedRivalry) return null;
    const games = computeRivalryGames(
      selectedRivalry.a, selectedRivalry.b, data.league?.season, weekMatchups, rosters, users, seasonHistory
    );
    return summarizeRivalry(games);
  }, [selectedRivalry, data.league, weekMatchups, rosters, users, seasonHistory]);

  const seasonColumns = [
    { key: "rank", label: "#", align: "left", sortable: false, accessor: () => 0, render: (r, i) => i + 1 },

      key: "team",

      render: (r) => (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

      render: (r) => {

    },

  const allTimeColumns = [
    { key: "rank", label: "#", align: "left", sortable: false, accessor: () => 0, render: (r, i) => i + 1 },
    {
      key: "team",
      label: "Manager",
      align: "left",
      accessor: (r) => withOwner(r.user),
      render: (r) => (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Crest name={teamName(r.user)} logo={avatarUrl(r.user)} size={24} />
          <span style={{ fontWeight: 600 }}>{withOwner(r.user)}</span>
        </div>
      ),
    },
    { key: "wins", label: "W", accessor: (r) => r.wins },
    { key: "losses", label: "L", accessor: (r) => r.losses },
    { key: "ties", label: "T", accessor: (r) => r.ties },
    { key: "fpts", label: "PF", accessor: (r) => r.fpts, color: () => COLORS.gold, render: (r) => fmt(r.fpts) },

      key: "playoffRecord",

      render: (r) => (r.playoffWins || r.playoffLosses ? `${r.playoffWins}-${r.playoffLosses}` : "-"),

  return (

      <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
        {[["season", "This season"], ["allTime", "All time"]].map(([id, label]) => (
          <button
            key={id}

              fontFamily: "'IBM Plex Mono', monospace",

              color: mode === id ? COLORS.turf : COLORS.muted,

          >
            {label}
          </button>
        ))}
      </div>

      {mode === "season" ? (
        <div>
          <SectionLabel>Current standings</SectionLabel>

                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: COLORS.bone, fontWeight: 600 }}>
                        {rivalryDetail.closest.aPts === rivalryDetail.closest.bPts
                          ? `Tied, ${fmt(rivalryDetail.closest.margin)} pts`
                          : `${withOwner(ownerDirectory[rivalryDetail.closest.aPts > rivalryDetail.closest.bPts ? selectedRivalry.a : selectedRivalry.b])} by ${fmt(rivalryDetail.closest.margin)} pts`}
                      </span>
                    </div>
                  )}
                  {rivalryDetail.streak.count > 1 && rivalryDetail.streak.who !== "T" && (
                    <div style={{ fontSize: 12, color: COLORS.muted }}>
                      Current streak<br />
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: COLORS.bone, fontWeight: 600 }}>
                        {withOwner(ownerDirectory[rivalryDetail.streak.who === "A" ? selectedRivalry.a : selectedRivalry.b])} has won {rivalryDetail.streak.count} straight
                      </span>
                    </div>
                  )}
                </div>
              </Card>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function MatchupsTab({ matchups, rostersById, usersById, week, seasonType }) {
  const grouped = useMemo(() => {
    const byMatchupId = {};
    matchups.forEach((m) => {
      if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
      byMatchupId[m.matchup_id].push(m);
    });
    return Object.values(byMatchupId);
  }, [matchups]);

  const isActiveSeason = seasonType === "regular" || seasonType === "post";

  if (!isActiveSeason) {
    return (
      <div>
        <SectionLabel>Matchups</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted }}>
            {seasonType === "pre"
              ? "Still preseason. Real fantasy matchups kick off once the regular season starts."
              : "It's the offseason. Check back once the new season is set up."}
          </div>
        </Card>
      </div>
    );
  }

  if (grouped.length === 0) {
    return (
      <div>
        <SectionLabel>Week {week} Matchups</SectionLabel>
        <Card>
          <div style={{ color: COLORS.muted, borderLeft: `3px solid ${COLORS.leather}`, paddingLeft: 10 }}>No matchup data posted for this week yet.</div>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionLabel>Week {week} Matchups</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>
        Head to head, winner takes the bragging rights and the loser takes the group chat abuse. That's the deal.
      </div>
      <BalancedGrid
        items={grouped.map((pair, i) => {
          const [a, b] = pair;
          const teamA = usersById[rostersById[a?.roster_id]?.owner_id];
          const teamB = b ? usersById[rostersById[b?.roster_id]?.owner_id] : null;
          const nameA = teamName(teamA);
          const nameB = b ? teamName(teamB) : "BYE";
          const labelA = withOwner(teamA);
          const labelB = b ? withOwner(teamB) : "BYE";
          const scoreA = a?.points ?? 0;
          const scoreB = b?.points ?? 0;
          const aLeads = scoreA >= scoreB;
          return {
            key: i,
            node: (
              <Card>
                <MatchupRow name={nameA} label={labelA} logo={avatarUrl(teamA)} score={scoreA} leading={aLeads && !!b} />
                <div style={{ height: 1, background: COLORS.hairline, margin: "10px 0" }} />
                <MatchupRow name={nameB} label={labelB} logo={b ? avatarUrl(teamB) : null} score={scoreB} leading={!aLeads && !!b} />
              </Card>
            ),
          };
        })}
      />
    </div>
  );
}

function MatchupRow({ name, label, logo, score, leading }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <Crest name={name} logo={logo} size={28} />
        <span style={{ fontWeight: leading ? 700 : 500, color: leading ? COLORS.bone : COLORS.muted }}>
          {label}
        </span>
      </div>
      <span
        style={{
          fontFamily: "'IBM Plex Mono', monospace",
          fontSize: 18,
          color: leading ? COLORS.gold : COLORS.muted,
        }}
      >
        {fmt(score)}
      </span>
    </div>
  );
}

// ---- Weekly Recap ----
// Template-based recap generator: real results and stats plugged into a
// small bank of phrase variants so the tone stays consistent week to week
// without needing a live model call from a static, client-only page.

function groupByMatchupId(matchups) {
  const byMatchupId = {};
  (matchups || []).forEach((m) => {
    if (!byMatchupId[m.matchup_id]) byMatchupId[m.matchup_id] = [];
    byMatchupId[m.matchup_id].push(m);
  });
  return Object.values(byMatchupId);
}

function computeWeekRecap(matchups, playersDict) {
  if (!matchups || matchups.length === 0) return null;
  const pairs = groupByMatchupId(matchups);

  // Every "best of the week" stat tracks a value plus an array of every
  // entry tied at that value, not just the first one found - a real tie
  // (two duds with the exact same rock-bottom score, say) should show
  // every name, not whichever happened to be checked first.
  let highScoreVal = -Infinity, highScore = [];
  let lowScoreVal = Infinity, lowScore = [];
  let studVal = -Infinity, stud = [];
  let dudVal = Infinity, dud = [];
  let benchTragedyVal = -Infinity, benchTragedy = [];
  let benchStudVal = -Infinity, benchStud = [];
  let oneManShowVal = -Infinity, oneManShow = [];
  const zeroClub = [];
  const positionBestVal = { QB: -Infinity, RB: -Infinity, WR: -Infinity, TE: -Infinity };
  const positionBest = { QB: [], RB: [], WR: [], TE: [] };

  matchups.forEach((m) => {
    const pts = m.points ?? 0;
    if (pts > highScoreVal) { highScoreVal = pts; highScore = [{ rosterId: m.roster_id, points: pts }]; }
    else if (pts === highScoreVal) { highScore.push({ rosterId: m.roster_id, points: pts }); }
    if (pts < lowScoreVal) { lowScoreVal = pts; lowScore = [{ rosterId: m.roster_id, points: pts }]; }
    else if (pts === lowScoreVal) { lowScore.push({ rosterId: m.roster_id, points: pts }); }

    const startersSet = new Set((m.starters || []).filter((pid) => pid && pid !== "0"));
    const pointsMap = m.players_points || {};

    startersSet.forEach((pid) => {
      const p = pointsMap[pid] ?? 0;
      if (p > studVal) { studVal = p; stud = [{ rosterId: m.roster_id, playerId: pid, points: p }]; }
      else if (p === studVal) { stud.push({ rosterId: m.roster_id, playerId: pid, points: p }); }
      if (p < dudVal) { dudVal = p; dud = [{ rosterId: m.roster_id, playerId: pid, points: p }]; }
      else if (p === dudVal) { dud.push({ rosterId: m.roster_id, playerId: pid, points: p }); }
      if (p <= 0) zeroClub.push({ rosterId: m.roster_id, playerId: pid, points: p });
    });

    let teamMaxStarter = null;
    startersSet.forEach((pid) => {
      const p = pointsMap[pid] ?? 0;
      if (!teamMaxStarter || p > teamMaxStarter.points) teamMaxStarter = { playerId: pid, points: p };
    });
    if (teamMaxStarter && pts > 0) {
      const share = teamMaxStarter.points / pts;
      const entry = { rosterId: m.roster_id, playerId: teamMaxStarter.playerId, points: teamMaxStarter.points, share };
      if (share > oneManShowVal) { oneManShowVal = share; oneManShow = [entry]; }
      else if (share === oneManShowVal) { oneManShow.push(entry); }
    }

    const rosterPlayers = m.players && m.players.length ? m.players : Object.keys(pointsMap);
    const benchPlayers = rosterPlayers.filter((pid) => pid && pid !== "0" && !startersSet.has(pid));
    let benchTotal = 0;
    benchPlayers.forEach((pid) => {
      const p = pointsMap[pid] ?? 0;
      benchTotal += p;
      if (p > benchStudVal) { benchStudVal = p; benchStud = [{ rosterId: m.roster_id, playerId: pid, points: p }]; }
      else if (p === benchStudVal) { benchStud.push({ rosterId: m.roster_id, playerId: pid, points: p }); }
    });
    if (benchTotal > benchTragedyVal) { benchTragedyVal = benchTotal; benchTragedy = [{ rosterId: m.roster_id, points: benchTotal }]; }
    else if (benchTotal === benchTragedyVal) { benchTragedy.push({ rosterId: m.roster_id, points: benchTotal }); }

    // Best individual performance at each of the four skill positions,
    // regardless of whether the player actually started that week.
    rosterPlayers.forEach((pid) => {
      if (!pid || pid === "0") return;
      const pos = playersDict?.[pid]?.position;
      if (!pos || !(pos in positionBestVal)) return;
      const p = pointsMap[pid] ?? 0;
      if (p > positionBestVal[pos]) { positionBestVal[pos] = p; positionBest[pos] = [{ rosterId: m.roster_id, playerId: pid, points: p }]; }
      else if (p === positionBestVal[pos]) { positionBest[pos].push({ rosterId: m.roster_id, playerId: pid, points: p }); }
    });
  });

  let closestVal = Infinity, closest = [];
  let blowoutVal = -Infinity, blowout = [];
  pairs.forEach((pair) => {
    if (pair.length === 2) {
      const [a, b] = pair;
      const aPts = a.points ?? 0, bPts = b.points ?? 0;
      const margin = Math.abs(aPts - bPts);
      const winnerRid = aPts >= bPts ? a.roster_id : b.roster_id;
      const loserRid = winnerRid === a.roster_id ? b.roster_id : a.roster_id;
      const entry = { margin, winnerRid, loserRid };
      if (margin < closestVal) { closestVal = margin; closest = [entry]; }
      else if (margin === closestVal) { closest.push(entry); }
      if (margin > blowoutVal) { blowoutVal = margin; blowout = [entry]; }
      else if (margin === blowoutVal) { blowout.push(entry); }
    }
  });

  // Whoever's score landed closest to the week's average, for better or
  // (mostly) for a laugh.
  let deadEven = [];
  if (matchups.length > 0) {
    const avg = matchups.reduce((s, m) => s + (m.points ?? 0), 0) / matchups.length;
    let deadEvenVal = Infinity;
    matchups.forEach((m) => {
      const pts = m.points ?? 0;
      const diff = Math.abs(pts - avg);
      if (diff < deadEvenVal) { deadEvenVal = diff; deadEven = [{ rosterId: m.roster_id, points: pts, diff, avg }]; }
      else if (diff === deadEvenVal) { deadEven.push({ rosterId: m.roster_id, points: pts, diff, avg }); }
    });
  }

  return {
    pairs, highScore, lowScore, stud, dud, closest, blowout,
    benchTragedy, benchStud, oneManShow, zeroClub, positionBest, deadEven,
  };
}

// Win/loss/tie record for every roster using only weeks strictly before
// throughWeek, so a matchup can be judged against what each team's record
// actually was walking in (used for the upset call-out).
function computeRecordsThroughWeek(weekMatchups, throughWeek) {
  const records = {};
  Object.keys(weekMatchups || {})
    .map(Number)
    .filter((w) => w < throughWeek)
    .sort((a, b) => a - b)
    .forEach((week) => {
      groupByMatchupId(weekMatchups[week]).forEach((pair) => {
        if (pair.length !== 2) return;
        const [a, b] = pair;
        const aPts = a.points ?? 0, bPts = b.points ?? 0;
        if (!records[a.roster_id]) records[a.roster_id] = { w: 0, l: 0, t: 0 };
        if (!records[b.roster_id]) records[b.roster_id] = { w: 0, l: 0, t: 0 };
        if (aPts === bPts) { records[a.roster_id].t++; records[b.roster_id].t++; }
        else if (aPts > bPts) { records[a.roster_id].w++; records[b.roster_id].l++; }
        else { records[b.roster_id].w++; records[a.roster_id].l++; }
      });
    });
  return records;
}

function winPct(rec) {
  if (!rec) return 0;
  const g = rec.w + rec.l + rec.t;
  return g ? (rec.w + rec.t * 0.5) / g : 0;
}

// Same shape as the site-wide computeStreaks, but capped at a given week so
// the Recap tab can show what a team's streak looked like at that point in
// the season rather than always the season-to-date streak.
function computeStreaksThroughWeek(weekMatchups, throughWeek) {
  const weeks = Object.keys(weekMatchups || {}).map(Number).filter((w) => w <= throughWeek).sort((a, b) => a - b);
  const resultsByRoster = {};
  weeks.forEach((week) => {
    groupByMatchupId(weekMatchups[week]).forEach((pair) => {
      if (pair.length !== 2) return;
      const [a, b] = pair;
      const aPts = a.points ?? 0, bPts = b.points ?? 0;
      let ra, rb;
      if (aPts === bPts) { ra = "T"; rb = "T"; }
      else if (aPts > bPts) { ra = "W"; rb = "L"; }
      else { ra = "L"; rb = "W"; }
      if (!resultsByRoster[a.roster_id]) resultsByRoster[a.roster_id] = [];
      if (!resultsByRoster[b.roster_id]) resultsByRoster[b.roster_id] = [];
      resultsByRoster[a.roster_id].push(ra);
      resultsByRoster[b.roster_id].push(rb);
    });
  });
  const streaks = {};
  Object.entries(resultsByRoster).forEach(([rid, results]) => {
    if (results.length === 0) return;
    const last = results[results.length - 1];
    let count = 0;
    for (let i = results.length - 1; i >= 0; i--) {
      if (results[i] === last) count++;
      else break;
    }
    streaks[rid] = { type: last, count };
  });
  return streaks;
}

function pickLongestStreak(streaks) {
  let best = null;
  Object.entries(streaks || {}).forEach(([rid, s]) => {
    if (s.count >= 3 && (!best || s.count > best.count)) {
      best = { rosterId: rid, type: s.type, count: s.count };
    }
  });
  return best;
}

// Flags the matchup where the winner had the worse record walking in, by
// the widest margin. Skipped entirely in Week 1, when nobody has a record yet.
function computeUpset(pairs, recordsBefore) {
  let upset = null;
  pairs.forEach((pair) => {
    if (pair.length !== 2) return;
    const [a, b] = pair;
    const aPts = a.points ?? 0, bPts = b.points ?? 0;
    if (aPts === bPts) return;
    const winnerRid = aPts > bPts ? a.roster_id : b.roster_id;
    const loserRid = winnerRid === a.roster_id ? b.roster_id : a.roster_id;
    const winnerRec = recordsBefore[winnerRid];
    const loserRec = recordsBefore[loserRid];
    const winnerGames = winnerRec ? winnerRec.w + winnerRec.l + winnerRec.t : 0;
    const loserGames = loserRec ? loserRec.w + loserRec.l + loserRec.t : 0;
    if (winnerGames === 0 || loserGames === 0) return;
    const gap = winPct(loserRec) - winPct(winnerRec);
    if (gap > 0.15 && (!upset || gap > upset.gap)) {
      upset = { winnerRid, loserRid, gap, winnerRec, loserRec };
    }
  });
  return upset;
}

// All-play luck for the selected week only: a "lucky" win is one where the
// winner beat less than half the league on points; an "unlucky" loss is one
// where the loser outscored more than half the league and still lost.
function computeWeeklyLuck(matchups, pairs) {
  const n = (matchups || []).length;
  if (n < 2) return { luckyWin: null, unluckyLoss: null };
  const beatShare = {};
  matchups.forEach((m) => {
    let beat = 0;
    matchups.forEach((other) => {
      if (other.roster_id !== m.roster_id && (m.points ?? 0) > (other.points ?? 0)) beat++;
    });
    beatShare[m.roster_id] = beat / (n - 1);
  });
  let luckyWin = null, unluckyLoss = null;
  pairs.forEach((pair) => {
    if (pair.length !== 2) return;
    const [a, b] = pair;
    const aPts = a.points ?? 0, bPts = b.points ?? 0;
    if (aPts === bPts) return;
    const winnerRid = aPts > bPts ? a.roster_id : b.roster_id;
    const loserRid = winnerRid === a.roster_id ? b.roster_id : a.roster_id;
    const winnerShare = beatShare[winnerRid];
    const loserShare = beatShare[loserRid];
    if (winnerShare < 0.5 && (!luckyWin || winnerShare < luckyWin.share)) {
      luckyWin = { rosterId: winnerRid, share: winnerShare };
    }
    if (loserShare > 0.5 && (!unluckyLoss || loserShare > unluckyLoss.share)) {
      unluckyLoss = { rosterId: loserRid, share: loserShare };
    }
  });
  return { luckyWin, unluckyLoss };
}

// Deterministic per-week, per-fact hash so the same category doesn't always
// land on the same phrase two weeks running just because arrays are short.
function hashSeed(...parts) {
  let h = 0;
  const str = parts.join("|");
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}

function pick(arr, seed) {
  return arr[((seed % arr.length) + arr.length) % arr.length];
}

// Joins a list of strings the human way: "A", "A & B", "A, B, & C" - used
// wherever a stat has multiple tied entries instead of a single winner.
function joinList(items) {
  if (items.length === 0) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return `${items[0]} & ${items[1]}`;
  return `${items.slice(0, -1).join(", ")}, & ${items[items.length - 1]}`;
}

// Single source of truth for turning a tied recap entry (or list of them)
// into plain names. The narrative, the stat cards, and the share image all
// read the exact same resolved names here - each just decides on its own
// how to present them (joined into prose, joined into one card line, or
// stacked as separate lines), since each context wants a different shape.
function resolveTiedTeams(entries, ownerFor) {
  return [...new Set(entries.map((e) => teamName(ownerFor(e.rosterId))))];
}
function resolveTiedPlayers(entries, playerLabel, ownerFor) {
  return entries.map((e) => ({ player: playerLabel(e.playerId), team: teamName(ownerFor(e.rosterId)) }));
}
function resolveTiedPairs(entries, ownerFor) {
  return entries.map((e) => ({ winner: teamName(ownerFor(e.winnerRid)), loser: teamName(ownerFor(e.loserRid)) }));
}
